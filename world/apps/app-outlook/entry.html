<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outlook</title>
  <style>
    :root {
      --brand: #0f6cbd;
      --brand-strong: #115ea3;
      --brand-soft: color-mix(in srgb, var(--brand) 14%, var(--vibe-surface));
      --vibe-focus: color-mix(in srgb, var(--brand) 68%, transparent);
      --success: #107c10;
      --danger: #c42b1c;
      --shadow: 0 16px 40px color-mix(in srgb, var(--vibe-text) 14%, transparent);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--vibe-surface);
      color: var(--vibe-text);
      font-family: var(--vibe-font-ui);
      font-size: var(--vibe-text-body);
      line-height: var(--vibe-line-normal);
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--vibe-focus);
      outline-offset: 2px;
    }
    .app { height: 100%; min-width: 0; display: flex; flex-direction: column; background: var(--vibe-surface); }
    .topbar { min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--vibe-border); background: var(--vibe-raised); }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 174px; font-weight: 700; letter-spacing: -.02em; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--brand); color: #fff; }
    .brand-mark svg { width: 20px; height: 20px; }
    .top-actions { display: flex; align-items: center; gap: 5px; margin-left: auto; }
    .icon-btn, .plain-btn { border: 0; background: transparent; border-radius: 6px; cursor: pointer; }
    .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; }
    .icon-btn:hover, .plain-btn:hover { background: var(--vibe-control); }
    .icon-btn svg, .plain-btn svg { width: 18px; height: 18px; }
    .avatar { width: 29px; height: 29px; border-radius: 50%; display: grid; place-items: center; background: #8661c5; color: #fff; font-size: var(--vibe-text-label); font-weight: 700; }
    .search { flex: 1 1 440px; max-width: 610px; position: relative; }
    .search svg { position: absolute; left: 12px; top: 10px; width: 17px; height: 17px; color: var(--vibe-muted); }
    .search input { width: 100%; height: 36px; padding: 0 38px; border: 1px solid var(--vibe-border); border-radius: 5px; background: var(--vibe-control); color: var(--vibe-text); }
    .shell { flex: 1; min-height: 0; display: flex; overflow: hidden; }
    .sidebar { width: 210px; flex: 0 0 210px; padding: 15px 10px; overflow-y: auto; border-right: 1px solid var(--vibe-border); background: var(--vibe-raised); }
    .compose-btn { width: 100%; height: 42px; display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 17px; border: 0; border-radius: 5px; cursor: pointer; background: var(--brand); color: #fff; font-weight: 700; box-shadow: 0 3px 8px color-mix(in srgb, var(--brand) 24%, transparent); }
    .compose-btn:hover { background: var(--brand-strong); }
    .compose-btn svg { width: 18px; height: 18px; }
    .section-label { padding: 0 11px 6px; color: var(--vibe-muted); font-size: var(--vibe-text-caption); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .folder { width: 100%; height: 35px; display: flex; align-items: center; gap: 11px; padding: 0 11px; border: 0; border-radius: 5px; background: transparent; cursor: pointer; text-align: left; }
    .folder:hover { background: var(--vibe-control); }
    .folder.active { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
    .folder svg { width: 17px; height: 17px; flex: none; }
    .folder span:nth-child(2) { flex: 1; }
    .count { color: var(--vibe-muted); font-size: var(--vibe-text-label); }
    .folder.active .count { color: var(--brand); }
    .nav-divider { height: 1px; margin: 14px 11px; background: var(--vibe-border); }
    .content { flex: 1; min-width: 0; display: flex; overflow: hidden; }
    .mail-list { width: min(390px, 42%); min-width: 275px; display: flex; flex-direction: column; border-right: 1px solid var(--vibe-border); background: var(--vibe-surface); }
    .list-head { padding: 17px 17px 10px; border-bottom: 1px solid var(--vibe-border); }
    .list-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 13px; }
    .list-heading h1 { margin: 0; font-size: var(--vibe-text-heading); line-height: var(--vibe-line-tight); letter-spacing: -.035em; }
    .list-tools { display: flex; gap: 3px; }
    .tabs { display: flex; gap: 18px; }
    .tab { position: relative; padding: 6px 0 10px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--vibe-muted); cursor: pointer; font-size: var(--vibe-text-label); font-weight: 700; }
    .tab:hover, .tab.active { color: var(--brand); }
    .tab.active { border-bottom-color: var(--brand); }
    .mail-items { flex: 1; min-height: 0; overflow-y: auto; }
    .mail-row { position: relative; display: grid; grid-template-columns: 22px 1fr auto; gap: 7px; padding: 13px 13px 12px 16px; border-bottom: 1px solid var(--vibe-border); cursor: pointer; }
    .mail-row:hover { background: color-mix(in srgb, var(--vibe-control) 45%, transparent); }
    .mail-row.selected { background: var(--brand-soft); box-shadow: inset 3px 0 0 var(--brand); }
    .mail-row.unread .sender, .mail-row.unread .subject { font-weight: 750; }
    .check { appearance: none; width: 16px; height: 16px; margin: 2px 0 0; border: 1px solid var(--vibe-muted); border-radius: 3px; background: transparent; cursor: pointer; }
    .check:checked { border-color: var(--brand); background: var(--brand); box-shadow: inset 0 0 0 3px var(--vibe-surface); }
    .mail-main { min-width: 0; }
    .sender-line, .subject-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .sender { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--vibe-text-label); }
    .preview { overflow: hidden; margin-top: 3px; color: var(--vibe-muted); font-size: var(--vibe-text-label); text-overflow: ellipsis; white-space: nowrap; }
    .mail-meta { display: flex; align-items: flex-end; flex-direction: column; gap: 7px; color: var(--vibe-muted); font-size: var(--vibe-text-caption); white-space: nowrap; }
    .star { padding: 0; border: 0; background: none; color: var(--vibe-muted); cursor: pointer; }
    .star.active { color: #e3a008; }
    .star svg { width: 16px; height: 16px; }
    .empty { display: grid; place-items: center; height: 100%; padding: 30px; color: var(--vibe-muted); text-align: center; }
    .empty svg { width: 45px; height: 45px; margin-bottom: 12px; color: var(--brand); }
    .reading { flex: 1; min-width: 0; overflow-y: auto; background: var(--vibe-raised); }
    .reading-empty { height: 100%; display: grid; place-items: center; color: var(--vibe-muted); text-align: center; padding: 35px; }
    .reading-empty svg { width: 56px; height: 56px; margin-bottom: 14px; color: var(--brand); }
    .message { max-width: 860px; margin: 0 auto; padding: 25px 34px 40px; }
    .message-toolbar { display: flex; gap: 3px; justify-content: flex-end; padding-bottom: 19px; border-bottom: 1px solid var(--vibe-border); }
    .message-title { margin: 26px 0 13px; font-size: clamp(20px, 2vw, 28px); line-height: var(--vibe-line-tight); letter-spacing: -.035em; }
    .message-person { display: flex; gap: 11px; align-items: center; }
    .person-avatar { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 750; background: #2b88d8; }
    .person-info { min-width: 0; }
    .person-name { font-weight: 700; }
    .person-detail { color: var(--vibe-muted); font-size: var(--vibe-text-label); }
    .message-date { margin-left: auto; color: var(--vibe-muted); font-size: var(--vibe-text-label); }
    .message-body { margin: 28px 0; max-width: 690px; color: var(--vibe-text); white-space: pre-line; line-height: 1.72; }
    .message-body p { margin: 0 0 16px; }
    .message-actions { display: flex; gap: 8px; padding-top: 18px; border-top: 1px solid var(--vibe-border); }
    .action-btn { display: inline-flex; align-items: center; gap: 7px; height: 35px; padding: 0 13px; border: 1px solid var(--vibe-border); border-radius: 5px; background: var(--vibe-control); cursor: pointer; font-size: var(--vibe-text-label); font-weight: 650; }
    .action-btn:hover { border-color: var(--brand); color: var(--brand); }
    .action-btn svg { width: 16px; height: 16px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 20; padding: 11px 15px; border-radius: 5px; background: var(--vibe-text); color: var(--vibe-surface); box-shadow: var(--shadow); font-size: var(--vibe-text-label); animation: rise .18s ease-out; }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 18px; background: color-mix(in srgb, var(--vibe-text) 38%, transparent); }
    .compose { width: min(620px, 100%); max-height: min(720px, 100%); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--vibe-border); border-radius: 8px; background: var(--vibe-raised); box-shadow: var(--shadow); }
    .compose-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--brand); color: #fff; }
    .compose-head strong { font-size: var(--vibe-text-title); }
    .compose-head button { width: 30px; height: 30px; border: 0; border-radius: 5px; background: transparent; color: inherit; cursor: pointer; }
    .compose-head button:hover { background: #ffffff26; }
    .compose-fields { padding: 6px 18px 0; }
    .field-row { display: flex; align-items: center; gap: 9px; min-height: 42px; border-bottom: 1px solid var(--vibe-border); }
    .field-row label { width: 56px; flex: none; color: var(--vibe-muted); font-size: var(--vibe-text-label); }
    .field-row input, .field-row textarea { width: 100%; min-width: 0; padding: 7px 0; border: 0; outline: 0; background: transparent; color: var(--vibe-text); }
    .field-row textarea { min-height: 215px; resize: vertical; line-height: 1.55; }
    .cc-toggle { margin-left: auto; border: 0; background: none; color: var(--brand); cursor: pointer; font-size: var(--vibe-text-label); }
    .compose-foot { display: flex; align-items: center; gap: 9px; padding: 14px 18px; border-top: 1px solid var(--vibe-border); }
    .send-btn { height: 36px; padding: 0 20px; border: 0; border-radius: 4px; background: var(--brand); color: #fff; cursor: pointer; font-weight: 700; }
    .send-btn:hover { background: var(--brand-strong); }
    .save-btn { height: 36px; padding: 0 13px; border: 1px solid var(--vibe-border); border-radius: 4px; background: transparent; cursor: pointer; font-size: var(--vibe-text-label); }
    .discard-btn { margin-left: auto; width: 34px; height: 34px; border: 0; border-radius: 4px; background: transparent; color: var(--vibe-muted); cursor: pointer; }
    .discard-btn:hover { background: var(--vibe-control); color: var(--danger); }
    .help-card { width: min(420px, 100%); padding: 25px; border-radius: 8px; background: var(--vibe-raised); box-shadow: var(--shadow); }
    .help-card h2 { margin: 0 0 8px; font-size: var(--vibe-text-title); }
    .help-card p { color: var(--vibe-muted); }
    .help-card button { height: 35px; padding: 0 14px; border: 1px solid var(--vibe-border); border-radius: 5px; background: var(--vibe-control); cursor: pointer; }
    .mobile-only { display: none; }
    @media (max-width: 860px) {
      .brand { min-width: auto; }
      .brand span { display: none; }
      .sidebar { width: 180px; flex-basis: 180px; }
      .mail-list { width: 42%; min-width: 240px; }
      .message { padding-left: 24px; padding-right: 24px; }
    }
    @media (max-width: 650px) {
      .topbar { gap: 6px; padding: 8px; }
      .search { order: 5; flex-basis: 100%; max-width: none; }
      .topbar { flex-wrap: wrap; }
      .top-actions { margin-left: auto; }
      .shell { position: relative; }
      .sidebar { position: absolute; z-index: 3; inset: 0 auto 0 0; width: 210px; transform: translateX(-100%); transition: transform .18s ease; box-shadow: var(--shadow); }
      .sidebar.open { transform: translateX(0); }
      .mobile-only { display: grid; }
      .mail-list { width: 100%; min-width: 0; border-right: 0; }
      .reading { position: absolute; z-index: 2; inset: 0; transform: translateX(100%); transition: transform .18s ease; }
      .reading.open { transform: translateX(0); }
      .message { padding: 18px; }
      .message-date { display: none; }
      .back-btn { display: grid; }
    }
    @media (min-width: 651px) { .back-btn { display: none; } }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script>
    (() => {
      const icons = {
        menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
        search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',
        refresh: '<path d="M20 11a8 8 0 0 0-14.8-3.9L3 10"/><path d="M3 5v5h5M4 13a8 8 0 0 0 14.8 3.9L21 14"/><path d="M21 19v-5h-5"/>',
        settings: '<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1a2 2 0 0 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.2a2 2 0 0 1-4 0v-.2a2 2 0 0 0-3.4-1.4l-.1.1A2 2 0 0 1 3 15.1l.1-.1A2 2 0 0 0 1.7 11.6h-.2a2 2 0 0 1 0-4h.2A2 2 0 0 0 3.1 4.2L3 4.1a2 2 0 0 1 2.8-2.8l.1.1A2 2 0 0 0 9.3.1h.2a2 2 0 0 1 4 0v.2A2 2 0 0 0 16.9 1.7l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1A2 2 0 0 0 21 7.9h.2a2 2 0 0 1 0 4H21a2 2 0 0 0-1.6 3.1Z" transform="translate(1 1) scale(.91)"/>',
        help: '<circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 1 1 4.3 1.5c-.8.9-2 1.2-2 2.5M12 16.5h.01"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        inbox: '<path d="M4 5.5h16v13H4z"/><path d="M4 14h4l1.4 2h5.2L16 14h4"/>',
        star: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/>',
        draft: '<path d="M4 4h16v16H4z"/><path d="m7 15 2.7-.6L17 7.1 14.9 5l-7.3 7.3L7 15Z"/><path d="m13.8 6.1 2.1 2.1"/>',
        sent: '<path d="m3 4 18 8-18 8 3.1-8L3 4Z"/><path d="M6 12h15"/>',
        archive: '<path d="M4 7h16v12H4zM3 4h18v3H3z"/><path d="M9 12h6"/>',
        trash: '<path d="M5 7h14M10 11v5M14 11v5M7 7l1 13h8l1-13M9 4h6l1 3H8l1-3Z"/>',
        more: '<circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/>',
        arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
        reply: '<path d="M9 8 4 12l5 4v-3c5 0 7 1 10 4-1-5-3-9-10-9V8Z"/>',
        forward: '<path d="m15 8 5 4-5 4v-3c-5 0-7 1-10 4 1-5 3-9 10-9V8Z"/>',
        close: '<path d="m6 6 12 12M18 6 6 18"/>',
        paperclip: '<path d="m8.5 12.5 5.8-5.8a3 3 0 1 1 4.2 4.2l-7.7 7.7a4.5 4.5 0 0 1-6.4-6.4l7.2-7.2"/>',
        mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>',
        check: '<path d="m5 12 4 4L19 6"/>'
      };
      const svg = (name, cls = '') => '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + icons[name] + '</svg>';
      const initialEmails = [
        { id: 'e1', sender: 'Maya Chen', email: 'maya.chen@northstar.co', subject: 'Design review — Thursday agenda', preview: 'I pulled together the latest notes and a short agenda for our review.', body: 'Hi Alex,\n\nI pulled together the latest notes and a short agenda for our review on Thursday. The new navigation concepts are in the second section, followed by the open questions from research.\n\nCould you take a look before 3pm tomorrow? I would especially value your thoughts on the mobile states.\n\nThanks,\nMaya', time: '9:42 AM', date: 'Today, 9:42 AM', unread: true, starred: true, folder: 'inbox', tab: 'focused', color: '#2878bf' },
        { id: 'e2', sender: 'Jordan Williams', email: 'jordan@riverview.studio', subject: 'Re: Q3 launch checklist', preview: 'The final accessibility pass is complete. I marked the two remaining items.', body: 'Hi Alex,\n\nThe final accessibility pass is complete. I marked the two remaining items in the checklist and added screenshots for context.\n\nEverything else is ready for the release window.\n\nJordan', time: 'Yesterday', date: 'Yesterday, 4:18 PM', unread: true, starred: false, folder: 'inbox', tab: 'focused', color: '#b45d28' },
        { id: 'e3', sender: 'Priya Raman', email: 'priya@atlaspartners.com', subject: 'Your account team is here', preview: 'A quick introduction to your new customer success team.', body: 'Hello Alex,\n\nI wanted to introduce myself as your new customer success partner. I am here to help your team get the most from the workspace.\n\nWould next Tuesday work for a 20-minute introduction?', time: 'Yesterday', date: 'Yesterday, 11:05 AM', unread: false, starred: false, folder: 'inbox', tab: 'other', color: '#6c58a4' },
        { id: 'e4', sender: 'The Morning Brief', email: 'brief@dailyledger.news', subject: 'Monday: The ideas shaping product teams', preview: 'Five thoughtful reads for your commute.', body: 'Good morning,\n\nHere are five thoughtful reads for your commute, including a field guide to calm product launches and an interview with the team behind the city archive.', time: 'Mon', date: 'Monday, 7:30 AM', unread: false, starred: true, folder: 'inbox', tab: 'other', color: '#38855b' },
        { id: 'e5', sender: 'Sam Ortiz', email: 'sam.ortiz@northstar.co', subject: 'Lunch next week?', preview: 'I will be downtown Tuesday and Wednesday if either works.', body: 'Hey Alex,\n\nI will be downtown Tuesday and Wednesday if either works for lunch. I found a new spot near the station that looks promising.\n\nSam', time: 'Sun', date: 'Sunday, 2:14 PM', unread: false, starred: false, folder: 'inbox', tab: 'focused', color: '#ba4d75' }
      ];
      const defaultState = { folder: 'inbox', tab: 'focused', query: '', selectedId: 'e1', selectedIds: [], emails: initialEmails, drafts: [], compose: null, sidebarOpen: false, readingOpen: false, sortNewest: true };
      let state = structuredClone(defaultState);
      let toastTimer;
      const app = document.getElementById('app');
      const storageKey = 'outlook-root-state';
      const bridge = window.vibeOS;
      const iconButton = (name, label, cls = 'icon-btn') => '<button type="button" class="' + cls + '" data-action="' + name + '" aria-label="' + label + '" title="' + label + '">' + svg(name) + '</button>';
      const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
      const save = async () => {
        const copy = { ...state, compose: null, sidebarOpen: false, readingOpen: false };
        try {
          if (bridge?.storage?.write) await bridge.storage.write(storageKey, copy);
          else localStorage.setItem(storageKey, JSON.stringify(copy));
        } catch (_) { /* The message list remains usable if persistence is unavailable. */ }
      };
      const notify = async (message, level = 'info') => {
        if (bridge?.notify) await bridge.notify(message, { level, timeoutMs: 2400 });
        else {
          clearTimeout(toastTimer);
          const old = document.querySelector('.toast'); if (old) old.remove();
          const el = document.createElement('div'); el.className = 'toast'; el.textContent = message; document.body.appendChild(el);
          toastTimer = setTimeout(() => el.remove(), 2400);
        }
      };
      const load = async () => {
        try {
          const saved = bridge?.storage?.read ? await bridge.storage.read(storageKey) : JSON.parse(localStorage.getItem(storageKey) || 'null');
          if (saved && Array.isArray(saved.emails)) state = { ...defaultState, ...saved, compose: null, sidebarOpen: false, readingOpen: false };
        } catch (_) { /* Start with the built-in inbox when no saved mailbox exists. */ }
        render();
      };
      const folderLabel = { inbox: 'Inbox', starred: 'Starred', drafts: 'Drafts', sent: 'Sent', archive: 'Archive', deleted: 'Deleted' };
      const visibleEmails = () => {
        let list = state.emails.filter(email => {
          const inFolder = state.folder === 'starred' ? email.starred && email.folder !== 'deleted' : email.folder === state.folder;
          const inTab = state.folder === 'inbox' ? email.tab === state.tab : true;
          const q = state.query.trim().toLowerCase();
          return inFolder && inTab && (!q || [email.sender, email.subject, email.preview].join(' ').toLowerCase().includes(q));
        });
        return list.sort((a, b) => state.sortNewest ? b.id.localeCompare(a.id) : a.id.localeCompare(b.id));
      };
      const unreadCount = folder => state.emails.filter(e => e.folder === folder && e.unread).length;
      const folderCount = folder => folder === 'starred' ? state.emails.filter(e => e.starred && e.folder !== 'deleted').length : state.emails.filter(e => e.folder === folder).length;
      const avatar = (name, color) => '<span class="person-avatar" style="background:' + color + '">' + escapeHtml(name.split(' ').map(part => part[0]).slice(0, 2).join('')) + '</span>';
      function render() {
        const emails = visibleEmails();
        const selected = emails.find(email => email.id === state.selectedId) || emails[0] || null;
        if (selected) state.selectedId = selected.id;
        app.innerHTML = '<header class="topbar">' +
          iconButton('toggleSidebar', 'Open navigation', 'icon-btn mobile-only') +
          '<div class="brand"><span class="brand-mark">' + svg('mail') + '</span><span>Outlook</span></div>' +
          '<form class="search" data-form="search"><span>' + svg('search') + '</span><input name="query" value="' + escapeHtml(state.query) + '" aria-label="Search mail"></form>' +
          '<div class="top-actions">' + iconButton('refresh', 'Refresh') + iconButton('help', 'Help and feedback') + iconButton('settings', 'Settings') + '<span class="avatar" title="Alex Morgan">AM</span></div></header>' +
          '<div class="shell"><aside class="sidebar ' + (state.sidebarOpen ? 'open' : '') + '">' +
          '<button class="compose-btn" data-action="compose">' + svg('plus') + 'New mail</button>' +
          '<div class="section-label">Folders</div>' + folderButton('inbox', 'inbox', 'Inbox') + folderButton('starred', 'star', 'Starred') + folderButton('drafts', 'draft', 'Drafts') +
          '<div class="nav-divider"></div><div class="section-label">More</div>' + folderButton('sent', 'sent', 'Sent') + folderButton('archive', 'archive', 'Archive') + folderButton('deleted', 'trash', 'Deleted') +
          '</aside><main class="content"><section class="mail-list"><div class="list-head"><div class="list-heading"><h1>' + folderLabel[state.folder] + '</h1><div class="list-tools">' + iconButton('selectAll', 'Select all') + iconButton('refresh', 'Refresh') + iconButton('sort', state.sortNewest ? 'Oldest first' : 'Newest first') + '</div></div>' +
          (state.folder === 'inbox' ? '<div class="tabs"><button class="tab ' + (state.tab === 'focused' ? 'active' : '') + '" data-tab="focused">Focused</button><button class="tab ' + (state.tab === 'other' ? 'active' : '') + '" data-tab="other">Other</button></div>' : '') +
          '</div><div class="mail-items">' + (emails.length ? emails.map(mailRow).join('') : emptyState()) + '</div></section><section class="reading ' + (state.readingOpen ? 'open' : '') + '">' + (selected ? messageView(selected) : readingEmpty()) + '</section></main></div>' + (state.compose ? composeView() : '') + (state.help ? helpView() : '') + (state.settings ? settingsView() : '');
      }
      function folderButton(id, icon, label) { return '<button class="folder ' + (state.folder === id ? 'active' : '') + '" data-folder="' + id + '">' + svg(icon) + '<span>' + label + '</span><span class="count">' + (id === 'inbox' ? unreadCount(id) : folderCount(id)) + '</span></button>'; }
      function mailRow(email) { return '<article class="mail-row ' + (email.id === state.selectedId ? 'selected ' : '') + (email.unread ? 'unread' : '') + '" data-email="' + email.id + '"><input class="check" type="checkbox" data-select="' + email.id + '" ' + (state.selectedIds.includes(email.id) ? 'checked' : '') + ' aria-label="Select email from ' + escapeHtml(email.sender) + '"><div class="mail-main"><div class="sender-line"><span class="sender">' + escapeHtml(email.sender) + '</span>' + (email.unread ? '<span aria-label="Unread" style="width:6px;height:6px;border-radius:50%;background:var(--brand)"></span>' : '') + '</div><div class="subject-line"><span class="subject">' + escapeHtml(email.subject) + '</span></div><div class="preview">' + escapeHtml(email.preview) + '</div></div><div class="mail-meta"><span>' + escapeHtml(email.time) + '</span><button class="star ' + (email.starred ? 'active' : '') + '" data-star="' + email.id + '" aria-label="' + (email.starred ? 'Remove star' : 'Star') + '">' + svg('star') + '</button></div></article>'; }
      function emptyState() { return '<div class="empty">' + svg('mail') + '<div><strong>No messages here</strong><br><span>Try another folder or search.</span></div></div>'; }
      function readingEmpty() { return '<div class="reading-empty">' + svg('mail') + '<div><strong>Select a message to read</strong><br><span>Your selected message will appear here.</span></div></div>'; }
      function messageView(email) { return '<article class="message"><div class="message-toolbar">' + iconButton('back', 'Back to messages', 'icon-btn back-btn') + iconButton('archiveSelected', 'Archive') + iconButton('deleteSelected', 'Delete') + iconButton('moreMessage', 'More options') + '</div><h2 class="message-title">' + escapeHtml(email.subject) + '</h2><div class="message-person">' + avatar(email.sender, email.color) + '<div class="person-info"><div class="person-name">' + escapeHtml(email.sender) + '</div><div class="person-detail">' + escapeHtml(email.email) + '</div></div><span class="message-date">' + escapeHtml(email.date) + '</span></div><div class="message-body">' + escapeHtml(email.body) + '</div><div class="message-actions"><button class="action-btn" data-action="reply">' + svg('reply') + 'Reply</button><button class="action-btn" data-action="forward">' + svg('forward') + 'Forward</button></div></article>'; }
      function composeView() { const c = state.compose; return '<div class="modal-backdrop" data-action="closeCompose"><section class="compose" role="dialog" aria-modal="true" aria-labelledby="compose-title"><div class="compose-head"><strong id="compose-title">' + (c.reply ? 'Reply' : 'New message') + '</strong><button type="button" data-action="closeCompose" aria-label="Close">' + svg('close') + '</button></div><form data-form="compose"><div class="compose-fields"><div class="field-row"><label for="to">To</label><input id="to" name="to" type="email" value="' + escapeHtml(c.to) + '" aria-label="Recipient email" autocomplete="off" required><button type="button" class="cc-toggle" data-action="toggleCc">Cc</button></div>' + (c.showCc ? '<div class="field-row"><label for="cc">Cc</label><input id="cc" name="cc" value="' + escapeHtml(c.cc || '') + '" aria-label="Cc recipients"></div>' : '') + '<div class="field-row"><label for="subject">Subject</label><input id="subject" name="subject" value="' + escapeHtml(c.subject) + '" aria-label="Subject" required></div><div class="field-row"><label for="body">Message</label><textarea id="body" name="body" aria-label="Message body" required>' + escapeHtml(c.body) + '</textarea></div></div><div class="compose-foot"><button class="send-btn" type="submit">Send</button><button class="save-btn" type="button" data-action="saveDraft">Save draft</button><button class="discard-btn" type="button" data-action="discard" aria-label="Discard message" title="Discard message">' + svg('trash') + '</button></div></form></section></div>'; }
      function helpView() { return '<div class="modal-backdrop" data-action="closeHelp"><section class="help-card" role="dialog" aria-modal="true"><h2>Mail help</h2><p>Use the folder list to switch mailboxes, search across the current folder, and select a message to read it. New mail opens a full compose window.</p><button type="button" data-action="closeHelp">Done</button></section></div>'; }
      function settingsView() { return '<div class="modal-backdrop" data-action="closeSettings"><section class="help-card" role="dialog" aria-modal="true"><h2>Mailbox settings</h2><p>Choose how this mailbox behaves on this device.</p><label style="display:flex;align-items:center;gap:10px;margin:18px 0"><input type="checkbox" data-setting="confirmDelete" ' + (state.confirmDelete ? 'checked' : '') + '> Ask before moving messages to Deleted</label><label style="display:flex;align-items:center;gap:10px;margin-bottom:20px"><input type="checkbox" data-setting="markRead" ' + (state.markRead !== false ? 'checked' : '') + '> Mark messages read when opened</label><button type="button" data-action="closeSettings">Done</button></section></div>'; }
      function updateCompose(form) { const data = new FormData(form); state.compose = { ...state.compose, to: data.get('to') || '', cc: data.get('cc') || '', subject: data.get('subject') || '', body: data.get('body') || '' }; }
      async function handle(event) {
        const target = event.target;
        const actionEl = target.closest('[data-action]');
        const row = target.closest('[data-email]');
        if (target.closest('[data-select]')) { event.stopPropagation(); state.selectedIds = target.checked ? [...new Set([...state.selectedIds, target.dataset.select])] : state.selectedIds.filter(id => id !== target.dataset.select); render(); return; }
        if (target.closest('[data-star]')) { event.stopPropagation(); const email = state.emails.find(e => e.id === target.closest('[data-star]').dataset.star); if (email) email.starred = !email.starred; await save(); render(); return; }
        if (target.closest('[data-tab]')) { state.tab = target.closest('[data-tab]').dataset.tab; state.selectedId = visibleEmails()[0]?.id || null; state.readingOpen = false; render(); return; }
        if (target.closest('[data-folder]')) { state.folder = target.closest('[data-folder]').dataset.folder; state.tab = 'focused'; state.selectedId = visibleEmails()[0]?.id || null; state.selectedIds = []; state.readingOpen = false; state.sidebarOpen = false; render(); return; }
        if (row && !actionEl) { state.selectedId = row.dataset.email; const email = state.emails.find(e => e.id === state.selectedId); if (email && state.markRead !== false) email.unread = false; state.readingOpen = true; await save(); render(); return; }
        if (target.closest('[data-form="search"]')) return;
        if (target.closest('[data-form="compose"]')) return;
        if (!actionEl) return;
        const action = actionEl.dataset.action;
        if (action === 'toggleSidebar') { state.sidebarOpen = !state.sidebarOpen; render(); }
        else if (action === 'compose') { state.compose = { to: '', cc: '', subject: '', body: '', showCc: false }; render(); setTimeout(() => document.getElementById('to')?.focus(), 0); }
        else if (action === 'closeCompose') { if (target.classList.contains('modal-backdrop')) { state.compose = null; render(); } }
        else if (action === 'toggleCc') { state.compose.showCc = !state.compose.showCc; render(); }
        else if (action === 'saveDraft') { const form = document.querySelector('[data-form="compose"]'); updateCompose(form); if (state.compose.to || state.compose.subject || state.compose.body) { const draft = { ...state.compose, id: 'd' + Date.now(), sender: 'Draft', email: state.compose.to || 'No recipient', subject: state.compose.subject || '(No subject)', preview: state.compose.body.replace(/\s+/g, ' ').slice(0, 100) || 'Draft message', body: state.compose.body, time: 'Just now', date: 'Today, just now', unread: false, starred: false, folder: 'drafts', tab: 'focused', color: '#8661c5' }; state.emails.unshift(draft); state.drafts.push(draft); state.compose = null; await save(); render(); await notify('Draft saved', 'success'); } else { state.compose = null; render(); } }
        else if (action === 'discard') { state.compose = null; render(); }
        else if (action === 'refresh') { await notify('Inbox is up to date', 'success'); }
        else if (action === 'sort') { state.sortNewest = !state.sortNewest; render(); }
        else if (action === 'selectAll') { const ids = visibleEmails().map(e => e.id); state.selectedIds = state.selectedIds.length === ids.length ? [] : ids; render(); }
        else if (action === 'archiveSelected') { moveSelected('archive'); }
        else if (action === 'deleteSelected') { if (!state.confirmDelete || window.confirm('Move this message to Deleted?')) moveSelected('deleted'); }
        else if (action === 'back') { state.readingOpen = false; render(); }
        else if (action === 'reply' || action === 'forward') { const email = state.emails.find(e => e.id === state.selectedId); if (email) { state.compose = { to: action === 'reply' ? email.email : '', cc: '', subject: (action === 'reply' ? 'Re: ' : 'Fwd: ') + email.subject, body: action === 'reply' ? '\n\n— Original message —\n' + email.body : '\n\n— Forwarded message —\n' + email.body, reply: action === 'reply', showCc: false }; render(); setTimeout(() => document.getElementById('body')?.focus(), 0); } }
        else if (action === 'help') { state.help = true; render(); }
        else if (action === 'closeHelp') { state.help = false; render(); }
        else if (action === 'settings') { state.settings = true; render(); }
        else if (action === 'closeSettings') { state.settings = false; render(); }
        else if (action === 'moreMessage') { await notify('Choose an action from the message toolbar.'); }
      }
      function moveSelected(folder) { const ids = state.selectedIds.length ? state.selectedIds : (state.selectedId ? [state.selectedId] : []); if (!ids.length) return; state.emails.forEach(email => { if (ids.includes(email.id)) email.folder = folder; }); state.selectedIds = []; state.selectedId = visibleEmails()[0]?.id || null; state.readingOpen = false; save(); render(); notify(folder === 'archive' ? 'Message archived' : 'Message moved to Deleted', 'success'); }
      app.addEventListener('click', handle);
      app.addEventListener('submit', async event => { if (event.target.matches('[data-form="search"]')) { event.preventDefault(); state.query = new FormData(event.target).get('query') || ''; state.selectedId = visibleEmails()[0]?.id || null; render(); return; } if (event.target.matches('[data-form="compose"]')) { event.preventDefault(); const form = event.target; updateCompose(form); if (!state.compose.to || !state.compose.subject || !state.compose.body.trim()) { await notify('Add a recipient, subject, and message before sending.', 'warning'); return; } state.emails.unshift({ id: 's' + Date.now(), sender: 'Alex Morgan', email: 'alex.morgan@northstar.co', subject: state.compose.subject, preview: state.compose.body.replace(/\s+/g, ' ').slice(0, 100), body: state.compose.body, time: 'Just now', date: 'Today, just now', unread: false, starred: false, folder: 'sent', tab: 'focused', color: '#8661c5' }); state.compose = null; await save(); render(); await notify('Message sent', 'success'); } });
      app.addEventListener('input', event => { if (event.target.closest('[data-form="compose"]')) updateCompose(event.target.closest('form')); });
      app.addEventListener('change', event => { const setting = event.target.dataset.setting; if (setting) { state[setting] = event.target.checked; save(); } });
      load();
    })();
  </script>
</body>
</html>
