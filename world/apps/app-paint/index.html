<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paint</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="paint-app">
    <header class="toolbar">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 3C6.5 3 3 6.3 3 10.7c0 4 3.1 6.8 7 6.8h1.7c1.4 0 1.8.8 1.3 1.7-.6 1.1.3 2.1 1.6 1.8 3.9-.8 6.4-4 6.4-8.2C21 7.1 17 3 11.5 3Z" fill="currentColor"/><circle cx="7.6" cy="9" r="1.2" fill="var(--vibe-surface)"/><circle cx="11.7" cy="6.9" r="1.2" fill="var(--vibe-surface)"/><circle cx="15.3" cy="9.5" r="1.2" fill="var(--vibe-surface)"/></svg></span><span>Paint</span></div>
      <div class="actions"><button id="undo" class="icon-btn" title="Undo" aria-label="Undo">↶</button><button id="redo" class="icon-btn" title="Redo" aria-label="Redo">↷</button><button id="clear" class="text-btn">Clear canvas</button><button id="save" class="save-btn">Save</button></div>
    </header>
    <section class="workspace">
      <aside class="tools" aria-label="Drawing tools">
        <button class="tool active" data-tool="brush"><span class="tool-icon">✎</span><span>Brush</span></button>
        <button class="tool" data-tool="eraser"><span class="tool-icon">▱</span><span>Eraser</span></button>
        <label class="control-label" for="size">Size <output id="sizeValue">12</output></label><input id="size" type="range" min="2" max="64" value="12">
        <div class="swatches" aria-label="Colors"><button class="swatch active" data-color="#2d3142" style="--swatch:#2d3142" aria-label="Ink"></button><button class="swatch" data-color="#df5b56" style="--swatch:#df5b56" aria-label="Coral"></button><button class="swatch" data-color="#e4ad4f" style="--swatch:#e4ad4f" aria-label="Gold"></button><button class="swatch" data-color="#4a9b91" style="--swatch:#4a9b91" aria-label="Teal"></button><button class="swatch" data-color="#6c68b5" style="--swatch:#6c68b5" aria-label="Violet"></button><input id="custom" type="color" value="#2d3142" title="Custom color" aria-label="Custom color"></div>
      </aside>
      <div class="canvas-wrap"><div class="canvas-card"><canvas id="canvas" aria-label="Drawing canvas"></canvas></div><div class="hint">Draw with your pointer · <kbd>⌘ Z</kbd> to undo</div></div>
    </section>
  </main>
<script src="app.js"></script></body></html>
