<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zed</title>
<style>
:root{--bg:var(--vibe-surface,#191923);--panel:var(--vibe-raised,#242431);--control:var(--vibe-control,#303044);--text:var(--vibe-text,#f1f1f6);--muted:var(--vibe-muted,#aeb0c2);--line:var(--vibe-border,#ffffff22);--accent:var(--vibe-accent,#a89dfc);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);background:var(--bg)}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}.app{height:100%;display:grid;grid-template-rows:48px 1fr 28px}.top{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 14px;gap:14px}.brand{font:700 17px system-ui,sans-serif;letter-spacing:-.04em}.brand i{display:inline-block;width:9px;height:9px;background:var(--accent);transform:skew(-20deg);margin-right:6px}.file-title{color:var(--muted);font-size:12px;flex:1}.actions{display:flex;gap:6px}.button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:7px 10px;font:inherit;font-size:11px;cursor:pointer}.button:hover,.button.active{background:var(--control);color:var(--text)}.body{display:grid;grid-template-columns:220px 1fr;min-height:0}.side{border-right:1px solid var(--line);padding:18px 12px;background:color-mix(in srgb,var(--panel) 35%,transparent)}.side h2{font:600 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 8px 14px}.tree{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--text);padding:9px 10px;border-radius:5px;text-align:left;font:inherit;font-size:12px;cursor:pointer}.tree:hover,.tree.selected{background:var(--control)}.dot{width:7px;height:7px;border:1px solid var(--muted);border-radius:2px}.selected .dot{background:var(--accent);border-color:var(--accent)}.editor{min-width:0;display:grid;grid-template-rows:38px 1fr;min-height:0}.tabs{display:flex;align-items:end;border-bottom:1px solid var(--line);padding-left:18px}.tab{height:38px;padding:12px 18px 10px;border-right:1px solid var(--line);font-size:11px;color:var(--muted);cursor:pointer}.tab.active{color:var(--text);border-top:2px solid var(--accent);background:var(--panel)}.work{min-height:0;display:grid;grid-template-columns:44px 1fr;overflow:hidden}.gutter{padding-top:18px;text-align:right;color:var(--muted);opacity:.55;font-size:12px;line-height:24px;user-select:none}.surface{padding:18px 24px;overflow:auto;outline:none;font-size:13px;line-height:24px;white-space:pre-wrap;tab-size:2}.surface:focus{box-shadow:inset 2px 0 var(--accent)}.kw{color:var(--accent)}.str{color:#d8b77c}.comment{color:var(--muted)}.status{display:flex;align-items:center;gap:16px;padding:0 14px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.status span:first-child{color:var(--accent)}.save{color:var(--text)}@media(max-width:650px){.body{grid-template-columns:155px 1fr}.side{padding:14px 6px}.surface{padding:16px 12px}.actions .button:nth-child(2){display:none}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><i></i>zed</div><div class="file-title" id="fileTitle">welcome.js</div><div class="actions"><button class="button" id="newBtn">New</button><button class="button" id="saveBtn">Save</button><button class="button" id="findBtn">Find</button></div></header>
<section class="body"><nav class="side"><h2>Project</h2><button class="tree selected" data-file="welcome.js"><span class="dot"></span>welcome.js</button><button class="tree" data-file="notes.md"><span class="dot"></span>notes.md</button><button class="tree" data-file="theme.css"><span class="dot"></span>theme.css</button></nav><section class="editor"><div class="tabs"><div class="tab active" id="tab">welcome.js</div></div><div class="work"><div class="gutter" id="gutter">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10</div><article class="surface" id="surface" contenteditable="true" spellcheck="false" aria-label="Code editor"></article></div></section></section>
<footer class="status"><span>●</span><span id="mode">JavaScript</span><span>UTF-8</span><span>Spaces: 2</span><span class="save" id="state">Saved</span><span style="margin-left:auto">Ln 1, Col 1</span></footer>
</main><script>
const files={"welcome.js":`// A small beginning\nconst welcome = <span class="str">"Make something clear."</span>;\n\n<span class="kw">export default function</span> greet(name) {\n  <span class="kw">return</span> <span class="str">\`Hello, ${'${'}name}!\`</span>;\n}\n\nconsole.log(greet(<span class="str">"world"</span>));`,"notes.md":`<span class="kw"># Notes</span>\n\nKeep the surface calm.\n\n- One idea per function\n- Name things precisely\n- Leave room to think`,"theme.css":`<span class="kw">:root</span> {\n  --ink: <span class="str">#20202b</span>;\n  --paper: <span class="str">#f7f8fc</span>;\n}`};let current='welcome.js';const surface=document.getElementById('surface');function render(){surface.innerHTML=files[current];document.getElementById('fileTitle').textContent=current;document.getElementById('tab').textContent=current;document.getElementById('mode').textContent=current.endsWith('.md')?'Markdown':current.endsWith('.css')?'CSS':'JavaScript';document.querySelectorAll('.tree').forEach(x=>x.classList.toggle('selected',x.dataset.file===current))}render();surface.addEventListener('input',()=>{files[current]=surface.innerHTML;document.getElementById('state').textContent='Unsaved'});document.querySelectorAll('.tree').forEach(x=>x.onclick=()=>{current=x.dataset.file;render()});document.getElementById('saveBtn').onclick=()=>{document.getElementById('state').textContent='Saved';window.vibeOS?.notify('File saved',{level:'success',timeoutMs:1400})};document.getElementById('newBtn').onclick=()=>{const name='untitled.js';files[name]='';current=name;const b=document.createElement('button');b.className='tree selected';b.dataset.file=name;b.innerHTML='<span class="dot"></span>'+name;b.onclick=()=>{current=name;render()};document.querySelector('.side').appendChild(b);render();surface.focus()};document.getElementById('findBtn').onclick=()=>{const q=prompt('Find in '+current);if(q){const found=surface.textContent.indexOf(q)>=0;window.vibeOS?.notify(found?'Match found':'No matches',{level:found?'success':'info',timeoutMs:1400})}};
</script></body></html>
