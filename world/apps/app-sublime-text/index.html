<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sublime Text — Workspace</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar"><div class="brand"><span class="mark">S</span><span>Sublime Text</span></div><div class="window-actions"><button aria-label="Minimize">—</button><button aria-label="Maximize">□</button><button aria-label="Close">×</button></div></header>
  <nav class="menubar" aria-label="Application menu"><button class="menu-trigger" data-menu="fileMenu" aria-haspopup="true" aria-expanded="false">File</button><button class="menu-trigger" data-menu="editMenu" aria-haspopup="true" aria-expanded="false">Edit</button><button class="menu-trigger" data-menu="selectionMenu" aria-haspopup="true" aria-expanded="false">Selection</button><button class="menu-trigger" data-menu="findMenu" aria-haspopup="true" aria-expanded="false">Find</button><button class="menu-trigger" data-menu="viewMenu" aria-haspopup="true" aria-expanded="false">View</button><button class="menu-trigger" data-menu="gotoMenu" aria-haspopup="true" aria-expanded="false">Goto</button><button class="menu-trigger" data-menu="toolsMenu" aria-haspopup="true" aria-expanded="false">Tools</button><button class="menu-trigger" data-menu="projectMenu" aria-haspopup="true" aria-expanded="false">Project</button><button class="menu-trigger" data-menu="helpMenu" aria-haspopup="true" aria-expanded="false">Help</button><span class="spacer"></span><button id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☼</button></nav>
  <main class="workspace">
    <aside class="sidebar"><div class="side-head"><span>EXPLORER</span><button id="newFile" title="New file" disabled>＋</button></div><div class="project">⌄ <strong>MY PROJECT</strong></div><div class="tree"><button class="file active" data-file="app.js"><span class="js">JS</span> app.js</button><button class="file" data-file="index.html"><span class="html">&lt;&gt;</span> index.html</button><button class="file" data-file="styles.css"><span class="css">#</span> styles.css</button><button class="file" data-file="README.md"><span class="md">M</span> README.md</button></div><div class="indent-help"><strong>Editor</strong><span>Tab inserts indentation</span><span>Shift + Tab outdents</span><span>Enter continues syntax blocks</span></div></aside>
    <section class="editor"><div class="tabs"><button class="tab active" data-file="app.js"><span class="js">JS</span> app.js <span class="dot"></span><span class="close">×</span></button><button class="tab" data-file="index.html"><span class="html">&lt;&gt;</span> index.html <span class="close">×</span></button><button class="tab" data-file="styles.css"><span class="css">#</span> styles.css <span class="close">×</span></button><span class="tab-space"></span><button id="splitBtn" title="Split editor">▥</button></div><div class="crumb"><span>MY PROJECT</span><b>›</b><span id="crumbFile">app.js</span><span class="spacer"></span><span id="language">JavaScript</span><span>Spaces: 2</span><span>Ln 1, Col 1</span></div><div class="code-wrap"><div class="gutter" id="gutter">1</div><div class="code-editor"><pre id="highlight" aria-hidden="true"></pre><textarea id="editor" spellcheck="false" aria-label="Code editor"></textarea></div></div><div class="findbar hidden" id="findbar"><input id="findInput" placeholder="Find…"><span id="findCount"></span><button id="findClose">×</button></div></section>
  </main>
  <footer class="statusbar"><span class="ready-dot"></span><span id="status">Ready</span><span class="spacer"></span><button id="runBtn">▶ Run</button><button id="downloadBtn" title="Download the active file">↓ Save</button><span id="encoding">UTF-8</span><span>LF</span><span id="langStatus">JavaScript</span></footer>
  <style>.menu-popup{position:absolute;z-index:9;min-width:190px;padding:5px;background:var(--surface-raised);border:1px solid var(--outline);border-radius:6px;box-shadow:0 12px 28px #0006}.menu-popup button{display:block;width:100%;padding:8px 10px;background:transparent;border:0;border-radius:4px;color:var(--on-surface);text-align:left;cursor:pointer}.menu-popup button:hover{background:var(--control)}</style>
  <section class="output-panel" id="outputPanel" aria-live="polite"><div class="output-head"><strong>OUTPUT</strong><span id="runMeta">No run yet</span><button id="clearOutput">Clear</button></div><pre id="runOutput">Run a Python file to see stdout and errors here.</pre></section><div id="menuLayer"></div>
  <script src="app.js"></script>
</body></html>
