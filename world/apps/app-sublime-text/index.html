<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sublime Text — Workspace</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar"><div class="brand"><span class="mark">S</span><span>Sublime Text</span></div><div class="window-actions"><button aria-label="Minimize">—</button><button aria-label="Maximize">□</button><button aria-label="Close">×</button></div></header>
  <nav class="menubar"><button>File</button><button>Edit</button><button>Selection</button><button>Find</button><button>View</button><button>Goto</button><button>Tools</button><button>Project</button><button>Help</button><span class="spacer"></span><button id="themeBtn" title="Toggle theme">☼</button><button id="paletteBtn" class="key">⌘ K</button></nav>
  <main class="workspace">
    <aside class="sidebar"><div class="side-head"><span>EXPLORER</span><button id="newFile" title="New file">＋</button></div><div class="project">⌄ <strong>MY PROJECT</strong></div><div class="tree"><button class="file active" data-file="app.js"><span class="js">JS</span> app.js</button><button class="file" data-file="index.html"><span class="html">&lt;&gt;</span> index.html</button><button class="file" data-file="styles.css"><span class="css">#</span> styles.css</button><button class="file" data-file="README.md"><span class="md">M</span> README.md</button></div></aside>
    <section class="editor"><div class="tabs"><button class="tab active" data-file="app.js"><span class="js">JS</span> app.js <span class="dot"></span><span class="close">×</span></button><button class="tab" data-file="index.html"><span class="html">&lt;&gt;</span> index.html <span class="close">×</span></button><button class="tab" data-file="styles.css"><span class="css">#</span> styles.css <span class="close">×</span></button><span class="tab-space"></span><button id="splitBtn" title="Split editor">▥</button></div><div class="crumb"><span>MY PROJECT</span><b>›</b><span id="crumbFile">app.js</span><span class="spacer"></span><span id="language">JavaScript</span><span>Spaces: 2</span><span>Ln 1, Col 1</span></div><div class="code-wrap"><div class="gutter" id="gutter">1</div><div class="code-editor"><pre id="highlight" aria-hidden="true"></pre><textarea id="editor" spellcheck="false" aria-label="Code editor"></textarea></div></div><div class="findbar hidden" id="findbar"><input id="findInput" placeholder="Find…"><span id="findCount"></span><button id="findClose">×</button></div></section>
  </main>
  <footer class="statusbar"><span class="ready-dot"></span><span id="status">Ready</span><span class="spacer"></span><button id="runBtn">▶ Run</button><span id="encoding">UTF-8</span><span>LF</span><span id="langStatus">JavaScript</span></footer>
  <div class="palette hidden" id="palette"><div class="palette-box"><input id="paletteInput" placeholder="Type a command…" autofocus><div class="commands"><button data-command="save">Save File <kbd>⌘ S</kbd></button><button data-command="theme">Toggle Color Scheme</button><button data-command="find">Find in File <kbd>⌘ F</kbd></button><button data-command="new">New File</button></div></div></div>
  <script src="app.js"></script>
</body></html>
