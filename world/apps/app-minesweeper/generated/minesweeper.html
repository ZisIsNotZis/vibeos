<!doctype html><html><head><meta charset="utf-8"><title>Minesweeper</title><style>html,body{margin:0;height:100%;background:#202431;color:#eef;font:14px system-ui}body{display:grid;place-items:center}.box{background:#2d3346;padding:18px;border-radius:14px;text-align:center}.top{display:flex;justify-content:space-between;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(9,32px);grid-auto-rows:32px;gap:3px}.cell{border:0;border-radius:4px;background:#68718b;color:#fff;font-weight:700;cursor:pointer}.cell.open{background:#363c50}.cell.flag{color:#ff7992}.new{margin-top:14px;padding:8px 14px;border:0;border-radius:6px;background:#8d7cf0;color:#fff;cursor:pointer}</style></head><body><main class="box"><div class="top"><b>Minesweeper</b><span id="status">Mines: 10</span></div><div id="grid" class="grid"></div><button class="new" id="new">New game</button></main><script>const g=document.querySelector('#grid'),st=document.querySelector('#status');let cells,ended;function start(){ended=false;cells=Array.from({length:81},(_,i)=>({i,mine:[10,22,35,41,48,57,63,68,74,79].includes(i),open:false,flag:false,n:0}));cells.forEach(q=>q.n=[-10,-9,-8,-1,1,8,9,10].filter(d=>{let j=q.i+d;return j>=0&&j<81&&Math.abs(j%9-q.i%9)<=1&&cells[j].mine}).length);draw()}function draw(){g.innerHTML='';cells.forEach(q=>{let b=document.createElement('button');b.className='cell '+(q.open?'open':'')+(q.flag?' flag':'');b.textContent=q.flag?'⚑':q.open?(q.mine?'✹':q.n||''):'';b.oncontextmenu=e=>{e.preventDefault();if(!ended&&!q.open){q.flag=!q.flag;draw()}};b.onclick=()=>reveal(q.i);g.append(b)});st.textContent=ended?'Game over':'Mines: '+cells.filter(q=>q.flag).length+'/10'}function reveal(i){let q=cells[i];if(ended||q.open||q.flag)return;q.open=true;if(q.mine){ended=true;cells.forEach(q=>{if(q.mine)q.open=true});draw();return}if(!q.n)[-10,-9,-8,-1,1,8,9,10].forEach(d=>{let j=i+d;if(j>=0&&j<81&&Math.abs(j%9-i%9)<=1)reveal(j)});draw()}document.querySelector('#new').onclick=start;start()</script></body></html>
