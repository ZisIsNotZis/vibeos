<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 35%),var(--surface);color:var(--text);font:15px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;padding:clamp(16px,4vw,48px)}button{font:inherit;color:inherit;border:1px solid var(--border);background:var(--control);border-radius:10px;padding:10px 14px;cursor:pointer;transition:.16s ease}button:hover{border-color:var(--accent);transform:translateY(-1px)}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.app{width:min(920px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}.title{font-size:clamp(24px,4vw,34px);font-weight:850;letter-spacing:-.03em}.top-actions{display:flex;gap:8px}.layout{display:grid;grid-template-columns:minmax(250px,360px) minmax(230px,1fr);gap:24px;align-items:start}.board-wrap{position:relative;background:var(--surface-raised);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:0 18px 60px #05081455}.board{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1/2;gap:2px;background:var(--grid);padding:2px;border-radius:8px;overflow:hidden}.cell{min-width:0;background:color-mix(in srgb,var(--surface) 86%,var(--grid));border-radius:2px}.cell.filled{background:var(--piece,#67e8f9);box-shadow:inset 0 2px #ffffff66,inset 0 -2px #00000022}.cell.ghost{background:color-mix(in srgb,var(--piece,#67e8f9) 25%,transparent);border:1px solid color-mix(in srgb,var(--piece,#67e8f9) 60%,transparent)}.overlay{position:absolute;inset:14px;display:none;align-items:center;justify-content:center;text-align:center;background:#091023cc;border-radius:8px;backdrop-filter:blur(5px)}.overlay.show{display:flex}.overlay h2{margin:0 0 5px}.overlay p{color:#cbd5f2;margin:0 0 16px}.side{display:flex;flex-direction:column;gap:16px}.card{background:var(--surface-raised);border:1px solid var(--border);border-radius:16px;padding:18px}.card h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--surface-high);padding:12px 10px;border-radius:10px}.stat small{display:block;color:var(--text-muted);font-size:11px;text-transform:uppercase}.stat strong{font-size:22px}.preview{height:88px;display:grid;grid-template-columns:repeat(4,18px);grid-auto-rows:18px;gap:3px;justify-content:center;align-content:center;background:var(--surface-high);border-radius:10px}.preview i{background:#fbbf24;border-radius:3px;box-shadow:inset 0 2px #fff6}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.controls button{font-weight:700}.primary{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);font-weight:800}.wide{width:100%;margin-top:12px}.hint{color:var(--text-muted);font-size:13px;margin:14px 0 0}.kbd{display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text);background:var(--control);font-size:12px}.status{min-height:21px;color:var(--accent);font-weight:700}@media(max-width:680px){body{padding:18px 12px}.layout{grid-template-columns:minmax(0,1fr);max-width:420px;margin:auto}.board-wrap{width:min(100%,330px);margin:auto}.side{display:grid;grid-template-columns:1fr 1fr}.side .card:first-child{grid-column:1/-1}}@media(max-width:390px){.side{display:flex}}
</style></head><body><main class="app"><header><div class="brand"><img src="icon.svg" alt=""><div><div class="eyebrow">Arcade classic</div><div class="title">Tetris</div></div></div><div class="top-actions"><button id="theme" aria-label="Toggle theme">◐ Theme</button><button id="pause">Pause</button></div></header>
<section class="layout"><div class="board-wrap"><div id="board" class="board" aria-label="Tetris board"></div><div id="overlay" class="overlay"><div><h2 id="overlayTitle">Paused</h2><p id="overlayText">Take a breath. Your stack is waiting.</p><button class="primary" id="overlayBtn">Resume</button></div></div></div><div class="side"><div class="card"><h2>Run</h2><div class="stats"><div class="stat"><small>Score</small><strong id="score">0</strong></div><div class="stat"><small>Lines</small><strong id="lines">0</strong></div><div class="stat"><small>Level</small><strong id="level">1</strong></div></div><button class="primary wide" id="new">New game</button><div class="status" id="status">Ready to play</div></div><div class="card"><h2>Next piece</h2><div id="next" class="preview" aria-label="Next piece"></div><p class="hint">Arrow keys move · <span class="kbd">↑</span> rotate · <span class="kbd">Space</span> drop</p></div><div class="card"><h2>Controls</h2><div class="controls"><button data-key="ArrowLeft">←</button><button data-key="ArrowUp">↻</button><button data-key="ArrowRight">→</button><button data-key="ArrowDown">↓</button><button data-key=" ">Drop</button><button id="hold">Hold</button></div><p class="hint">Press <span class="kbd">P</span> to pause</p></div></div></section></main>
<script>
(()=>{const W=10,H=20,colors={I:'#67e8f9',O:'#fbbf24',T:'#c084fc',S:'#4ade80',Z:'#fb7185',J:'#60a5fa',L:'#fb923c'},shapes={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]},bag=[];let grid,piece,next,score=0,lines=0,level=1,running=false,paused=false,timer;
const $=id=>document.getElementById(id),board=$('board');function fresh(){grid=Array.from({length:H},()=>Array(W).fill(''));score=lines=0;level=1;running=true;paused=false;bag=[];piece=spawn();next=spawn();$('status').textContent='Game on';$('overlay').classList.remove('show');draw();loop()}
function pick(){if(!bag.length)bag=Object.keys(shapes).sort(()=>Math.random()-.5);return bag.pop()}function spawn(){let type=pick(),s=shapes[type].map(r=>r.slice());return{type,s,x:Math.floor((W-s[0].length)/2),y:0}}function rotate(s){return s[0].map((_,i)=>s.map(r=>r[i]).reverse())}function hit(p,dx=0,dy=0,shape=p.s){return shape.some((r,y)=>r.some((v,x)=>v&&(p.x+x+dx<0||p.x+x+dx>=W||p.y+y+dy>=H||p.y+y+dy>=0&&grid[p.y+y+dy][p.x+x+dx])))}function merge(){piece.s.forEach((r,y)=>r.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=piece.type}))}
function clear(){let n=grid.filter(r=>r.some(v=>!v));let c=H-n.length;if(c){while(n.length<H)n.unshift(Array(W).fill(''));grid=n;lines+=c;score+=[0,100,300,500,800][c]*level;level=1+Math.floor(lines/10);$('status').textContent=c===4?'TETRIS!':`${c} line${c>1?'s':''} cleared`}}function lock(){merge();clear();piece=next;next=spawn();if(hit(piece)){running=false;showOverlay('Game over','That stack reached the top.');$('status').textContent='Run finished'}draw()}
function move(dx,dy){if(!running||paused)return false;if(!hit(piece,dx,dy)){piece.x+=dx;piece.y+=dy;draw();return true}if(dy)lock();return false}function act(k){if(k==='ArrowLeft')move(-1,0);else if(k==='ArrowRight')move(1,0);else if(k==='ArrowDown')move(0,1);else if(k==='ArrowUp'){let s=rotate(piece.s);if(!hit(piece,0,0,s)){piece.s=s;draw()}}else if(k===' '&&running&&!paused){while(!hit(piece,0,1))piece.y++;score+=Math.max(0,piece.y)*2;lock()}}
function draw(){board.innerHTML='';let ghost={...piece,s:piece.s};while(!hit(ghost,0,1))ghost.y++;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let el=document.createElement('div'),v=grid[y][x];el.className='cell';if(v){el.classList.add('filled');el.style.setProperty('--piece',colors[v])}let pv=piece&&piece.s[y-piece.y]?.[x-piece.x];if(pv){el.classList.add('filled');el.style.setProperty('--piece',colors[piece.type])}else if(ghost.s[y-ghost.y]?.[x-ghost.x]&&!grid[y][x]){el.classList.add('ghost');el.style.setProperty('--piece',colors[ghost.type])}board.append(el)}$('score').textContent=score.toLocaleString();$('lines').textContent=lines;$('level').textContent=level;renderNext()}
function renderNext(){let n=$('next');n.innerHTML='';let s=next.s;for(let y=0;y<4;y++)for(let x=0;x<4;x++){let i=document.createElement('i');if(s[y]?.[x]){i.style.background=colors[next.type]}else i.style.visibility='hidden';n.append(i)}}function loop(){clearInterval(timer);if(running&&!paused)timer=setInterval(()=>move(0,1),Math.max(90,720-(level-1)*55))}function showOverlay(t,p){$('overlayTitle').textContent=t;$('overlayText').textContent=p;$('overlayBtn').textContent=t==='Paused'?'Resume':'Play again';$('overlay').classList.add('show')}
function togglePause(){if(!running)return;paused=!paused;$('pause').textContent=paused?'Resume':'Pause';if(paused)showOverlay('Paused','Take a breath. Your stack is waiting.');else{$('overlay').classList.remove('show');$('status').textContent='Game on'}loop()}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)){e.preventDefault();act(e.key)}if(e.key.toLowerCase()==='p')togglePause()});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>act(b.dataset.key));$('new').onclick=fresh;$('pause').onclick=togglePause;$('overlayBtn').onclick=()=>{if(running)togglePause();else fresh()};$('hold').onclick=()=>{$('status').textContent='Hold is available in the next update'};$('theme').onclick=()=>{let l=document.body.dataset.theme==='light';document.body.dataset.theme=l?'':'light';localStorage.setItem('tetris-theme',l?'dark':'light')};if(localStorage.getItem('tetris-theme')==='light')document.body.dataset.theme='light';fresh()})();
</script></body></html>
