<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris 1787138829755</title>
<style>
:root{color-scheme:light dark;--surface:#0d1424;--surface-raised:#151f34;--surface-deep:#080d18;--text:#edf3ff;--text-muted:#9aa8c2;--border:#2a3956;--accent:#55d6be;--accent-contrast:#061b22;--control:#1d2b46;--focus:#ffce5c;--shadow:#050913;--grid:#1a2943}
[data-theme=light]{--surface:#f5f7fb;--surface-raised:#fff;--surface-deep:#e9eef7;--text:#18233a;--text-muted:#60708d;--border:#d4ddec;--accent:#087f82;--accent-contrast:#fff;--control:#edf2fa;--focus:#b06100;--shadow:#b8c2d4;--grid:#e4eaf3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--surface);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}main{width:min(920px,100%);padding:28px 22px 34px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:clamp(25px,4vw,38px);letter-spacing:-1px;margin:0 0 4px}p{margin:0;color:var(--text-muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:5px}.layout{display:grid;grid-template-columns:minmax(260px,360px) minmax(250px,1fr);gap:26px;align-items:start}.board-wrap{position:relative;background:var(--surface-deep);border:1px solid var(--border);border-radius:15px;padding:11px;box-shadow:0 12px 30px color-mix(in srgb,var(--shadow) 45%,transparent)}canvas{width:100%;height:auto;display:block;border-radius:8px;background:var(--surface-deep);touch-action:none}.status{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.status span{background:color-mix(in srgb,var(--surface-raised) 92%,transparent);border:1px solid var(--border);border-radius:10px;padding:10px 17px;font-weight:700;box-shadow:0 5px 20px color-mix(in srgb,var(--shadow) 45%,transparent)}.status.hidden{display:none}.side{display:grid;gap:14px}.card{background:var(--surface-raised);border:1px solid var(--border);border-radius:13px;padding:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat small{display:block;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}.stat strong{display:block;font-size:21px;margin-top:3px}.preview-row{display:flex;gap:18px;align-items:center}.mini{width:85px;height:70px;background:var(--surface-deep);border-radius:8px;display:block}.actions{display:flex;gap:9px;flex-wrap:wrap}.button{border:1px solid var(--border);background:var(--control);color:var(--text);padding:10px 15px;border-radius:9px;font:inherit;font-weight:650;cursor:pointer}.button:hover{border-color:var(--accent);transform:translateY(-1px)}.button:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 55%,transparent);outline-offset:2px}.button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}.help{display:grid;grid-template-columns:1fr 1fr;gap:6px;color:var(--text-muted);font-size:13px}.key{display:inline-grid;place-items:center;min-width:25px;padding:2px 6px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;color:var(--text);font-weight:700;font-size:12px;margin-right:5px}footer{color:var(--text-muted);font-size:12px;margin-top:20px}@media(max-width:680px){main{padding:20px 14px}.layout{grid-template-columns:minmax(0,1fr);gap:15px}.board-wrap{max-width:360px;margin:auto;width:100%}header{margin-bottom:16px}.side{grid-template-columns:1fr 1fr}.side .wide{grid-column:1/-1}}
</style></head><body><main><header><div><div class="eyebrow">Arcade / classic mode</div><h1>Tetris 1787138829755</h1><p>Build clean lines. Keep the stack low.</p></div><div class="eyebrow" id="bestLabel">BEST 0</div></header><section class="layout"><div class="board-wrap"><canvas id="board" width="300" height="600" aria-label="Tetris game board"></canvas><div id="status" class="status"><span>Press Start to play</span></div></div><div class="side"><div class="card stats"><div class="stat"><small>Score</small><strong id="score">0</strong></div><div class="stat"><small>Lines</small><strong id="lines">0</strong></div><div class="stat"><small>Level</small><strong id="level">1</strong></div></div><div class="card preview-row"><div><div class="eyebrow">Next</div><canvas class="mini" id="next" width="170" height="140"></canvas></div><div><div class="eyebrow">Hold</div><canvas class="mini" id="hold" width="170" height="140"></canvas></div></div><div class="card wide"><div class="actions"><button class="button primary" id="start">Start game</button><button class="button" id="pause">Pause</button><button class="button" id="restart">Restart</button></div></div><div class="card wide"><div class="eyebrow">Controls</div><div class="help"><div><span class="key">←</span><span class="key">→</span>move</div><div><span class="key">↑</span>rotate</div><div><span class="key">↓</span>soft drop</div><div><span class="key">Space</span>hard drop</div><div><span class="key">C</span>hold</div><div><span class="key">P</span>pause</div></div></div></div></section><footer>Clear four lines at once for a Tetris. Your best score is saved on this device.</footer></main>
<script>
(()=>{const W=10,H=20,cv=document.querySelector('#board'),ctx=cv.getContext('2d'),nc=document.querySelector('#next'),hc=document.querySelector('#hold'),colors={I:'#55d6be',J:'#5c8df6',L:'#ff9b5c',O:'#ffce5c',S:'#7bd88f',T:'#b889ff',Z:'#ee6a79'},shapes={I:[[1,1,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]],O:[[1,1],[1,1]],S:[[0,1,1],[1,1,0]],T:[[0,1,0],[1,1,1]],Z:[[1,1,0],[0,1,1]]};let board,piece,next,hold=null,canHold=true,score=0,lines=0,level=1,running=false,paused=false,over=false,last=0,drop=700,best=+localStorage.getItem('tetris1787138829755.best')||0;const $=s=>document.querySelector(s);$('#bestLabel').textContent='BEST '+best;
function fresh(){board=Array.from({length:H},()=>Array(W).fill(''));score=lines=0;level=1;drop=700;hold=null;canHold=true;over=false;piece=null;next=random();spawn();render();update()};function random(){return Object.keys(shapes)[Math.floor(Math.random()*7)]};function spawn(){piece={type:next||random(),x:0,y:-1,rot:0};next=random();piece.x=Math.floor((W-pieceShape().length?0:0));piece.x=Math.floor((W-pieceShape().length)/2);if(collides(piece,0,0)){running=false;over=true;show('Game over — press Restart')}}function pieceShape(p=piece){let a=shapes[p.type];for(let i=0;i<p.rot%4;i++)a=a[0].map((_,x)=>a.map(r=>r[x]).reverse());return a}function collides(p,dx=0,dy=0,dr=0){let q={...p,rot:p.rot+dr},a=pieceShape(q);return a.some((r,y)=>r.some((v,x)=>v&&(x+p.x+dx<0||x+p.x+dx>=W||y+p.y+dy>=H||(y+p.y+dy>=0&&board[y+p.y+dy][x+p.x+dx]))))}function move(dx,dy){if(!running||paused)return false;if(!collides(piece,dx,dy)){piece.x+=dx;piece.y+=dy;return true}return false}function rotate(){if(!running||paused)return;for(const kick of [0,-1,1,-2,2])if(!collides(piece,kick,0,1)){piece.x+=kick;piece.rot++;return}}function lock(){pieceShape().forEach((r,y)=>r.forEach((v,x)=>{if(v&&piece.y+y>=0)board[piece.y+y][piece.x+x]=piece.type}));let cleared=0;board=board.filter(r=>{if(r.every(Boolean)){cleared++;return false}return true});while(board.length<H)board.unshift(Array(W).fill(''));if(cleared){lines+=cleared;score+=[0,100,300,500,800][cleared]*level;level=1+Math.floor(lines/10);drop=Math.max(90,700-(level-1)*55)}canHold=true;spawn();update()}function hard(){if(!running||paused)return;let d=0;while(move(0,1))d++;score+=d*2;lock();update()}function holdPiece(){if(!running||paused||!canHold)return;let t=hold;hold=piece.type;if(t){next=next;piece={type:t,x:Math.floor((W-pieceShape({type:t,rot:0}).length)/2),y:-1,rot:0}}else spawn();canHold=false;update()}function update(){ $('#score').textContent=score;$('#lines').textContent=lines;$('#level').textContent=level;$('#bestLabel').textContent='BEST '+Math.max(best,score);drawMini(nc,next);drawMini(hc,hold)}function show(t){$('#status span').textContent=t;$('#status').classList.remove('hidden')}function hide(){$('#status').classList.add('hidden')}function start(){if(over)fresh();running=true;paused=false;hide();last=performance.now();requestAnimationFrame(loop)}function togglePause(){if(!running||over)return;paused=!paused;$('#pause').textContent=paused?'Resume':'Pause';paused?show('Paused'):hide()}function loop(now){if(!running)return;if(!paused){if(now-last>drop){if(!move(0,1))lock();last=now}render()}requestAnimationFrame(loop)}
function cell(c,x,y,s){ctx.fillStyle=colors[c]||'transparent';ctx.fillRect(x*s+1,y*s+1,s-2,s-2);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x*s+2,y*s+2,s-4,3)}function render(){let s=cv.width/W;ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--grid');ctx.lineWidth=1;for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.strokeRect(x*s+.5,y*s+.5,s-1,s-1);if(board[y][x])cell(board[y][x],x,y,s)}if(piece)pieceShape().forEach((r,y)=>r.forEach((v,x)=>v&&piece.y+y>=0&&cell(piece.type,piece.x+x,piece.y+y,s)))}function drawMini(c,t){let x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);if(!t)return;let a=shapes[t],s=Math.min(w/(a[0].length+2),h/(a.length+2));let ox=(w-a[0].length*s)/2,oy=(h-a.length*s)/2;x.fillStyle=colors[t];a.forEach((r,y)=>r.forEach((v,i)=>{if(v){x.fillRect(ox+i*s+1,oy+y*s+1,s-2,s-2)}}))}function reset(){running=false;fresh();show('Press Start to play');$('#pause').textContent='Pause'}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);if(e.key==='ArrowDown'){if(move(0,1)){score++;update()}}if(e.key==='ArrowUp')rotate();if(e.key===' ')hard();if(e.key.toLowerCase()==='c')holdPiece();if(e.key.toLowerCase()==='p')togglePause();render()});$('#start').onclick=start;$('#pause').onclick=togglePause;$('#restart').onclick=reset;fresh();
setInterval(()=>{if(score>best){best=score;localStorage.setItem('tetris1787138829755.best',best);update()}},500);
})();
</script></body></html>
