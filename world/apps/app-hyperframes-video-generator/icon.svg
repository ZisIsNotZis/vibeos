<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Hyperframes Video Generator</title>
  <desc id="desc">A cinematic frame aperture surrounding a play marker and editing timeline.</desc>
  <defs>
