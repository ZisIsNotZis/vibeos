<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone Simulator</title><style>
:root{--bg:var(--vibe-surface,#191923);--raised:var(--vibe-raised,#242431);--control:var(--vibe-control,#303044);--text:var(--vibe-text,#f1f1f6);--muted:var(--vibe-muted,#aeb0c2);--line:var(--vibe-border,#ffffff22);--accent:var(--vibe-accent,#a89dfc);font-family:system-ui,sans-serif;color:var(--text)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);display:grid;place-items:center;padding:12px;overflow:hidden}.stage{display:flex;align-items:center;gap:clamp(18px,6vw,55px);max-width:700px;width:100%;justify-content:center;min-width:0}.intro{max-width:240px;min-width:0}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:bold}.intro h1{font-size:30px;line-height:1.1;margin:10px 0}.intro p,.tip{color:var(--muted);font-size:14px;line-height:1.5}.phone{width:min(290px,100%);height:592px;max-height:calc(100vh - 24px);border:8px solid #11131d;border-radius:43px;background:#10131d;box-shadow:0 24px 60px #0007;overflow:hidden;flex:0 1 290px;min-width:0}.screen{height:100%;position:relative;background:linear-gradient(145deg,#5965bd,#a171ac 45%,#e28b72);overflow:hidden}.status{height:30px;display:flex;justify-content:space-between;padding:0 15px;align-items:center;font-size:11px;font-weight:bold}.island{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:94px;height:22px;border-radius:16px;background:#090b12;z-index:2}.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,4vw,19px) clamp(2px,2vw,14px);padding:25px clamp(10px,5vw,22px)}.app{background:none;border:0;color:white;display:grid;gap:5px;justify-items:center;min-width:0;font-size:10px;text-shadow:0 1px 3px #0008;cursor:pointer}.tile{width:48px;height:48px;max-width:100%;border-radius:13px;display:grid;place-items:center;font-size:20px;line-height:1;box-shadow:inset 0 0 0 1px #ffffff38}.blue{background:#287be0}.green{background:#22a563}.orange{background:#ef8740}.red{background:#e64c62}.purple{background:#7454d9}.pink{background:#df609e}.teal{background:#22aabb}.gold{background:#d3a43e}.dock{position:absolute;bottom:18px;left:10px;right:10px;padding:10px 6px;border-radius:23px;background:#ffffff2e;display:flex;justify-content:space-around}.dock .app{font-size:0}.dock .tile{width:min(46px,100%)}.home{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);height:4px;width:92px;border:0;border-radius:4px;background:#fff9;cursor:pointer}.panel{position:absolute;inset:30px 0 0;background:var(--bg);z-index:3;display:none;flex-direction:column}.panel.open{display:flex}.panel-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.back{border:0;background:none;color:var(--accent);font-size:14px;cursor:pointer}.panel h2{font-size:18px;margin:0}.panel-body{padding:18px;overflow:auto;flex:1}.note{background:var(--raised);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px}.note strong{display:block;margin-bottom:5px}.note small{color:var(--muted)}.toggle{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}input{accent-color:var(--accent);width:18px;height:18px}@media(max-width:580px){.intro{display:none}.phone{width:min(290px,92vw);height:min(592px,calc(100vh - 20px))}}@media(max-width:330px){body{padding:4px}.phone{width:100%;border-width:6px}.icons{padding-inline:8px;gap:10px 2px}.tile{border-radius:10px}}
</style></head><body><main class="stage"><section class="intro"><div class="eyebrow">Interactive device</div><h1>iPhone Simulator</h1><p>Tap an icon to open an app. Return home with the lower bar, then try another experience.</p></section><div class="phone"><div class="screen"><div class="island"></div><div class="status"><span id="clock">9:41</span><span>▮▮▮　⌁　▰</span></div><div class="icons" id="icons"></div><div class="dock" id="dock"></div><button class="home" id="home" aria-label="Return home"></button><section class="panel" id="panel"><header class="panel-head"><button class="back" id="back">‹ Home</button><h2 id="panelTitle"></h2></header><div class="panel-body" id="panelBody"></div></section></div></div></main><script>
const apps=[['Messages','green','✉','messages'],['Calendar','red','▦','calendar'],['Photos','pink','✣','photos'],['Maps','teal','⌖','maps'],['Notes','gold','▤','notes'],['Weather','blue','☼','weather'],['Clock','purple','◷','clock'],['Settings','orange','⚙','settings']];const make=a=>`<button class="app" data-open="${a[3]}"><span class="tile ${a[1]}">${a[2]}</span><span>${a[0]}</span></button>`;icons.innerHTML=apps.map(make).join('');dock.innerHTML=[apps[0],apps[3],apps[5],apps[7]].map(make).join('');const panel=document.querySelector('#panel'),title=document.querySelector('#panelTitle'),body=document.querySelector('#panelBody');const views={messages:['Messages','<div class="note"><strong>Alex</strong><small>Can you send the photos from today?</small></div><div class="note"><strong>Design Team</strong><small>Stand-up starts at 10:00 AM</small></div>'],calendar:['Calendar','<div class="note"><strong>Today · Tuesday</strong><small>9:00 AM · Product review<br>2:30 PM · Walk outside</small></div>'],photos:['Photos','<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">'+['#e5a07b','#8fb4c7','#d4b36b','#8b9acb','#bd7d8d','#86a58c'].map(x=>`<div style="aspect-ratio:1;background:${x};border-radius:8px"></div>`).join('')+'</div>'],maps:['Maps','<div class="note" style="height:210px;background:linear-gradient(135deg,#b6d3b0 25%,#e8d7a8 25% 49%,#9dc2d0 49% 58%,#d8c39d 58%)"><strong>Search nearby</strong></div>'],notes:['Notes','<div class="note"><strong>Ideas for the weekend</strong><small>Try a new café, visit the market, take a long walk.</small></div><button class="back" id="newNote">＋ New note</button>'],weather:['Weather','<div class="note" style="text-align:center"><div style="font-size:48px">☼</div><strong style="font-size:28px">24°</strong><small>Clear skies · Shanghai</small></div>'],clock:['Clock','<div class="note" style="text-align:center"><strong id="liveTime" style="font-size:34px">9:41</strong><small>Tuesday, August 20</small></div>'],settings:['Settings','<label class="toggle">Airplane Mode <input type="checkbox"></label><label class="toggle">Wi-Fi <input type="checkbox" checked></label><label class="toggle">Dark Appearance <input type="checkbox" checked></label>']};function open(id){title.textContent=views[id][0];body.innerHTML=views[id][1];panel.classList.add('open')}document.addEventListener('click',e=>{const a=e.target.closest('[data-open]');if(a)open(a.dataset.open);if(e.target.id==='home'||e.target.id==='back')panel.classList.remove('open');if(e.target.id==='newNote')body.insertAdjacentHTML('afterbegin','<div class="note"><strong>New note</strong><small>Tap here to add a thought.</small></div>')});setInterval(()=>clock.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),30000);
</script></body></html>
