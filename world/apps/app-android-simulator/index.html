<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android Simulator</title><style>
:root{--bg:var(--vibe-surface,#f7f8fc);--panel:var(--vibe-raised,#fff);--ink:var(--vibe-text,#20202b);--muted:var(--vibe-muted,#596070);--line:var(--vibe-border,#20202b22);--accent:var(--vibe-accent,#6658cf);--control:var(--vibe-control,#e8ebf3);font:var(--vibe-text-body,14px) var(--vibe-font-ui,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);display:grid;place-items:center;overflow:hidden}.stage{width:min(100%,620px);height:100%;min-height:500px;display:grid;place-items:center;padding:18px}.phone{height:min(760px,calc(100vh - 36px));aspect-ratio:390/760;max-width:100%;background:var(--panel);border:8px solid #30333b;border-radius:38px;box-shadow:0 20px 60px #0004;overflow:hidden;display:grid;grid-template-rows:28px 1fr 48px}.status{display:flex;justify-content:space-between;align-items:center;padding:0 18px;color:var(--muted);font-size:var(--vibe-text-caption,11px)}.screen{position:relative;overflow:hidden;background:var(--bg)}.home,.app{height:100%;position:relative;padding:25px 18px;display:none}.home.active,.app.active{display:block}.date{font-size:var(--vibe-text-caption,11px);color:var(--muted);margin:3px 5px 10px}.clock{font-size:48px;font-weight:300;margin:0 5px}.search{height:40px;border:1px solid var(--line);border-radius:22px;background:var(--control);display:flex;align-items:center;gap:10px;padding:0 15px;color:var(--muted);margin:24px 0 27px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 9px}.tile{text-align:center;font-size:var(--vibe-text-caption,11px);cursor:pointer}.tile button{display:grid;place-items:center;margin:auto auto 7px;width:48px;height:48px;border:0;border-radius:15px;color:#20202b;cursor:pointer;font-size:20px}.tile:nth-child(1) button{background:#f3c55f}.tile:nth-child(2) button{background:#86cbea}.tile:nth-child(3) button{background:#ee9999}.tile:nth-child(4) button{background:#b7a4ed}.tile:nth-child(5) button{background:#78d5a0}.tile:nth-child(6) button{background:#e3a4d0}.tile:nth-child(7) button{background:#cedb7c}.tile:nth-child(8) button{background:#c9cad2}.dock{position:absolute;bottom:21px;left:18px;right:18px;background:var(--control);border:1px solid var(--line);border-radius:24px;padding:9px 14px;display:flex;justify-content:space-around}.dock button,.nav button,.appbar button{background:none;border:0;color:var(--ink);cursor:pointer}.app{padding:0;background:var(--panel)}.appbar{height:58px;display:flex;align-items:center;gap:12px;padding:0 17px;border-bottom:1px solid var(--line)}.appbar button{font-size:22px}.appbar h2{font-size:18px;margin:0}.content{height:calc(100% - 58px);overflow:auto}.messages{height:100%;display:flex;flex-direction:column;background:var(--bg)}.conversation{padding:15px 16px 10px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line);background:var(--panel)}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#d8cafa;color:#49379a;font-weight:700}.conversation strong{display:block}.conversation small{color:var(--muted)}.thread{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:80%;padding:10px 13px;border-radius:17px;line-height:1.4;box-shadow:0 1px 2px #0001}.bubble.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}.bubble.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}.stamp{display:block;font-size:var(--vibe-text-caption,11px);opacity:.7;margin-top:4px}.composer{display:flex;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid var(--line);background:var(--panel)}textarea{flex:1;resize:none;min-height:40px;max-height:100px;border:1px solid var(--line);border-radius:20px;padding:10px 14px;background:var(--control);color:var(--ink);font:inherit;outline:none}textarea:focus{border-color:var(--accent)}.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;font-weight:700}.send:disabled{opacity:.45}.nav{display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line)}.nav button{font-size:22px;padding:10px 24px}.note{margin:18px;background:var(--control);padding:15px;border-radius:14px;line-height:1.5}.action{padding:9px 13px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}@media(max-height:560px){.phone{height:calc(100vh - 18px)}.grid{gap:10px}.search{margin:12px 0}.home{padding-top:12px}}
</style></head><body><main class="stage"><section class="phone" aria-label="Android phone simulator"><header class="status"><span id="time">9:41</span><span>▮▮▮ ◉ 100%</span></header><div class="screen"><section class="home active" id="home"><div class="date">Tuesday, August 20</div><div class="clock" id="clock">9:41</div><div class="search"><span>⌕</span><span>Search apps</span></div><div class="grid"><div class="tile" data-app="phone"><button>☎</button>Phone</div><div class="tile" data-app="messages"><button>▰</button>Messages</div><div class="tile" data-app="camera"><button>●</button>Camera</div><div class="tile" data-app="gallery"><button>▣</button>Gallery</div><div class="tile" data-app="music"><button>♫</button>Music</div><div class="tile" data-app="weather"><button>☼</button>Weather</div><div class="tile" data-app="settings"><button>⚙</button>Settings</div></div><div class="dock"><button data-app="phone">☎</button><button data-app="messages">▰</button><button data-app="camera">●</button><button data-app="settings">⚙</button></div></section><section class="app" id="app"><div class="appbar"><button id="back" aria-label="Back">‹</button><h2 id="appTitle">App</h2></div><div class="content" id="content"></div></section></div><nav class="nav"><button id="navBack">‹</button><button id="navHome">○</button><button id="navRecent">□</button></nav></section></main><script>
const $=s=>document.querySelector(s),home=$('#home'),app=$('#app'),content=$('#content');let current='',messages=[{from:'them',text:'Hey! How are you doing today?',time:'9:40 AM'},{from:'me',text:'I’m doing well — good to hear from you.',time:'9:41 AM'}];const simple={phone:['Phone','<div class="note"><strong>Favorites</strong><p>No favorite contacts yet.</p><button class="action">Add a contact</button></div>'],camera:['Camera','<div class="note"><strong>Camera ready</strong><p>Capture a moment from your phone.</p><button class="action">Take photo</button></div>'],gallery:['Gallery','<div class="note"><strong>All photos</strong><p>Your photo library is empty.</p></div>'],music:['Music','<div class="note"><strong>Library</strong><p>Choose a song to start listening.</p><button class="action">Browse library</button></div>'],weather:['Weather','<div class="note"><strong>Today · Clear</strong><p style="font-size:36px;margin:12px 0">24°</p><p>Comfortable with a light breeze.</p></div>'],settings:['Settings','<div class="note">Wi‑Fi <button class="action">On</button><hr>Bluetooth <button class="action">Off</button><hr>Dark appearance <button class="action">On</button></div>']};function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function now(){return new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}function renderMessages(){content.innerHTML='<div class="messages"><div class="conversation"><div class="avatar">A</div><div><strong>Alex Morgan</strong><small>Active now</small></div></div><div class="thread" id="thread">'+messages.map(m=>`<div class="bubble ${m.from}">${escapeHTML(m.text)}<span class="stamp">${m.time}</span></div>`).join('')+'</div><form class="composer" id="composer"><textarea id="draft" rows="1" placeholder="Message Alex…" aria-label="Message Alex"></textarea><button class="send" type="submit" aria-label="Send message">↑</button></form></div>';const draft=$('#draft'),send=$('.send'),thread=$('#thread');draft.oninput=()=>send.disabled=!draft.value.trim();$('#composer').onsubmit=async event=>{event.preventDefault();const text=draft.value.trim();if(!text||send.disabled)return;messages.push({from:'me',text,time:now()});draft.value='';send.disabled=true;messages.push({from:'them',text:'…',time:now(),pending:true});renderMessages();try{const answer=await window.vibeOS.ai.command(text,{scope:'app',context:{conversation:messages.filter(message=>!message.pending).slice(-12).map(({from,text})=>({from,text}))},output:'result'});const pending=messages.findIndex(message=>message.pending);if(pending>=0)messages.splice(pending,1,{from:'them',text:typeof answer?.value==='string'&&answer.value.trim()?answer.value:'I could not compose a reply.',time:now()})}catch(error){const pending=messages.findIndex(message=>message.pending);if(pending>=0)messages.splice(pending,1,{from:'them',text:'Message could not be delivered.',time:now()})}renderMessages()};thread.scrollTop=thread.scrollHeight}function open(name){current=name;home.classList.remove('active');app.classList.add('active');$('#appTitle').textContent=name==='messages'?'Messages':simple[name][0];name==='messages'?renderMessages():content.innerHTML=simple[name][1];document.querySelectorAll('.action').forEach(b=>b.onclick=()=>b.textContent=b.textContent==='On'?'Off':'On')}function goHome(){app.classList.remove('active');home.classList.add('active');current=''}document.querySelectorAll('[data-app]').forEach(x=>x.onclick=()=>open(x.dataset.app));$('#back').onclick=goHome;$('#navBack').onclick=()=>current&&goHome();$('#navHome').onclick=goHome;setInterval(()=>{let t=now();$('#clock').textContent=t;$('#time').textContent=t},1000);
</script></body></html>
