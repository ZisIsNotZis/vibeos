<script>
const $=s=>document.querySelector(s),home=$('#home'),app=$('#app'),recents=$('#recents'),content=$('#content'),bridge=window.vibeOS;const icons={phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7.2 4.2 5 5.5c-.8.5-1 1.5-.6 2.4 2.3 5.1 6.4 9.2 11.5 11.5.9.4 1.9.2 2.4-.6l1.3-2.2c.4-.7.2-1.6-.5-2l-3-1.7c-.6-.3-1.3-.2-1.8.3l-1.2 1.3a15 15 0 0 1-4.7-4.7l1.3-1.2c.5-.5.6-1.2.3-1.8L8.8 4.7c-.4-.7-1.3-.9-1.6-.5Z"/></svg>',messages:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4.5 3v-3H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/><path d="M7 10h10M7 13h6" stroke-linecap="round"/></svg>',camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8.5h3l1.4-2h7.2l1.4 2h3A2 2 0 0 1 22 10.5v8A2 2 0 0 1 20 20H4a2 2 0 0 1-2-1.5v-8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="14.2" r="3.4"/></svg>',gallery:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.4"/><path d="m4 17 4.5-4 3.2 2.5 2.5-2.2 5.8 5.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',music:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',weather:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 18h10a4 4 0 0 0 .2-8 5.5 5.5 0 0 0-10.4-1.6A4.8 4.8 0 0 0 7 18Z"/><path d="M8 4v2M4.5 7.5 6 9M17.5 7.5 16 9" stroke-linecap="round"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></svg>',back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>',home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9Z"/><path d="M9 20v-6h6v6"/></svg>',recent:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke-linecap="round"/></svg>',play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7V5Z"/></svg>',pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>',send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 4 16 8-16 8 3-8-3-8Z" stroke-linejoin="round"/><path d="M7 12h13" stroke-linecap="round"/></svg>'};
const appDefs=[['phone','Phone'],['messages','Messages'],['camera','Camera'],['gallery','Gallery'],['music','Music'],['weather','Weather'],['settings','Settings']];let state={photos:[],messages:[{from:'them',text:'Hey! How are you doing today?',time:'9:40 AM'},{from:'me',text:'I’m doing well — good to hear from you.',time:'9:41 AM'}],toggles:{wifi:true,bluetooth:false,dark:false},musicPlaying:false,weatherIndex:0},current='',recent=[];const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});const dateLabel=()=>new Intl.DateTimeFormat([], {weekday:'long',month:'long',day:'numeric'}).format(new Date());async function persist(){try{await bridge?.storage?.write('android-simulator',state)}catch(error){bridge?.notify?.('Simulator changes could not be saved.',{level:'warning',timeoutMs:2600})}}function setNavIcons(){$('#back').innerHTML=icons.back;$('#navBack').innerHTML=icons.back;$('#navHome').innerHTML=icons.home;$('#navRecent').innerHTML=icons.recent}function renderHome(){home.classList.add('active');app.classList.remove('active');recents.classList.remove('active');current='';$('#date').textContent=dateLabel();const query=$('#appSearch').value.trim().toLowerCase(),items=appDefs.filter(([,label])=>label.toLowerCase().includes(query));$('#appGrid').innerHTML=items.length?items.map(([id,label])=>`<div class="tile" data-app="${id}"><button aria-label="Open ${label}">${icons[id]}</button><span>${label}</span></div>`).join(''):'<div class="empty-search">No apps match that search.</div>';$('#appGrid').querySelectorAll('[data-app]').forEach(el=>el.addEventListener('click',()=>openApp(el.dataset.app)));$('#dock').innerHTML=appDefs.slice(0,4).map(([id,label])=>`<button data-app="${id}" aria-label="Open ${label}">${icons[id]}</button>`).join('');$('#dock').querySelectorAll('[data-app]').forEach(el=>el.addEventListener('click',()=>openApp(el.dataset.app)))}function appTitle(id){return appDefs.find(([key])=>key===id)?.[1]||'App'}function openApp(id){current=id;if(!recent.includes(id))recent.unshift(id);recent=recent.slice(0,4);home.classList.remove('active');recents.classList.remove('active');app.classList.add('active');$('#appTitle').textContent=appTitle(id);renderApp(id)}function closeApp(){current='';renderHome()}function renderApp(id){if(id==='phone')renderPhone();else if(id==='messages')renderMessages();else if(id==='camera')renderCamera();else if(id==='gallery')renderGallery();else if(id==='music')renderMusic();else if(id==='weather')renderWeather();else renderSettings()}
function renderPhone(){content.innerHTML=`<div class="surface"><div class="card"><div class="dial-display" id="dialDisplay">Enter a number</div><div class="dial-pad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<button data-digit="${n}">${n}</button>`).join('')}</div><div style="display:flex;gap:8px;justify-content:center"><button class="secondary" id="clearDial">Clear</button><button class="primary" id="callDial">Call</button></div><div class="result" id="dialResult" role="status"></div></div></div>`;let digits='';const display=$('#dialDisplay');content.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{digits+=b.dataset.digit;display.textContent=digits});$('#clearDial').onclick=()=>{digits='';display.textContent='Enter a number';$('#dialResult').textContent=''};$('#callDial').onclick=()=>{$('#dialResult').textContent=digits?'Calling '+digits+'…':'Enter a number to place a call.'}}
function renderMessages(){content.innerHTML=`<div class="messages"><div class="conversation"><div class="avatar">A</div><div><strong>Alex Morgan</strong><small>Active now</small></div></div><div class="thread" id="thread">${state.messages.map(m=>`<div class="bubble ${m.from}">${escapeHTML(m.text)}<span class="stamp">${escapeHTML(m.time)}</span></div>`).join('')}</div><form class="composer" id="composer"><textarea id="draft" rows="1" placeholder="Message Alex…" aria-label="Message Alex"></textarea><button class="send" type="submit" aria-label="Send message" disabled>${icons.send}</button></form></div>`;const draft=$('#draft'),send=$('.send'),thread=$('#thread');draft.oninput=()=>send.disabled=!draft.value.trim();$('#composer').onsubmit=async event=>{event.preventDefault();const text=draft.value.trim();if(!text)return;state.messages.push({from:'me',text,time:now()});draft.value='';send.disabled=true;state.messages.push({from:'them',text:'Replying…',time:now(),pending:true});renderMessages();await persist();try{const answer=await bridge.ai.command(text,{scope:'app',context:{conversation:state.messages.filter(m=>!m.pending).slice(-12).map(({from,text})=>({from,text}))},output:'result'});const pending=state.messages.findIndex(m=>m.pending);if(pending>=0)state.messages.splice(pending,1,{from:'them',text:typeof answer?.value==='string'&&answer.value.trim()?answer.value:'I could not compose a reply.',time:now()})}catch(error){const pending=state.messages.findIndex(m=>m.pending);if(pending>=0)state.messages.splice(pending,1,{from:'them',text:'Message could not be delivered.',time:now()})}await persist();renderMessages();};thread.scrollTop=thread.scrollHeight}
function drawCamera(){const canvas=$('#cameraCanvas');if(!canvas)return;const box=canvas.getBoundingClientRect(),ratio=Math.max(1,window.devicePixelRatio||1);canvas.width=box.width*ratio;canvas.height=box.height*ratio;const c=canvas.getContext('2d');c.scale(ratio,ratio);const w=box.width,h=box.height,sky=c.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#9ed8f2');sky.addColorStop(.6,'#d9efd5');sky.addColorStop(1,'#e8c68d');c.fillStyle=sky;c.fillRect(0,0,w,h);c.fillStyle='#79a768';for(let x=-20;x<w+40;x+=52){c.beginPath();c.arc(x,h+16,62,Math.PI,Math.PI*2);c.fill()}c.fillStyle='#f4ca57';c.beginPath();c.arc(w*.79,h*.24,28,0,Math.PI*2);c.fill();c.fillStyle='#5a8d61';c.fillRect(w*.44,h*.39,9,h*.34);c.beginPath();c.arc(w*.49,h*.43,43,0,Math.PI*2);c.fill();c.fillStyle='#fff8';c.font='12px system-ui';c.fillText('LIVE VIEW',16,h-16)}function renderCamera(){content.innerHTML=`<div class="surface"><div class="camera-preview"><canvas id="cameraCanvas" aria-label="Camera preview"></canvas><span class="camera-badge">PORTRAIT · 1×</span></div><div class="card"><h3>Camera</h3><p>Frame a scene and save a snapshot to Gallery.</p><button class="primary" id="takePhoto">Take photo</button><div class="result" id="cameraResult" role="status"></div></div></div>`;drawCamera();$('#takePhoto').onclick=()=>{state.photos.push($('#cameraCanvas').toDataURL('image/jpeg',.82));persist();$('#cameraResult').textContent='Photo saved to Gallery.'};window.addEventListener('resize',drawCamera,{once:true})}function renderGallery(){content.innerHTML=`<div class="surface"><div class="card"><h3>All photos</h3><p>${state.photos.length?`${state.photos.length} photo${state.photos.length===1?'':'s'} in your library.`:'Take a photo to start your library.'}</p>${state.photos.length?`<div class="photo-grid">${state.photos.map((src,i)=>`<img data-photo="${i}" alt="Captured photo ${i+1}">`).join('')}</div>`:''}</div></div>`;state.photos.forEach((src,i)=>{const image=document.querySelector(`[data-photo="${i}"]`);if(image)image.src=src})}
function renderMusic(){const playing=state.musicPlaying;content.innerHTML=`<div class="surface"><div class="music-center"><div class="music-cover">${icons.music}</div><div class="card"><h3>Evening Drive</h3><p>Neon District · Local playlist</p><div class="progress"><span style="--progress:${playing?'58%':'34%'}"></span></div><div class="track-row"><span>${playing?'1:42':'0:58'}</span><span>3:08</span></div><div style="margin-top:17px"><button class="primary" id="musicToggle">${playing?icons.pause:icons.play} <span>${playing?'Pause':'Play'}</span></button></div><div class="result" role="status">${playing?'Now playing on this device.':'Ready to play.'}</div></div></div></div>`;$('#musicToggle').onclick=()=>{state.musicPlaying=!state.musicPlaying;persist();renderMusic()}}
function renderWeather(){const warm=state.weatherIndex===0;content.innerHTML=`<div class="surface"><div class="card"><div class="widget-label">TODAY · ${dateLabel().toUpperCase()}</div><div style="display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px"><div><div style="font-size:42px;font-weight:300">${warm?'24°':'22°'}</div><strong>${warm?'Clear skies':'Partly cloudy'}</strong></div><svg class="weather-mark" viewBox="0 0 48 48" fill="none" style="width:72px;height:72px"><circle cx="25" cy="20" r="8" fill="currentColor"/><path d="M25 5v5M25 30v5M10 20h5M35 20h5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M9 38h26a6 6 0 0 0 .5-12 9 9 0 0 0-17-2.6A7 7 0 0 0 9 38Z" fill="var(--panel)" stroke="currentColor" stroke-width="2"/></svg></div><p>${warm?'Comfortable with a light breeze.':'A cooler afternoon with passing clouds.'}</p><button class="secondary" id="refreshWeather">Refresh forecast</button><div class="result" id="weatherResult" role="status"></div></div></div>`;$('#refreshWeather').onclick=()=>{state.weatherIndex=warm?1:0;persist();renderWeather();bridge?.notify?.('Forecast updated.',{level:'success',timeoutMs:1500})}}
function renderSettings(){content.innerHTML=`<div class="surface"><div class="card"><h3>Quick settings</h3>${[['wifi','Wi‑Fi','Home network'],['bluetooth','Bluetooth','Not connected'],['dark','Dark appearance','Use the system appearance']].map(([key,title,sub])=>`<div class="setting-row"><div class="setting-copy"><strong>${title}</strong><small>${sub}</small></div><button class="switch ${state.toggles[key]?'on':''}" data-toggle="${key}" aria-label="Toggle ${title}"><span></span></button></div>`).join('')}</div><div class="card"><h3>Device</h3><p>Android Simulator · 14.0</p><div class="result">Battery health · Good</div></div></div>`;content.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const key=b.dataset.toggle;state.toggles[key]=!state.toggles[key];persist();renderSettings()})}function renderRecents(){home.classList.remove('active');app.classList.remove('active');recents.classList.add('active');$('#recentList').innerHTML=recent.length?recent.map(id=>`<div class="recent-card" data-recent="${id}"><div class="recent-icon">${icons[id]}</div><div><strong>${appTitle(id)}</strong><small>Tap to return</small></div></div>`).join(''):'<div class="card"><p>No recently opened apps.</p></div>';$('#recentList').querySelectorAll('[data-recent]').forEach(el=>el.onclick=()=>openApp(el.dataset.recent))}
$('#appSearch').addEventListener('input',renderHome);$('#desktopMenu').onclick=()=>{state.weatherIndex=state.weatherIndex?0:1;persist();renderHome();bridge?.notify?.('Desktop refreshed.',{level:'success',timeoutMs:1800})};$('#back').onclick=closeApp;$('#navBack').onclick=()=>current?closeApp():null;$('#navHome').onclick=renderHome;$('#navRecent').onclick=renderRecents;async function boot(){try{const saved=await bridge?.storage?.read('android-simulator');if(saved&&typeof saved==='object')state={...state,...saved,toggles:{...state.toggles,...(saved.toggles||{})}}}catch(error){}setNavIcons();renderHome();document.body.classList.add('ready')}setInterval(()=>{const t=now();$('#clock').textContent=t;$('#time').textContent=t},1000);boot();
</script></body></html>
