<style>

background:var(--red);margin:25px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 16px}.tab{border:1px solid var(--vibe-border);background:var(--vibe-control);padding:10px 14px;cursor:pointer;font-size:11px;font-weight:800;letter-spacing:1.2px}.tab:hover,.tab.active{border-color:var(--red2);background:color-mix(in srgb,var(--red) 34%,var(--vibe-control))}.mode-copy{color:var(--vibe-muted);font-size:12px;margin:0 0 14px}.factions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:760px}.faction{min-height:130px;text-align:left;padding:14px;background:linear-gradient(145deg,color-mix(in srgb,var(--vibe-raised) 92%,#2b4148),color-mix(in srgb,var(--vibe-surface) 88%,#071218));border:1px solid var(--vibe-border);cursor:pointer;transition:transform .16s,border-color .16s}.faction:hover{transform:translateY(-2px);border-color:var(--gold)}.faction.selected{border:2px solid var(--red2);padding:13px;background:linear-gradient(145deg,color-mix(in srgb,var(--red) 30%,var(--vibe-raised)),var(--vibe-surface))}.faction svg{width:34px;height:34px;display:block;margin-bottom:12px}.faction b{display:block;font-size:12px;letter-spacing:.8px}.faction small{display:block;color:var(--vibe-muted);font-size:10px;line-height:1.4;margin-top:5px}.deploy{margin-top:24px;padding:13px 22px;border:0;background:var(--red);color:#fff;font-weight:900;letter-spacing:1.3px;cursor:pointer;box-shadow:0 3px 0 #711d21}.deploy:hover{background:var(--red2)}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.status{min-height:34px;margin-top:18px;padding:9px 12px;border-left:3px solid var(--gold);background:#07101499;color:var(--vibe-muted);font-size:12px;max-width:760px}.intel{align-self:start;padding:20px;background:linear-gradient(150deg,color-mix(in srgb,var(--vibe-raised) 90%,#26383f),color-mix(in srgb,var(--vibe-surface) 92%,#050b0e));border:1px solid var(--vibe-border);box-shadow:0 18px 40px #0005}.intel h2,.records h2{font-size:11px;letter-spacing:2px;color:var(--gold);margin:0 0 13px;padding-bottom:12px;border-bottom:1px solid var(--vibe-border)}.stat{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--vibe-border);font-size:12px;color:var(--vibe-muted)}.stat strong{color:var(--vibe-text)}.brief{margin-top:20px;padding:14px;background:#07101488;border:1px solid var(--vibe-border);color:var(--vibe-muted);font-size:12px;line-height:1.6}.brief b{display:block;color:var(--red2);font-size:10px;letter-spacing:1.5px;margin-bottom:7px}.record-link{margin-top:16px;background:none;border:0;color:var(--gold);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:11px}.records{max-width:760px;margin:auto;padding:clamp(24px,5vw,70px)}.records p{color:var(--vibe-muted)}.record-list{display:grid;gap:10px;margin-top:22px}.record-row{display:flex;justify-content:space-between;gap:16px;padding:15px;background:var(--vibe-raised);border:1px solid var(--vibe-border);font-size:12px}.record-row span{color:var(--vibe-muted)}.back{border:1px solid var(--vibe-border);background:var(--vibe-control);padding:10px 14px;cursor:pointer;margin-top:24px}
.battle{height:100%;display:flex;flex-direction:column;max-width:1440px;margin:auto;width:100%;padding:10px clamp(10px,2vw,24px) 14px}.battle-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;margin-bottom:10px}.mission{min-width:0}.mission b{display:block;font-size:13px;letter-spacing:1.2px}.mission span{font-size:11px;color:var(--vibe-muted)}.resource{display:flex;gap:13px;align-items:center;font:12px var(--vibe-font-mono);color:var(--gold);white-space:nowrap}.resource span{color:var(--vibe-muted);font-size:10px}.game-area{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:10px;min-height:0;flex:1}.canvas-frame{position:relative;min-width:0;min-height:270px;background:var(--deep);border:1px solid var(--vibe-border);box-shadow:0 12px 30px #0007;overflow:hidden}.canvas{width:100%;height:100%;display:block;cursor:crosshair}.help{position:absolute;left:10px;bottom:10px;padding:7px 9px;background:#061014bb;color:#dce4df;font-size:10px;pointer-events:none}.game-panel{min-width:0;display:flex;flex-direction:column;gap:10px;overflow:auto}.card{background:color-mix(in srgb,var(--vibe-raised) 90%,#13252c);border:1px solid var(--vibe-border);padding:13px}.card h2{font-size:10px;color:var(--gold);letter-spacing:1.7px;margin:0 0 11px}.unit-name{font-size:14px;font-weight:800}.unit-meta{color:var(--vibe-muted);font-size:11px;margin-top:3px}.health{height:5px;background:#0008;margin-top:11px}.health i{display:block;height:100%;background:var(--good);width:100%}.commands{display:grid;gap:7px}.gbtn{width:100%;border:1px solid var(--vibe-border);background:var(--vibe-control);padding:9px 10px;text-align:left;cursor:pointer;font-size:11px}.gbtn:hover{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 17%,var(--vibe-control))}.gbtn strong,.gbtn small{display:block}.gbtn small{color:var(--vibe-muted);font-size:10px;margin-top:2px}.gbtn.primary{background:var(--red);border-color:var(--red2);color:#fff;text-align:center;font-weight:900;letter-spacing:.8px}.log{min-height:75px;max-height:120px;overflow:auto;color:var(--vibe-muted);font:10px/1.6 var(--vibe-font-mono)}.log div{border-bottom:1px solid var(--vibe-border);padding:3px 0}.log .important{color:var(--gold)}.win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#061014dd;z-index:4}.win.open{display:flex}.win-card{width:min(430px,calc(100% - 28px));padding:25px;background:var(--vibe-raised);border:1px solid var(--gold);box-shadow:0 18px 55px #000}.win-card h2{margin:0;color:var(--gold);font-size:23px}.win-card p{color:var(--vibe-muted);font-size:13px;line-height:1.5}.win-card .gbtn{margin-top:7px}@media(max-width:850px){.setup{grid-template-columns:1fr;padding:24px}.intel{display:none}.game-area{grid-template-columns:1fr 190px}}@media(max-width:620px){.topmeta{display:none}.factions{grid-template-columns:1fr}.faction{min-height:88px}.faction svg{display:inline-block;vertical-align:middle;margin:0 9px 0 0}.faction b{display:inline}.faction small{margin-left:46px}.game-area{grid-template-columns:1fr}.canvas-frame{height:calc(100vh - 260px);min-height:250px}.game-panel{display:grid;grid-template-columns:1fr 1fr;align-content:start}.card:first-child,.card:last-child{grid-column:1/-1}.battle{padding:8px}.resource{gap:7px;flex-wrap:wrap;justify-content:flex-end}}
</style></head><body><main class="shell"><header class="top"><div class="identity"><img class="mark" src="icon.svg" alt="Red Alert 3 emblem"><div class="brand">COMMAND &amp; CONQUER<small>™</small><span>RED ALERT 3</span></div></div><div class="topmeta"><i></i>ALLIED COMMAND NETWORK</div></header><div class="screen" id="screen"></div></main>
<script>
(()=>{const S={surface:'setup',mode:'campaign',faction:'allies',ops:0,wins:0,last:'No operation completed'},F={allies:{name:'ALLIED FORCES',short:'ALLIES',desc:'Precision armor and adaptable air support.',color:'#6eb6d5',svg:'<path d="M18 4v28M4 18h28" stroke="currentColor" stroke-width="4"/><circle cx="18" cy="18" r="10" fill="none" stroke="currentColor" stroke-width="3"/>'},soviet:{name:'SOVIET UNION',short:'SOVIET',desc:'Heavy armor, brutal firepower, relentless pressure.',color:'#e0645e',svg:'<path d="M18 3 21.7 14H33l-9.2 6.7 3.5 11L18 25l-9.3 6.7 3.5-11L3 14h11.3L18 3Z" fill="currentColor"/>'},empire:{name:'EMPIRE OF THE RISING SUN',short:'EMPIRE',desc:'Experimental technology and rapid naval strikes.',color:'#e1b35e',svg:'<circle cx="18" cy="18" r="13" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="18" cy="18" r="6" fill="currentColor"/><path d="M18 2v8M18 26v8M2 18h8M26 18h8" stroke="currentColor" stroke-width="3"/>'}};let st={...S},rev=0,g=null,raf=0,resizeHandler;
const $=(s,r=document)=>r.querySelector(s),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),note=(m,level='info')=>window.vibeOS?.notify?.(m,{level,timeoutMs:2400});
async function load(){try{let a=await window.vibeOS?.state?.read?.();if(a?.state&&typeof a.state==='object'){st={...S,...a.state};rev=a.revision||0;return}}catch(e){}try{let x=localStorage.getItem('ra3-state');if(x)st={...S,...JSON.parse(x)}}catch(e){}}
function save(){try{localStorage.setItem('ra3-state',JSON.stringify(st))}catch(e){};clearTimeout(save.t);save.t=setTimeout(async()=>{try{let a=await window.vibeOS?.state?.write?.(st,rev);if(a?.revision!=null)rev=a.revision}catch(e){}},120)}function set(x){st={...st,...x};save()}
function icon(id){return `<svg viewBox="0 0 36 36" style="color:${F[id].color}" aria-hidden="true">${F[id].svg}</svg>`}
function setup(){cancelAnimationFrame(raf);g=null;if(st.mode==='records'){let rows=st.ops?`<div class="record-list"><div class="record-row"><span>Operations completed</span><strong>${st.ops}</strong></div><div class="record-row"><span>Confirmed victories</span><strong>${st.wins}</strong></div><div class="record-row"><span>Last report</span><strong>${esc(st.last)}</strong></div></div>`:'<div class="brief">No completed operations. The first theater is ready for a commander.</div>';$('#screen').innerHTML=`<section class="records"><span class="eyebrow">BATTLEFIELD RECORDS // SERVICE LOG</span><h1>Command history.</h1><p>Every confirmed operation is filed here for the next deployment.</p>${rows}<button class="back" id="back">RETURN TO COMMAND</button></section>`;$('#back').onclick=()=>{set({mode:'campaign'});setup()};return}
let copy=st.mode==='campaign'?'Mission 01 · Coastal command post · Establish your base before contact.':'Custom theater · Brighton Beach · Build a force and break the opposing line.';$('#screen').innerHTML=`<section class="setup"><div class="setup-main"><span class="eyebrow">TACTICAL COMMAND // ${st.mode==='campaign'?'MOSCOW THEATER':'SKIRMISH THEATER'}</span><h1>War is<br><em>inevitable.</em></h1><p class="lede">Three superpowers stand ready to reshape the world. Choose your command, marshal your forces, and seize the initiative before the enemy can strike.</p><div class="rule"></div><nav class="tabs"><button class="tab ${st.mode==='campaign'?'active':''}" data-mode="campaign">CAMPAIGN</button><button class="tab ${st.mode==='skirmish'?'active':''}" data-mode="skirmish">SKIRMISH</button><button class="tab" data-mode="records">BATTLEFIELD RECORDS</button></nav><p class="mode-copy">${copy}</p><div class="factions">${Object.entries(F).map(([id,f])=>`<button class="faction ${st.faction===id?'selected':''}" data-faction="${id}" aria-pressed="${st.faction===id}">${icon(id)}<b>${f.name}</b><small>${f.desc}</small></button>`).join('')}</div><button class="deploy" id="enter">ENTER COMMAND</button><div class="status" id="setup-status">${st.mode==='campaign'?'Campaign selected · Mission 01 briefing is ready.':'Skirmish selected · Brighton Beach is configured for deployment.'}</div></div><aside class="intel"><h2>COMMAND PROFILE</h2><div class="stat"><span>Commander</span><strong>${F[st.faction].short}</strong></div><div class="stat"><span>Operations</span><strong>${st.ops}</strong></div><div class="stat"><span>Clearance</span><strong>${st.wins?'Veteran':'Recruit'}</strong></div><div class="stat"><span>Connection</span><strong style="color:var(--good)">SECURE</strong></div><div class="brief"><b>FIELD BRIEFING</b><span>${copy} Your MCV and opening strike team are standing by.</span></div><button class="record-link" id="records">Review battlefield records →</button></aside></section>`;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{set({mode:b.dataset.mode});setup()});document.querySelectorAll('.faction').forEach(b=>b.onclick=()=>{set({faction:b.dataset.faction});setup()});$('#records').onclick=()=>{set({mode:'records'});setup()};$('#enter').onclick=start}
function start(){set({surface:'battle',ops:st.ops+1});g=fresh();battle();log('DEPLOYMENT CONFIRMED · MCV moving to the forward line','important')}
function fresh(){return{time:0,credits:1600,paused:false,ended:false,selected:[],wave:16,logs:[`THEATER ONLINE · ${F[st.faction].short} force acknowledged`,'MISSION 01 · Establish a base and neutralize the hostile command post'],color:F[st.faction].color,units:[{id:'mcv',type:'MCV',team:'p',x:190,y:410,hp:100,max:100,speed:0,range:0,damage:0,cd:0,target:null,deployed:false},{id:'r1',type:'RANGER',team:'p',x:300,y:380,hp:70,max:70,speed:75,range:130,damage:12,cd:0,target:null},{id:'r2',type:'RANGER',team:'p',x:335,y:420,hp:70,max:70,speed:75,range:130,damage:12,cd:0,target:null},{id:'harv',type:'HARVESTER',team:'p',x:258,y:500,hp:110,max:110,speed:42,range:0,damage:0,cd:0,target:{x:500,y:525}},{id:'base',type:'COMMAND POST',team:'e',x:820,y:245,hp:360,max:360,speed:0,range:260,damage:7,cd:0,target:null},{id:'guard',type:'GUARD',team:'e',x:720,y:355,hp:100,max:100,speed:38,range:150,damage:10,cd:0,target:null}]}}
function battle(){cancelAnimationFrame(raf);$('#screen').innerHTML=`<section class="battle"><div class="battle-head"><div class="mission"><b>${st.mode==='campaign'?'OPERATION: RED TIDE':'SKIRMISH: BRIGHTON BEACH'}</b><span>${F[st.faction].name} · Secure the command post</span></div><div class="resource"><span>TIME</span><b id="clock">00:00</b><span>▣</span><b id="credits">1,600</b><span>POWER</span><b id="power">82%</b></div></div><div class="game-area"><div class="canvas-frame"><canvas id="canvas" class="canvas" tabindex="0" aria-label="Tactical battlefield"></canvas><div class="help">CLICK SELECT · DRAG GROUP · RIGHT-CLICK MOVE / ATTACK</div><div class="win" id="win"><div class="win-card"><h2 id="win-title"></h2><p id="win-copy"></p><button class="gbtn primary" id="return">RETURN TO COMMAND</button><button class="gbtn" id="replay">REPLAY OPERATION</button></div></div></div><aside class="game-panel"><div class="card"><h2>SELECTED UNIT</h2><div class="unit-name" id="unit-name">No unit selected</div><div class="unit-meta" id="unit-meta">Select a friendly unit on the field.</div><div class="health"><i id="unit-health"></i></div></div><div class="card"><h2>COMMANDS</h2><div class="commands"><button class="gbtn primary" id="all">SELECT STRIKE GROUP</button><button class="gbtn" id="mcv"><strong>DEPLOY MCV</strong><small>Establish base · +$200 / sec</small></button><button class="gbtn" id="build"><strong>BUILD RANGER · $300</strong><small>Add a combat unit</small></button><button class="gbtn" id="pause"><strong>PAUSE OPERATION</strong></button><button class="gbtn" id="restart"><strong>RESTART OPERATION</strong></button><button class="gbtn" id="exit"><strong>EXIT TO COMMAND</strong></button></div></div><div class="card"><h2>FIELD COMMS</h2><div class="log" id="log"></div></div></aside></div></section>`;const c=$('#canvas');c.onpointerdown=down;c.onpointermove=move;c.onpointerup=up;c.onpointercancel=up;c.oncontextmenu=command;$('#all').onclick=()=>{g.selected=g.units.filter(u=>u.team==='p'&&u.type!=='HARVESTER').map(u=>u.id);selection()};$('#mcv').onclick=deploy;$('#build').onclick=build;$('#pause').onclick=pause;$('#restart').onclick=()=>{g=fresh();battle();log('OPERATION RESTARTED · All forces restored','important')};$('#exit').onclick=exit;$('#return').onclick=exit;$('#replay').onclick=()=>{g=fresh();battle();log('REPLAY STARTED · Initializing tactical map','important')};resize();if(resizeHandler)window.removeEventListener('resize',resizeHandler);resizeHandler=resize;window.addEventListener('resize',resizeHandler);selection();showLog();g.last=performance.now();raf=requestAnimationFrame(loop)}
function pt(e){let r=$('#canvas').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1000,y:(e.clientY-r.top)/r.height*620}}let drag=null;function down(e){drag=pt(e);$('#canvas').setPointerCapture?.(e.pointerId)}function move(){}function up(e){if(!drag)return;let p=pt(e),a=drag;drag=null;if(Math.hypot(p.x-a.x,p.y-a.y)>15){g.selected=g.units.filter(u=>u.team==='p'&&u.type!=='HARVESTER'&&u.x>=Math.min(a.x,p.x)&&u.x<=Math.max(a.x,p.x)&&u.y>=Math.min(a.y,p.y)&&u.y<=Math.max(a.y,p.y)).map(u=>u.id)}else{let u=g.units.slice().reverse().find(u=>u.team==='p'&&Math.hypot(u.x-p.x,u.y-p.y)<28);g.selected=u?[u.id]:[]}selection()}function command(e){e.preventDefault();if(!g.selected.length||g.ended)return;let p=pt(e),t=g.units.slice().reverse().find(u=>u.team==='e'&&Math.hypot(u.x-p.x,u.y-p.y)<36);g.selected.map(id=>g.units.find(u=>u.id===id)).filter(Boolean).forEach((u,i)=>u.target=t||{x:p.x+(i%2)*22-11,y:p.y+Math.floor(i/2)*22-11});log(t?`TARGET LOCKED · ${t.type} under fire`:'MOVE ORDER · Strike group advancing')}
function deploy(){let u=g.units.find(u=>u.id==='mcv');if(!u||u.deployed)return note('MCV is already deployed','warning');u.deployed=true;u.type='BASE';u.range=230;u.damage=5;log('MCV DEPLOYED · Construction yard online','important');selection()}function build(){let m=g.units.find(u=>u.id==='mcv');if(g.credits<300)return note('Insufficient credits · harvest the ore field','error');if(!m?.deployed)return note('Deploy the MCV before building units','warning');g.credits-=300;let n=g.units.filter(u=>u.type==='RANGER').length+1;g.units.push({id:'r'+Date.now(),type:'RANGER',team:'p',x:m.x+36,y:m.y+(n%3-1)*28,hp:70,max:70,speed:75,range:130,damage:12,cd:0,target:null});log(`RANGER ${n} READY · Strike group reinforced`,'important')}function pause(){g.paused=!g.paused;$('#pause strong').textContent=g.paused?'RESUME OPERATION':'PAUSE OPERATION';log(g.paused?'OPERATION PAUSED':'OPERATION RESUMED','important')}function exit(){set({surface:'setup'});setup()}
function log(x,kind=''){g.logs.unshift(x);g.logs=g.logs.slice(0,7);showLog()}function showLog(){if($('#log'))$('#log').innerHTML=g.logs.map((x,i)=>`<div class="${i?'':'important'}">${esc(x)}</div>`).join('')}function selection(){let u=g.units.find(u=>g.selected.includes(u.id));$('#unit-name').textContent=u?(u.type==='BASE'?'CONSTRUCTION YARD':u.type):'No unit selected';$('#unit-meta').textContent=u?`${u.team==='p'?'FRIENDLY':'HOSTILE'} · ${Math.round(u.hp)} / ${u.max} HP`:'Select a friendly unit on the field.';$('#unit-health').style.width=u?`${Math.max(0,u.hp/u.max*100)}%`:'0%'}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function update(dt){if(g.paused||g.ended)return;g.time+=dt;g.credits=Math.min(5000,g.credits+(g.units.some(u=>u.type==='BASE')?200:0)*dt);g.wave-=dt;if(g.wave<=0){g.wave=19;let i=g.units.filter(u=>u.team==='e'&&u.type==='GUARD').length;g.units.push({id:'e'+Date.now(),type:'GUARD',team:'e',x:760+(i%2)*35,y:375+(i%3)*30,hp:100,max:100,speed:38,range:150,damage:10,cd:0,target:null});log('HOSTILE REINFORCEMENT · Guard unit entering from the east','important')}for(let u of g.units){if(u.hp<=0)continue;u.cd-=dt;let t=u.target&&u.target.hp>0?u.target:null;if(t&&u.range&&dist(u,t)<u.range){if(u.cd<=0){t.hp-=u.damage;u.cd=.8;if(t.hp<=0)log(`${t.type} DESTROYED · Sector advantage secured`,'important')}}else if(u.target&&u.speed){let dx=u.target.x-u.x,dy=u.target.y-u.y,d=Math.hypot(dx,dy),step=Math.min(d,u.speed*dt);if(d<5)u.target=null;else{u.x+=dx/d*step;u.y+=dy/d*step}}if(u.team==='e'&&u.type==='GUARD'){let p=g.units.filter(x=>x.team==='p'&&x.hp>0).sort((a,b)=>dist(u,a)-dist(u,b))[0];if(p&&(!u.target||u.target.hp<=0))u.target=p}if(u.team==='e'&&u.type==='COMMAND POST'){let p=g.units.find(x=>x.team==='p'&&x.type!=='HARVESTER'&&x.hp>0);if(p&&dist(u,p)<u.range)u.target=p}if(u.team==='p'&&u.type==='HARVESTER'&&(!u.target||u.target.hp<=0))u.target={x:500+Math.sin(g.time*.3)*70,y:520+Math.cos(g.time*.3)*24}}g.units=g.units.filter(u=>u.hp>0);if(!g.units.find(u=>u.id==='base'))finish(true);else if(!g.units.find(u=>u.id==='mcv'))finish(false);selection()}
function finish(win){if(g.ended)return;g.ended=true;g.result=win?'VICTORY':'DEFEAT';set({wins:st.wins+(win?1:0),last:`${win?'Victory':'Defeat'} · ${F[st.faction].short} · ${fmt(g.time)}`});log(win?'HOSTILE COMMAND POST OFFLINE · Victory confirmed':'MCV LOST · Operation failed','important');$('#win-title').textContent=win?'OPERATION COMPLETE':'FORCES OVERWHELMED';$('#win-copy').textContent=win?`The hostile command post is down. ${F[st.faction].short} control the coast in ${fmt(g.time)}.`:'The MCV has been destroyed. Review the field and redeploy when ready.';$('#win').classList.add('open')}function fmt(t){return`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`}function loop(now){if(!g)return;let dt=Math.min(.05,(now-g.last)/1000);g.last=now;update(dt);render();raf=requestAnimationFrame(loop)}function resize(){let c=$('#canvas');if(!c)return;let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;render()}
function render(){let c=$('#canvas');if(!c||!g)return;let ctx=c.getContext('2d');ctx.setTransform(c.width/1000,0,0,c.height/620,0,0);ctx.clearRect(0,0,1000,620);let cs=getComputedStyle(document.documentElement),terrain=cs.getPropertyValue('--terrain').trim()||'#18323a',water=cs.getPropertyValue('--water').trim()||'#154250',line=cs.getPropertyValue('--waterline').trim()||'#286572';ctx.fillStyle=terrain;ctx.fillRect(0,0,1000,620);ctx.fillStyle=water;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(285,0);ctx.lineTo(235,120);ctx.lineTo(265,215);ctx.lineTo(190,305);ctx.lineTo(0,340);ctx.closePath();ctx.fill();ctx.strokeStyle=line;ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='#ffffff13';ctx.lineWidth=1;for(let x=0;x<1000;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,620);ctx.stroke()}for(let y=0;y<620;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}ctx.fillStyle='#d8b66a33';ctx.beginPath();ctx.ellipse(500,525,130,42,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e5ca7a88';ctx.setLineDash([5,6]);ctx.stroke();ctx.setLineDash([]);for(let i=0;i<8;i++){let x=430+(i%4)*45,y=510+Math.floor(i/4)*26;ctx.fillStyle='#d8b66a';ctx.beginPath();ctx.moveTo(x,y-7);ctx.lineTo(x+6,y);ctx.lineTo(x,y+7);ctx.lineTo(x-6,y);ctx.closePath();ctx.fill()}ctx.fillStyle='#0005';ctx.fillRect(660,150,240,205);ctx.fillStyle='#1d2425';ctx.fillRect(680,170,200,165);ctx.strokeStyle='#9d433c';ctx.lineWidth=4;ctx.strokeRect(680,170,200,165);ctx.fillStyle='#cc4f43';ctx.fillRect(755,210,50,50);ctx.fillStyle='#f0d681';ctx.font='700 11px monospace';ctx.fillText('HOSTILE COMMAND',690,155);ctx.fillText('POST',752,282);for(let u of g.units)if(u.hp>0)unit(ctx,u);for(let id of g.selected){let u=g.units.find(x=>x.id===id);if(u){ctx.strokeStyle='#f1d36e';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(u.x,u.y+18,24,8,0,0,Math.PI*2);ctx.stroke()}}if(g.paused&&!g.ended){ctx.fillStyle='#071014aa';ctx.fillRect(0,0,1000,620);ctx.fillStyle='#f0d681';ctx.font='800 30px sans-serif';ctx.textAlign='center';ctx.fillText('OPERATION PAUSED',500,310);ctx.textAlign='left'}$('#clock').textContent=fmt(g.time);$('#credits').textContent=Math.floor(g.credits).toLocaleString();$('#power').textContent=g.units.some(u=>u.type==='BASE')?'100%':'82%'}
function unit(ctx,u){let friendly=u.team==='p',col=friendly?g.color:'#df5b50';ctx.save();ctx.translate(u.x,u.y);ctx.shadowColor='#000b';ctx.shadowBlur=8;ctx.fillStyle=col;ctx.strokeStyle=friendly?'#dff2ec':'#2a0e0e';ctx.lineWidth=2;if(u.type==='BASE'||u.type==='COMMAND POST'){ctx.fillRect(-25,-22,50,44);ctx.strokeRect(-25,-22,50,44);ctx.fillStyle=friendly?'#e6d17f':'#7e2926';ctx.fillRect(-8,-30,16,16);ctx.fillStyle='#f4e7aa';ctx.font='700 10px monospace';ctx.textAlign='center';ctx.fillText(friendly?'MCV':'HQ',0,4)}else if(u.type==='HARVESTER'){ctx.beginPath();ctx.roundRect(-24,-14,48,28,5);ctx.fill();ctx.stroke();ctx.fillStyle='#d8b66a';ctx.fillRect(-10,-8,20,16);ctx.fillStyle='#10181b';ctx.fillRect(-21,10,10,6);ctx.fillRect(11,10,10,6)}else{ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(19,10);ctx.lineTo(0,17);ctx.lineTo(-19,10);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#dce8df';ctx.fillRect(-3,-8,7,13)}ctx.restore();ctx.fillStyle='#000a';ctx.fillRect(u.x-22,u.y-30,44,4);ctx.fillStyle=friendly?'#82c893':'#ef6a5d';ctx.fillRect(u.x-22,u.y-30,44*Math.max(0,u.hp/u.max),4)}load().then(()=>setup())})();
