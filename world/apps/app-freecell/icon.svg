<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">FreeCell playing card icon</title>
  <desc id="desc">A green card table with a fan of playing cards and four colored foundation markers</desc>
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#176b57"/>
      <stop offset="1" stop-color="#0b4038"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#061f1b" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#felt)"/>
  <path d="M31 180c38 31 85 39 137 25 26-7 44-19 57-34" fill="none" stroke="#4aa782" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>
  <g filter="url(#shadow)" transform="rotate(-13 102 126)">
    <rect x="54" y="67" width="87" height="124" rx="9" fill="#fffaf0" stroke="#e7dcc7" stroke-width="3"/>
    <text x="68" y="91" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#b72d3d">A</text>
    <text x="69" y="116" font-family="Georgia,serif" font-size="22" fill="#b72d3d">♥</text>
    <text x="97" y="151" text-anchor="middle" font-family="Georgia,serif" font-size="57" fill="#b72d3d">♥</text>
  </g>
  <g filter="url(#shadow)" transform="rotate(12 157 126)">
    <rect x="115" y="61" width="87" height="124" rx="9" fill="#fffaf0" stroke="#e7dcc7" stroke-width="3"/>
    <text x="128" y="86" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#172d3b">K</text>
    <text x="129" y="111" font-family="Georgia,serif" font-size="22" fill="#172d3b">♠</text>
    <text x="159" y="150" text-anchor="middle" font-family="Georgia,serif" font-size="57" fill="#172d3b">♠</text>
  </g>
  <g fill="#fffaf0" stroke="#d9cdb8" stroke-width="3">
    <rect x="31" y="35" width="30" height="39" rx="5"/>
    <rect x="69" y="35" width="30" height="39" rx="5"/>
    <rect x="157" y="35" width="30" height="39" rx="5"/>
    <rect x="195" y="35" width="30" height="39" rx="5"/>
  </g>
  <g font-family="Georgia,serif" font-size="22" text-anchor="middle">
    <text x="46" y="62" fill="#b72d3d">♥</text>
    <text x="84" y="62" fill="#172d3b">♠</text>
    <text x="172" y="62" fill="#b72d3d">♦</text>
    <text x="210" y="62" fill="#172d3b">♣</text>
  </g>
</svg>
