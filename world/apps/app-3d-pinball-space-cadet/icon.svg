<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">3D Pinball: Space Cadet</title>
  <desc id="desc">A polished blue pinball table floating in a starfield, with a silver ball, bumpers, rails, and flippers.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091631"/>
      <stop offset="0.58" stop-color="#102b58"/>
      <stop offset="1" stop-color="#061024"/>
    </linearGradient>
    <linearGradient id="tableEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50d7ff"/>
      <stop offset="0.45" stop-color="#1e6bd1"/>
      <stop offset="1" stop-color="#163274"/>
    </linearGradient>
    <linearGradient id="playfield" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#194d9b"/>
      <stop offset="0.5" stop-color="#0d79b3"/>
      <stop offset="1" stop-color="#08255f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.35" stop-color="#c8e6f7"/>
      <stop offset="0.62" stop-color="#6687a8"/>
      <stop offset="1" stop-color="#edf9ff"/>
    </linearGradient>
    <radialGradient id="ball" cx="32%" cy="25%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.3" stop-color="#dff6ff"/>
      <stop offset="0.72" stop-color="#88a8c5"/>
      <stop offset="1" stop-color="#3c5471"/>
    </radialGradient>
    <radialGradient id="bumper" cx="35%" cy="25%">
      <stop offset="0" stop-color="#fffbcb"/>
      <stop offset="0.28" stop-color="#ffd85a"/>
      <stop offset="0.7" stop-color="#f07b25"/>
      <stop offset="1" stop-color="#762653"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#020817" flood-opacity=".7"/>
    </filter>
    <clipPath id="fieldClip">
      <path d="M72 34h117c8 0 13 7 15 16l24 142c2 10-5 18-14 18H65c-9 0-16-8-14-18L61 50c1-9 4-16 11-16Z"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#space)"/>
  <g fill="#b9e9ff" opacity=".9">
    <circle cx="35" cy="48" r="1.4"/><circle cx="218" cy="44" r="1.1"/><circle cx="226" cy="112" r="1.7"/>
    <circle cx="32" cy="169" r="1"/><circle cx="211" cy="205" r="1.2"/><circle cx="48" cy="218" r="1.8"/>
    <circle cx="185" cy="22" r=".9"/><circle cx="79" cy="21" r="1.1"/>
  </g>
  <path d="M30 116c16-36 50-58 91-61 41-3 77 14 103 48" fill="none" stroke="#4fdcff" stroke-opacity=".3" stroke-width="2"/>
  <path d="M32 134c22 30 56 48 98 47 35-1 65-13 94-37" fill="none" stroke="#7d74ff" stroke-opacity=".3" stroke-width="2"/>

  <g transform="rotate(-7 129 131)" filter="url(#shadow)">
    <path d="M72 25h117c11 0 18 8 20 19l25 148c3 17-9 29-25 29H54c-16 0-28-12-25-29L54 44c2-11 7-19 18-19Z" fill="#091326" stroke="#254b83" stroke-width="4"/>
    <path d="M72 34h117c8 0 13 7 15 16l24 142c2 10-5 18-14 18H65c-9 0-16-8-14-18L61 50c1-9 4-16 11-16Z" fill="url(#playfield)" stroke="url(#tableEdge)" stroke-width="5"/>
    <g clip-path="url(#fieldClip)">
      <path d="M79 37 62 205M183 37l28 172" stroke="#79e7ff" stroke-opacity=".7" stroke-width="2"/>
      <path d="M95 51 81 197M164 51l20 147" stroke="#7ae5ff" stroke-opacity=".22" stroke-width="5"/>
      <path d="M58 155c27-21 61-31 102-27 23 2 38 8 58 20" fill="none" stroke="#8feeff" stroke-opacity=".32" stroke-width="3"/>
      <path d="M68 68c25-14 78-17 128-2" fill="none" stroke="#c3f8ff" stroke-opacity=".2" stroke-width="2"/>
      <path d="M94 47h66" stroke="#d8ffff" stroke-opacity=".35" stroke-width="3"/>
    </g>

    <!-- upper space-cadet target bank -->
    <g transform="translate(90 57)">
      <path d="M0 13 40 0l43 5 3 26-42 5-42-7Z" fill="#092750" stroke="#52dfff" stroke-width="2"/>
      <path d="m13 12 12-4 2 12-12 3Zm22-7 13-2 2 12-13 1Zm23 0 13 1 1 11-13-1Z" fill="#73eaff"/>
      <path d="M9 28 76 25" stroke="#2b82d9" stroke-width="3"/>
    </g>

    <!-- bumpers -->
    <g stroke="#ffb94d" stroke-width="2">
      <circle cx="101" cy="111" r="17" fill="#06245a"/>
      <circle cx="101" cy="111" r="12" fill="url(#bumper)"/>
      <circle cx="101" cy="111" r="5" fill="#fff0a3" stroke="none" filter="url(#glow)"/>
      <circle cx="154" cy="105" r="18" fill="#06245a"/>
      <circle cx="154" cy="105" r="13" fill="url(#bumper)"/>
      <circle cx="154" cy="105" r="5" fill="#fff0a3" stroke="none" filter="url(#glow)"/>
      <circle cx="180" cy="137" r="14" fill="#06245a"/>
      <circle cx="180" cy="137" r="10" fill="url(#bumper)"/>
      <circle cx="180" cy="137" r="4" fill="#fff0a3" stroke="none" filter="url(#glow)"/>
    </g>

    <!-- illuminated orbit lane -->
    <path d="M81 101c-10 36 1 75 31 91 24 13 55 8 69-13 10-16 5-31-2-42" fill="none" stroke="#4ee7ff" stroke-width="5" stroke-linecap="round" opacity=".8" filter="url(#glow)"/>
    <path d="M81 101c-10 36 1 75 31 91 24 13 55 8 69-13 10-16 5-31-2-42" fill="none" stroke="#e4ffff" stroke-width="1.5" stroke-dasharray="3 7"/>

    <!-- ball and trajectory -->
    <path d="M148 150c-10 13-10 22-1 31" fill="none" stroke="#f7fcff" stroke-width="2" stroke-dasharray="2 5" opacity=".8"/>
    <circle cx="146" cy="147" r="9" fill="url(#ball)" stroke="#d9f4ff" stroke-width="1.5"/>
    <ellipse cx="142.5" cy="143.5" rx="3" ry="2" fill="#fff" opacity=".9"/>

    <!-- lower rails and flippers -->
    <path d="M77 173c12 17 26 25 42 27M185 160c-1 16-10 28-22 36" fill="none" stroke="url(#steel)" stroke-width="5" stroke-linecap="round"/>
    <g fill="url(#steel)" stroke="#16355e" stroke-width="2">
      <path d="M93 193 125 172l8 10-33 22c-5 3-11 1-12-4s1-5 5-7Z"/>
      <path d="m164 192-30-19-8 10 31 21c5 3 11 1 12-4 1-3-1-6-5-8Z"/>
    </g>
    <circle cx="128" cy="181" r="7" fill="#ef8d30" stroke="#ffd77c" stroke-width="2"/>
    <circle cx="128" cy="181" r="2" fill="#fff"/>
    <path d="M69 218h125" stroke="#6fdfff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <path d="M48 233h160" stroke="#56dfff" stroke-opacity=".15" stroke-width="2"/>
</svg>
