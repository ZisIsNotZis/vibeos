<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD Editor</title><link rel="stylesheet" href="theme.css"></head>
<body><header class="bar"><div class="brand"><span class="mark">⌬</span><div><strong>Draftline</strong><small>Precision workspace</small></div></div><div class="doc"><span class="dot"></span><span id="docName">Untitled drawing</span><em id="saved">Saved</em></div><div class="actions"><button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button><button class="primary" id="save">Export SVG</button></div></header>
<main><aside class="tools"><div class="toolhead">TOOLS</div><button class="tool active" data-tool="select"><i>↖</i><span>Select</span><kbd>V</kbd></button><button class="tool" data-tool="line"><i>╱</i><span>Line</span><kbd>L</kbd></button><button class="tool" data-tool="rect"><i>□</i><span>Rectangle</span><kbd>R</kbd></button><button class="tool" data-tool="circle"><i>○</i><span>Circle</span><kbd>C</kbd></button><div class="toolhead lower">VIEW</div><button class="tool" id="grid"><i>▦</i><span>Grid</span><b class="switch on"></b></button><button class="tool" id="zoomFit"><i>⌗</i><span>Fit view</span></button></aside>
<section class="workspace"><div class="canvasbar"><span>Model space</span><span class="scale">100% <button id="zoomOut">−</button><button id="zoomIn">+</button></span></div><div class="stage" id="stage"><svg id="drawing" viewBox="0 0 1000 620" aria-label="Drawing canvas"><defs><pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="currentColor" stroke-opacity=".12"/></pattern><pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#minor)"/><path d="M100 0H0V100" fill="none" stroke="currentColor" stroke-opacity=".23"/></pattern></defs><rect id="gridBg" width="100%" height="100%" fill="url(#major)"/><g id="objects"></g><g id="crosshair" opacity="0"><line/><line/></g></svg><div class="hint" id="hint">Choose a tool, then click and drag on the canvas</div></div><div class="status"><span><b class="green"></b> Ready</span><span id="coords">X 0.00&nbsp;&nbsp; Y 0.00</span><span>Snap: 10 px</span></div></section>
<aside class="inspector"><div class="paneltitle">INSPECTOR</div><div id="empty"><div class="emptyicon">⌑</div><strong>No selection</strong><p>Select an object to inspect its dimensions and style.</p></div><div id="details" hidden><label>OBJECT TYPE</label><strong id="type">Rectangle</strong><hr><label>POSITION</label><div class="fields"><div><span>X</span><input id="x" type="number"></div><div><span>Y</span><input id="y" type="number"></div></div><label>SIZE</label><div class="fields"><div><span>W</span><input id="w" type="number"></div><div><span>H</span><input id="h" type="number"></div></div><label>STYLE</label><div class="fields"><div><span>Stroke</span><input id="stroke" type="color" value="#4f6df5"></div><div><span>Width</span><input id="sw" type="number" min="1" max="12"></div></div><button class="delete" id="delete">Delete object</button></div><div class="layers"><div class="paneltitle">LAYERS <button id="addLayer">＋</button></div><div class="layer"><span class="eye">◉</span><span>Geometry</span><small id="count">0 objects</small></div></div></aside></main><script src="app.js"></script></body></html>
