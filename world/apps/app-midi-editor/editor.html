<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midi editor</title>
<style>
:root{--bg:#0b1020;--panel:#151d31;--panel2:#1b2640;--line:#2d3b59;--text:#edf3ff;--muted:#8d9bb8;--mint:#6ee7c1;--orange:#ffb86b;--blue:#7aa2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 60% -20%,#27385e 0,#0b1020 55%);color:var(--text);font:13px Inter,ui-sans-serif,system-ui,sans-serif}.app{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px}.eyebrow{color:var(--mint);letter-spacing:2px;font-size:10px;font-weight:800}.brand h1{font-size:20px;margin:3px 0 0}.actions{display:flex;gap:8px}.btn,.tool,.zoom button{border:1px solid var(--line);background:var(--panel);border-radius:7px;color:var(--text);padding:9px 13px;font-weight:700;cursor:pointer}.btn:hover,.tool:hover,.zoom button:hover{border-color:#6680ad;background:var(--panel2)}.primary{background:var(--mint);border-color:var(--mint);color:#07231d}.transport{display:flex;align-items:center;gap:16px;padding:12px 16px;background:#11182a;border:1px solid var(--line);border-radius:10px;margin-bottom:16px}.transport button{border:0;cursor:pointer}.play{border-radius:50%;width:37px;height:37px;background:var(--mint);font-size:15px}.stop{background:transparent;color:var(--muted);font-size:17px}.counter{font-variant-numeric:tabular-nums;font-size:17px;font-weight:750;min-width:68px}.transport label{color:var(--muted);display:flex;align-items:center;gap:8px}.transport input{accent-color:var(--mint);width:110px}.transport output{color:var(--text);font-weight:700;width:35px}.main{background:#141c2e;border:1px solid var(--line);border-radius:12px;overflow:hidden}.toolbar{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}.tools{display:flex;gap:7px}.tool.active{background:#2b3b5d;color:var(--mint);border-color:#5f789e}.zoom{display:flex;align-items:center;gap:6px;color:var(--muted)}.zoom button{padding:5px 9px}.piano{display:grid;grid-template-columns:80px 1fr;overflow:auto}.labels{background:#11182a;border-right:1px solid var(--line);padding-top:31px}.pitch{height:29px;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:var(--muted);border-bottom:1px solid #202b43;font-size:11px}.pitch.black{color:#dbe5ff;background:#161f34}.roll-wrap{min-width:700px;overflow:hidden}.ruler{height:31px;display:grid;grid-template-columns:repeat(16,1fr);background:#11182a;border-bottom:1px solid var(--line)}.beat{padding:8px 0 0 6px;color:var(--muted);font-size:10px;border-left:1px solid var(--line)}.beat.strong{color:var(--text);font-weight:800;background:#18223a}.grid{position:relative}.row{height:29px;display:grid;grid-template-columns:repeat(16,1fr);border-bottom:1px solid #202b43}.row:nth-child(2n){background:#172137}.cell{border-left:1px solid #263452;cursor:crosshair}.cell:nth-child(4n+1){border-left-color:#496180}.cell:hover{background:#324768}.note{position:absolute;height:23px;border-radius:4px;background:var(--mint);box-shadow:0 2px 8px #0006;cursor:pointer;z-index:2}.note:hover{filter:brightness(1.15)}.note.orange{background:var(--orange)}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#ffdf87;z-index:3;pointer-events:none;opacity:0}.playhead.show{opacity:1}.footer{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;color:var(--muted)}.hint{font-size:12px}.status{color:var(--mint);font-weight:700}.side{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted)}.field{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--muted)}select{background:#10182a;border:1px solid var(--line);color:var(--text);padding:6px;border-radius:5px}.legend{display:flex;gap:15px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--mint);margin-right:5px}.dot.o{background:var(--orange)}@media(max-width:700px){.app{padding:14px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.side{grid-template-columns:1fr}.piano{grid-template-columns:64px 1fr}}
</style></head><body><main class="app">
<header class="top"><div class="brand"><svg class="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#172033"/><path d="M14 18h36M14 28h36M14 38h36M14 48h36M20 13v38M30 13v38M40 13v38M50 13v38" stroke="#34445f" stroke-width="2"/><path d="M16 32h12v8H16zM28 22h12v8H28zM40 12h10v8H40z" fill="#6ee7c1"/><circle cx="50" cy="48" r="5" fill="#ffb86b"/></svg><div><div class="eyebrow">SEQUENCE / SHAPE / HEAR</div><h1>Midi editor</h1></div></div><div class="actions"><button class="btn" id="newBtn">New pattern</button><button class="btn primary" id="saveBtn">Save pattern</button></div></header>
<section class="transport" aria-label="Transport controls"><button class="play" id="playBtn" type="button" aria-label="Play">▶</button><button class="stop" id="stopBtn" type="button" aria-label="Stop">■</button><span class="counter" id="counter" aria-live="polite">1.1.1</span><label>BPM <input id="bpm" type="range" min="60" max="180" value="112"><output id="bpmOut">112</output></label><label>Grid <select id="gridSize"><option value="1">1/16</option><option value="2">1/8</option><option value="4">1/4</option></select></label></section>
<section class="main"><div class="toolbar"><div class="tools"><button class="tool active" data-tool="draw">✦ Draw</button><button class="tool" data-tool="erase">⌫ Erase</button></div><div class="zoom"><button id="minus">−</button><span id="zoomLabel">100%</span><button id="plus">+</button></div></div><div class="piano"><div class="labels" id="labels"></div><div class="roll-wrap"><div class="ruler" id="ruler"></div><div class="grid" id="grid"><div class="playhead" id="playhead"></div></div></div></div><div class="footer"><span class="hint">Click to add notes · click a note to remove it · Space to play/pause</span><span class="status" id="status">Ready</span></div></section>
<div class="side"><section class="card"><h3>Track settings</h3><div class="field"><span>Instrument</span><select id="instrument"><option>Studio Piano</option><option>Warm Synth</option><option>Pluck Lead</option></select></div><div class="field"><span>Velocity</span><input id="velocity" type="range" min="20" max="127" value="96"></div></section><section class="card"><h3>Pattern overview</h3><div class="field"><span>Notes</span><b id="noteCount">0</b></div><div class="field"><span>Length</span><b>4 bars</b></div><div class="legend"><span><i class="dot"></i>Selected notes</span><span><i class="dot o"></i>Black keys</span></div></section></div>
</main><script>
const pitches=['C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];const keyBlack=new Set(['A#4','G#4','F#4','D#4','C#4']);const KEY='midi-editor-pattern';const starter={notes:[{row:12,col:0},{row:10,col:2},{row:8,col:4},{row:7,col:6},{row:5,col:8},{row:3,col:10},{row:4,col:12}],bpm:112,instrument:'Studio Piano',velocity:96};let data;try{data=JSON.parse(localStorage.getItem(KEY))||null}catch(e){};if(!data||!Array.isArray(data.notes))data=JSON.parse(JSON.stringify(starter));data.bpm=Math.min(180,Math.max(60,Number(data.bpm)||112));data.velocity=Math.min(127,Math.max(20,Number(data.velocity)||96));data.instrument=['Studio Piano','Warm Synth','Pluck Lead'].includes(data.instrument)?data.instrument:'Studio Piano';let tool='draw',playing=false,pos=0,timer,zoom=1,audio;
const $=id=>document.getElementById(id);function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){labels.innerHTML=pitches.map(p=>`<div class="pitch ${keyBlack.has(p)?'black':''}">${p}</div>`).join('');ruler.innerHTML=Array.from({length:16},(_,i)=>`<div class="beat ${i%4===0?'strong':''}">${i%4===0?i/4+1:''}</div>`).join('');grid.querySelectorAll('.row,.note').forEach(x=>x.remove());for(let r=0;r<13;r++){let row=document.createElement('div');row.className='row';for(let c=0;c<16;c++){let cell=document.createElement('div');cell.className='cell';cell.onclick=()=>toggle(r,c);row.appendChild(cell)}grid.appendChild(row)}data.notes.forEach((n,i)=>{let el=document.createElement('div');el.className='note '+(keyBlack.has(pitches[n.row])?'orange':'');el.style.left=`calc(${n.col/16*100}% + 3px)`;el.style.width=`calc(${1/16*100}% - 6px)`;el.style.top=`${n.row*29+3}px`;el.title=`${pitches[n.row]} · step ${n.col+1}`;el.onclick=e=>{e.stopPropagation();data.notes.splice(i,1);persist();render();message('Note removed')};grid.appendChild(el)});noteCount.textContent=data.notes.length}
function toggle(r,c){let found=data.notes.findIndex(n=>n.row===r&&n.col===c);if(tool==='erase'){if(found>=0)data.notes.splice(found,1)}else if(found>=0){data.notes.splice(found,1)}else data.notes.push({row:r,col:c});persist();render();message(found>=0?'Note removed':`${pitches[r]} added`)}function message(s){status.textContent=s;clearTimeout(window.msg);window.msg=setTimeout(()=>status.textContent='Ready',1600)}
function beep(note){const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)return;audio=audio||new AudioCtor();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();let f=440*Math.pow(2,(note-69)/12);o.type=data.instrument==='Warm Synth'?'sawtooth':data.instrument==='Pluck Lead'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime((+data.velocity/127)*.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.19)}function tick(){document.querySelectorAll('.note').forEach((n,i)=>n.style.outline='');data.notes.filter(n=>n.col===pos).forEach(n=>beep(60+(12-n.row)));document.querySelectorAll('.note').forEach(n=>{if(n.style.left.startsWith(`calc(${pos/16*100}%`))n.style.outline='2px solid #ffdf87'});playhead.style.left=`${pos/16*100}%`;counter.textContent=`${Math.floor(pos/4)+1}.${pos%4+1}.1`;pos=(pos+1)%16}function transport(){clearInterval(timer);if(playing)timer=setInterval(tick,60000/data.bpm/4)}
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'Ⅱ':'▶';playBtn.setAttribute('aria-label',playing?'Pause':'Play');if(playing){playhead.classList.add('show');tick()}else{playhead.classList.remove('show');document.querySelectorAll('.note').forEach(n=>n.style.outline='')}transport();message(playing?'Playing pattern':'Paused')};stopBtn.onclick=()=>{playing=false;pos=0;playBtn.textContent='▶';playhead.classList.remove('show');transport();counter.textContent='1.1.1';message('Stopped')};bpm.value=data.bpm;bpmOut.textContent=data.bpm;bpm.oninput=()=>{data.bpm=+bpm.value;bpmOut.textContent=bpm.value;persist();transport()};instrument.value=data.instrument;instrument.onchange=()=>{data.instrument=instrument.value;persist();message(instrument.value+' selected')};velocity.value=data.velocity;velocity.oninput=()=>{data.velocity=+velocity.value;persist()};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});newBtn.onclick=()=>{data.notes=[];persist();render();message('New empty pattern')};saveBtn.onclick=()=>{persist();message('Pattern saved locally')};minus.onclick=()=>{zoom=Math.max(.75,zoom-.25);rollWrap.style.zoom=zoom;zoomLabel.textContent=Math.round(zoom*100)+'%'};plus.onclick=()=>{zoom=Math.min(1.5,zoom+.25);rollWrap.style.zoom=zoom;zoomLabel.textContent=Math.round(zoom*100)+'%'};document.onkeydown=e=>{if(e.code==='Space'&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName)){e.preventDefault();playBtn.click()}};render();
</script></body></html>
