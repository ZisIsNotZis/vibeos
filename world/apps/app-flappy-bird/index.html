<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Bird</title>
  <style>
    :root {
      --vibe-font-ui: Inter, ui-sans-serif, system-ui, sans-serif;
      --vibe-font-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --vibe-text-caption: calc(11px * var(--vibe-scale, 1));
      --vibe-text-label: calc(12px * var(--vibe-scale, 1));
      --vibe-text-body: calc(14px * var(--vibe-scale, 1));
      --vibe-text-title: calc(18px * var(--vibe-scale, 1));
      --vibe-text-heading: calc(24px * var(--vibe-scale, 1));
      --vibe-text-display: calc(34px * var(--vibe-scale, 1));
      --vibe-line-tight: 1.15;
      --vibe-line-normal: 1.5;
    }
    :root, :root[data-theme="dark"] {
      --vibe-surface: #191923; --vibe-raised: #242431; --vibe-control: #303044;
      --vibe-text: #f1f1f6; --vibe-muted: #aeb0c2; --vibe-border: #ffffff22;
      --vibe-accent: #a89dfc; color-scheme: dark;
    }
    :root[data-theme="light"] {
      --vibe-surface: #f7f8fc; --vibe-raised: #fff; --vibe-control: #e8ebf3;
      --vibe-text: #20202b; --vibe-muted: #596070; --vibe-border: #20202b22;
      --vibe-accent: #6658cf; color-scheme: light;
    }
    :root[data-theme="desert"] {
      --vibe-surface: #f5e6c8; --vibe-raised: #fff7e5; --vibe-control: #dfbf82;
      --vibe-text: #302016; --vibe-muted: #674b34; --vibe-border: #5b371f35;
      --vibe-accent: #a85028; color-scheme: light;
    }
    :root[data-ui-typeface="system"] { --vibe-font-ui: system-ui, -apple-system, "Segoe UI", sans-serif; }
    :root[data-ui-typeface="accessible"] { --vibe-font-ui: Arial, Helvetica, sans-serif; }
    :root[data-mono-typeface="system"] { --vibe-font-mono: ui-monospace, monospace; }
    :root[data-mono-typeface="accessible"] { --vibe-font-mono: "Courier New", monospace; }
    :root[data-display-scale="compact"] { --vibe-scale: .8; }
    :root[data-display-scale="comfortable"] { --vibe-scale: 1.1; }
    :root[data-display-scale="large"] { --vibe-scale: 1.25; }
    :root[data-display-scale="extra_large"] { --vibe-scale: 1.5; }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--vibe-surface); color: var(--vibe-text); font-family: var(--vibe-font-ui);
      font-size: var(--vibe-text-body); line-height: var(--vibe-line-normal);
    }
    button { font: inherit; }
    .app {
      height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
      background: var(--vibe-surface);
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 18px clamp(18px, 4vw, 46px) 12px; flex: 0 0 auto;
    }
    .brand { display: flex; gap: 11px; align-items: center; min-width: 0; }
    .brand-mark { width: 28px; height: 28px; flex: 0 0 28px; }
    .brand-copy { min-width: 0; }
    .brand-name { font-size: var(--vibe-text-title); font-weight: 800; letter-spacing: -.035em; line-height: var(--vibe-line-tight); }
    .brand-tag { color: var(--vibe-muted); font-size: var(--vibe-text-caption); letter-spacing: .04em; text-transform: uppercase; }
    .top-stats { display: flex; gap: 22px; align-items: center; color: var(--vibe-muted); font-size: var(--vibe-text-label); }
    .stat { display: flex; gap: 7px; align-items: baseline; white-space: nowrap; }
    .stat strong { color: var(--vibe-text); font-family: var(--vibe-font-mono); font-size: var(--vibe-text-body); }
    .stage {
      min-height: 0; flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
      padding: 4px clamp(12px, 3vw, 38px) 22px; overflow: hidden;
    }
    .game-shell {
      width: min(100%, 820px); height: min(100%, 680px); min-height: 300px;
      position: relative; border: 1px solid var(--vibe-border); border-radius: 22px; overflow: hidden;
      box-shadow: 0 20px 60px color-mix(in srgb, var(--vibe-text) 11%, transparent), 0 2px 8px #00000018;
      background: #7bcfe0;
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
    .hud { position: absolute; inset: 0; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px; }
    .score-chip { text-align: left; color: #fff; text-shadow: 0 2px 4px #16374c99; }
    .score-chip .eyebrow { font-size: var(--vibe-text-caption); text-transform: uppercase; letter-spacing: .12em; font-weight: 800; opacity: .82; }
    .score-value { font-family: var(--vibe-font-mono); font-size: clamp(27px, 5vw, 46px); font-weight: 800; line-height: 1; }
    .pause-btn {
      pointer-events: auto; border: 1px solid #ffffff66; color: #fff; background: #17455c88; width: 38px; height: 38px;
      border-radius: 11px; display: grid; place-items: center; cursor: pointer; transition: background .16s, transform .16s;
    }
    .pause-btn:hover { background: #17455ccc; transform: translateY(-1px); }
    .pause-btn:focus-visible, .action:focus-visible, .menu-btn:focus-visible { outline: 3px solid var(--vibe-accent); outline-offset: 3px; }
    .pause-icon { width: 12px; height: 14px; position: relative; }
    .pause-icon::before, .pause-icon::after { content: ""; position: absolute; top: 0; bottom: 0; width: 4px; background: currentColor; border-radius: 2px; }
    .pause-icon::before { left: 0; } .pause-icon::after { right: 0; }
    .pause-btn.is-play .pause-icon::before { width: 0; height: 0; top: 1px; bottom: auto; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid currentColor; background: transparent; border-radius: 0; }
    .pause-btn.is-play .pause-icon::after { display: none; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: #153d4e35; }
    .overlay[hidden] { display: none; }
    .card {
      width: min(100%, 360px); padding: 30px 28px 26px; border-radius: 20px; text-align: center;
      color: #fff; background: #12384bd9; border: 1px solid #ffffff3d; box-shadow: 0 18px 44px #0732444f;
      backdrop-filter: blur(9px);
    }
    .card-kicker { color: #b9e7dd; font-size: var(--vibe-text-caption); letter-spacing: .15em; font-weight: 800; text-transform: uppercase; }
    .card h1 { margin: 8px 0 8px; font-size: clamp(28px, 5vw, 42px); letter-spacing: -.06em; line-height: var(--vibe-line-tight); }
    .card p { margin: 0 auto 21px; color: #e3f2ee; font-size: var(--vibe-text-body); max-width: 270px; }
    .action {
      appearance: none; border: 0; border-radius: 12px; background: #f7c84a; color: #302016; padding: 12px 22px;
      min-width: 145px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 #bb7824; transition: transform .12s, box-shadow .12s, filter .12s;
    }
    .action:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 6px 0 #bb7824; }
    .action:active { transform: translateY(3px); box-shadow: 0 2px 0 #bb7824; }
    .secondary { background: #ffffff1a; color: #fff; box-shadow: inset 0 0 0 1px #ffffff44; margin-left: 8px; }
    .secondary:hover { box-shadow: inset 0 0 0 1px #ffffff66; }
    .result-row { display: flex; justify-content: center; gap: 24px; margin: 18px 0 22px; }
    .result-stat strong { display: block; font-family: var(--vibe-font-mono); font-size: 25px; line-height: 1.1; }
    .result-stat span { color: #b9d8d2; font-size: var(--vibe-text-caption); text-transform: uppercase; letter-spacing: .08em; }
    .hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); color: #fff; text-shadow: 0 2px 4px #16374c99; font-size: var(--vibe-text-label); font-weight: 700; white-space: nowrap; pointer-events: none; opacity: .88; }
    .footer { flex: 0 0 auto; padding: 0 22px 17px; display: flex; justify-content: center; color: var(--vibe-muted); font-size: var(--vibe-text-caption); }
    .footer kbd { border: 1px solid var(--vibe-border); border-radius: 5px; padding: 1px 5px; font-family: var(--vibe-font-mono); color: var(--vibe-text); }
    @media (max-width: 560px) {
      .topbar { padding-top: 12px; }
      .top-stats { gap: 10px; }
      .game-shell { border-radius: 16px; }
      .stage { padding-inline: 8px; padding-bottom: 12px; }
      .footer { padding-bottom: 10px; }
      .secondary { display: block; margin: 15px auto 0; }
    }
    @media (max-height: 470px) {
      .topbar { padding-block: 8px; }
      .footer { display: none; }
      .game-shell { min-height: 250px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Flappy Bird game">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="#f7c84a" stroke="#bb7824" stroke-width="3"/>
          <path d="M12 34c8-7 17-7 25-1 5 4 10 4 15 1l-5 12H20Z" fill="#e99e27"/>
          <circle cx="37" cy="23" r="8" fill="#fff"/><circle cx="39" cy="23" r="3.5" fill="#263449"/>
          <path d="M44 28 59 32 44 37c-4-2-4-7 0-9Z" fill="#f0832b"/>
        </svg>
        <div class="brand-copy"><div class="brand-name">Flappy Bird</div><div class="brand-tag">Skyline run</div></div>
      </div>
      <div class="top-stats" aria-label="Personal records">
        <div class="stat"><span>Best</span><strong id="bestScore">0</strong></div>
        <div class="stat"><span>Runs</span><strong id="runs">0</strong></div>
      </div>
    </header>
    <section class="stage">
      <div class="game-shell" id="gameShell">
        <canvas id="game" aria-label="Game board. Click, tap, or press Space to flap."></canvas>
        <div class="hud">
          <div class="score-chip"><div class="eyebrow">Score</div><div class="score-value" id="score">0</div></div>
          <button class="pause-btn" id="pauseBtn" type="button" aria-label="Pause game" title="Pause game"><span class="pause-icon" aria-hidden="true"></span></button>
        </div>
        <div class="hint" id="hint">Click, tap, or press Space to flap</div>
        <div class="overlay" id="overlay">
          <div class="card" id="card">
            <div class="card-kicker">Skyline run</div>
            <h1 id="cardTitle">Ready to fly?</h1>
            <p id="cardText">Thread the gaps, keep your wings steady, and chase a new high score.</p>
            <div id="resultRow" class="result-row" hidden>
              <div class="result-stat"><strong id="finalScore">0</strong><span>Score</span></div>
              <div class="result-stat"><strong id="bestResult">0</strong><span>Best</span></div>
            </div>
            <button class="action" id="primaryBtn" type="button">Start flight</button>
            <button class="action secondary" id="menuBtn" type="button" hidden>Back to menu</button>
          </div>
        </div>
      </div>
    </section>
    <footer class="footer"><span><kbd>Space</kbd> flap &nbsp;·&nbsp; <kbd>P</kbd> pause</span></footer>
  </main>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('game');
      const shell = document.getElementById('gameShell');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const cardTitle = document.getElementById('cardTitle');
      const cardText = document.getElementById('cardText');
      const resultRow = document.getElementById('resultRow');
      const primaryBtn = document.getElementById('primaryBtn');
      const menuBtn = document.getElementById('menuBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const scoreEl = document.getElementById('score');
      const bestScoreEl = document.getElementById('bestScore');
      const bestResultEl = document.getElementById('bestResult');
      const finalScoreEl = document.getElementById('finalScore');
      const runsEl = document.getElementById('runs');
      const hint = document.getElementById('hint');
      const bridge = window.vibeOS;
      const storeKey = 'flappy-bird-progress';
      let progress = { best: 0, runs: 0 };
      let state = 'menu';
      let raf = 0;
      let lastTime = 0;
      let width = 0;
      let height = 0;
      let dpr = 1;
      let bird;
      let pipes;
      let score = 0;
      let elapsed = 0;
      let shake = 0;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const colors = () => {
        const desert = document.documentElement.dataset.theme === 'desert';
        return desert ? { skyTop:'#e8bd78', skyBottom:'#f5dfac', cloud:'#fff4d4', hill:'#c18a4b', hill2:'#9c693b', ground:'#d6a45f', groundLine:'#845332', pipe:'#5b9c45', pipeDark:'#356c3b' } : { skyTop:'#64c4df', skyBottom:'#bcebd3', cloud:'#ffffff', hill:'#d9c96c', hill2:'#b5a74e', ground:'#d6bb58', groundLine:'#7d7138', pipe:'#52bd67', pipeDark:'#287b4e' };
      };
      function loadProgress() {
        try {
          const raw = localStorage.getItem(storeKey);
          if (raw) progress = { ...progress, ...JSON.parse(raw) };
        } catch (_) {}
        if (bridge?.storage?.read) bridge.storage.read(storeKey).then(value => {
          if (value && typeof value === 'object') { progress = { ...progress, ...value }; updateStats(); }
        }).catch(() => {});
        updateStats();
      }
      function saveProgress() {
        try { localStorage.setItem(storeKey, JSON.stringify(progress)); } catch (_) {}
        if (bridge?.storage?.write) bridge.storage.write(storeKey, progress).catch(() => {});
        updateStats();
      }
      function updateStats() { bestScoreEl.textContent = progress.best; runsEl.textContent = progress.runs; }
      function resize() {
        const rect = shell.getBoundingClientRect();
        width = Math.max(280, rect.width); height = Math.max(250, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (bird) bird.x = width * .28;
        draw();
      }
      function resetWorld() {
        const scale = clamp(width / 650, .72, 1.25);
        bird = { x: width * .28, y: height * .47, r: 17 * scale, vy: 0, rotation: 0, flapPhase: 0 };
        pipes = []; score = 0; elapsed = 0; shake = 0;
        scoreEl.textContent = '0';
        addPipe(width + 50);
        addPipe(width + width * .54);
      }
      function gapSize() { return clamp(height * .30 - score * 1.3, 116, 205); }
      function addPipe(x) {
        const ground = height * .13;
        const gap = gapSize();
        const topMin = 45, topMax = Math.max(topMin, height - ground - gap - 45);
        pipes.push({ x, width: clamp(width * .105, 54, 78), top: topMin + Math.random() * (topMax - topMin), gap, passed: false });
      }
      function flap() {
        if (state === 'menu' || state === 'over') { startGame(); return; }
        if (state === 'paused') { togglePause(); return; }
        if (state !== 'playing') return;
        bird.vy = -clamp(height * .77, 280, 430);
        bird.flapPhase = 1;
      }
      function startGame() {
        progress.runs += 1; saveProgress(); resetWorld(); state = 'playing';
        overlay.hidden = true; hint.hidden = true; pauseBtn.disabled = false; pauseBtn.classList.remove('is-play');
        lastTime = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
      }
      function finishGame() {
        state = 'over'; shake = 9; progress.best = Math.max(progress.best, score); saveProgress();
        finalScoreEl.textContent = score; bestResultEl.textContent = progress.best;
        cardTitle.textContent = score >= progress.best && score > 0 ? 'New flight record' : 'Flight ended';
        cardText.textContent = score > 0 ? 'A clean run. Find the next opening and beat your mark.' : 'The first gap is the hardest. Try again and keep the rhythm.';
        resultRow.hidden = false; primaryBtn.textContent = 'Fly again'; menuBtn.hidden = false; overlay.hidden = false; hint.hidden = true;
        pauseBtn.disabled = true; draw();
      }
      function showMenu() {
        state = 'menu'; resetWorld(); resultRow.hidden = true; cardTitle.textContent = 'Ready to fly?';
        cardText.textContent = 'Thread the gaps, keep your wings steady, and chase a new high score.';
        primaryBtn.textContent = 'Start flight'; menuBtn.hidden = true; overlay.hidden = false; hint.hidden = false; pauseBtn.disabled = true; draw();
      }
      function togglePause() {
        if (state === 'playing') {
          state = 'paused'; cardTitle.textContent = 'Flight paused'; cardText.textContent = 'Take a breath. The skyline is waiting for your next flap.';
          resultRow.hidden = true; primaryBtn.textContent = 'Resume flight'; menuBtn.hidden = false; overlay.hidden = false; hint.hidden = true; pauseBtn.classList.add('is-play'); draw();
        } else if (state === 'paused') {
          state = 'playing'; overlay.hidden = true; hint.hidden = true; pauseBtn.classList.remove('is-play'); lastTime = performance.now(); raf = requestAnimationFrame(loop);
        }
      }
      function loop(now) {
        if (state !== 'playing') return;
        const dt = Math.min((now - lastTime) / 1000, .034); lastTime = now; update(dt); draw(); raf = requestAnimationFrame(loop);
      }
      function update(dt) {
        elapsed += dt; const speed = clamp(width * .48 + score * 4.5, 245, 370); const gravity = height * 2.15;
        bird.vy += gravity * dt; bird.y += bird.vy * dt; bird.rotation = clamp(bird.vy / 540, -.48, 1.12); bird.flapPhase = Math.max(0, bird.flapPhase - dt * 4.5);
        for (const pipe of pipes) {
          pipe.x -= speed * dt;
          if (!pipe.passed && pipe.x + pipe.width < bird.x - bird.r) { pipe.passed = true; score += 1; scoreEl.textContent = score; }
        }
        if (pipes.length && pipes[0].x + pipes[0].width < -30) pipes.shift();
        const last = pipes[pipes.length - 1];
        if (last && last.x < width - width * .54) addPipe(width + 20);
        const groundY = height * .87;
        if (bird.y - bird.r < 0 || bird.y + bird.r > groundY || pipes.some(pipe => collide(pipe))) finishGame();
      }
      function collide(pipe) {
        const birdLeft = bird.x - bird.r * .82, birdRight = bird.x + bird.r * .82;
        const pipeLeft = pipe.x, pipeRight = pipe.x + pipe.width;
        if (birdRight < pipeLeft || birdLeft > pipeRight) return false;
        const topBottom = pipe.top + 27, bottomTop = pipe.top + pipe.gap - 27;
        return bird.y - bird.r * .77 < topBottom || bird.y + bird.r * .77 > bottomTop;
      }
      function roundedRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : (ctx.rect(x, y, w, h)); }
      function draw() {
        if (!width || !height) return;
        const c = colors(); ctx.save();
        if (shake > 0) { ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= .82; if (shake < .2) shake = 0; }
        const sky = ctx.createLinearGradient(0, 0, 0, height); sky.addColorStop(0, c.skyTop); sky.addColorStop(1, c.skyBottom); ctx.fillStyle = sky; ctx.fillRect(0, 0, width, height);
        drawClouds(c); drawHills(c); for (const pipe of (pipes || [])) drawPipe(pipe, c); drawGround(c); if (bird) drawBird(); ctx.restore();
      }
      function drawClouds(c) {
        ctx.fillStyle = c.cloud; ctx.globalAlpha = .43;
        const drift = (elapsed * 10) % (width + 180);
        for (const p of [{x:width*.16,y:height*.19,s:1},{x:width*.67,y:height*.29,s:.72}]) {
          const x = p.x - drift * .16; const y = p.y; const s = p.s;
          ctx.beginPath(); ctx.arc(x, y, 22*s, 0, Math.PI*2); ctx.arc(x+25*s, y-12*s, 29*s, 0, Math.PI*2); ctx.arc(x+56*s, y, 20*s, 0, Math.PI*2); ctx.fillRect(x-22*s, y, 78*s, 20*s); ctx.fill();
        } ctx.globalAlpha = 1;
      }
      function drawHills(c) {
        ctx.fillStyle = c.hill; ctx.beginPath(); ctx.moveTo(0,height*.73); for (let x=0;x<=width+100;x+=100) ctx.quadraticCurveTo(x+45,height*.63+(x%220)*.0004*height,x+100,height*.73); ctx.lineTo(width,height); ctx.lineTo(0,height); ctx.fill();
        ctx.fillStyle = c.hill2; ctx.globalAlpha=.45; ctx.beginPath(); ctx.moveTo(0,height*.8); for (let x=0;x<=width+100;x+=130) ctx.quadraticCurveTo(x+55,height*.68,x+130,height*.8); ctx.lineTo(width,height); ctx.lineTo(0,height); ctx.fill(); ctx.globalAlpha=1;
      }
      function drawPipe(pipe,c) {
        const cap = 27; const bottom = pipe.top + pipe.gap;
        const grad = ctx.createLinearGradient(pipe.x,0,pipe.x+pipe.width,0); grad.addColorStop(0,c.pipeDark); grad.addColorStop(.18,c.pipe); grad.addColorStop(.55,'#83da73'); grad.addColorStop(1,c.pipeDark);
        ctx.fillStyle=grad; ctx.shadowColor='#2a644b55'; ctx.shadowBlur=8; ctx.shadowOffsetY=3; roundedRect(pipe.x, -8, pipe.width, pipe.top+8, 2); ctx.fill(); roundedRect(pipe.x-7, pipe.top-cap, pipe.width+14, cap, 5); ctx.fill(); roundedRect(pipe.x, bottom, pipe.width, height-bottom+8, 2); ctx.fill(); roundedRect(pipe.x-7, bottom, pipe.width+14, cap, 5); ctx.fill(); ctx.shadowColor='transparent'; ctx.fillStyle='#b1ed8940'; ctx.fillRect(pipe.x+10, 0, 8, pipe.top-cap); ctx.fillRect(pipe.x+10, bottom+cap, 8, height-bottom);
      }
      function drawGround(c) {
        const y=height*.87; ctx.fillStyle=c.ground; ctx.fillRect(0,y,width,height-y); ctx.fillStyle=c.groundLine; ctx.fillRect(0,y,width,5); ctx.globalAlpha=.3; ctx.strokeStyle='#fff3a0'; ctx.lineWidth=3; const offset=(elapsed*110)%34; for(let x=-offset;x<width+40;x+=34){ctx.beginPath();ctx.moveTo(x,y+14);ctx.lineTo(x-10,y+26);ctx.stroke();} ctx.globalAlpha=1;
      }
      function drawBird() {
        const r=bird.r; ctx.save(); ctx.translate(bird.x,bird.y); ctx.rotate(bird.rotation); ctx.shadowColor='#16465b66'; ctx.shadowBlur=8; ctx.shadowOffsetY=4;
        const grad=ctx.createLinearGradient(-r,-r,r,r); grad.addColorStop(0,'#ffe96a'); grad.addColorStop(1,'#efa62b'); ctx.fillStyle=grad; ctx.strokeStyle='#b8771c'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(0,0,r*1.32,r,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.shadowColor='transparent'; ctx.fillStyle='#e99e27'; ctx.beginPath(); ctx.ellipse(-r*.42,r*.35,r*.8,r*.38,-.25,0,Math.PI*2); ctx.fill(); ctx.stroke();
        const wingY = r*.2 - bird.flapPhase*r*.38; ctx.fillStyle='#f6b52e'; ctx.beginPath(); ctx.ellipse(-r*.2,wingY,r*.7,r*.36,-.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(r*.54,-r*.38,r*.48,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle='#263449'; ctx.beginPath(); ctx.arc(r*.66,-r*.38,r*.19,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#f0832b'; ctx.beginPath(); ctx.moveTo(r*.98,-r*.12); ctx.lineTo(r*1.9,r*.1); ctx.lineTo(r*.98,r*.38); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      }
      canvas.addEventListener('pointerdown', event => { event.preventDefault(); flap(); });
      primaryBtn.addEventListener('click', () => { if (state === 'paused') togglePause(); else startGame(); });
      menuBtn.addEventListener('click', showMenu);
      pauseBtn.addEventListener('click', togglePause);
      window.addEventListener('keydown', event => {
        if (event.code === 'Space') { event.preventDefault(); flap(); }
        if (event.key.toLowerCase() === 'p' && (state === 'playing' || state === 'paused')) { event.preventDefault(); togglePause(); }
      });
      new ResizeObserver(resize).observe(shell); loadProgress(); resetWorld(); resize();
    })();
  </script>
</body>
