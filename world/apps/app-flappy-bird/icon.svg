<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Flappy Bird</title>
  <desc id="desc">A yellow bird flying between green pipes against a blue sky</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73d5e8"/>
      <stop offset="1" stop-color="#b9f0e0"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238f55"/>
      <stop offset="0.5" stop-color="#5acb69"/>
      <stop offset="1" stop-color="#167144"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffe96a"/>
      <stop offset="1" stop-color="#efa62b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#124a63" flood-opacity=".24"/>
    </filter>
    <clipPath id="round"><rect width="256" height="256" rx="54"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <path d="M-18 57c19-16 37-16 55 0 17-13 34-13 51 0 18-16 38-16 58 0v18H-18Z" fill="#fff" opacity=".55"/>
    <path d="M132 117c14-11 28-11 42 0 13-9 26-9 39 0 13-11 29-11 45 0v14h-126Z" fill="#fff" opacity=".34"/>
    <path d="M0 211c39-10 74-11 109-2 42 11 86 10 147-5v52H0Z" fill="#d6c46c"/>
    <path d="M0 225c37-11 77-9 111 0 45 12 89 7 145-9v40H0Z" fill="#b1a24f" opacity=".7"/>

    <g filter="url(#shadow)">
      <path d="M181 0h51v70h-51z" fill="url(#pipe)"/>
      <path d="M173 61h67v29h-67z" fill="url(#pipe)"/>
      <path d="M181 186h51v70h-51z" fill="url(#pipe)"/>
      <path d="M173 168h67v29h-67z" fill="url(#pipe)"/>
      <path d="M187 0h9v70h-9zM187 186h9v70h-9z" fill="#a7f283" opacity=".35"/>
    </g>

    <g transform="translate(102 132) rotate(-10)" filter="url(#shadow)">
      <path d="M-46 9c-10-20-5-37 14-47 18-10 45-8 61 5 18 14 20 37 8 54-12 17-37 23-58 14Z" fill="url(#bird)" stroke="#b8771c" stroke-width="4"/>
      <path d="M-27 10c-16-2-27-10-31-23 13-11 29-11 43-1 8 6 10 15 6 25Z" fill="#e99e27" stroke="#b8771c" stroke-width="4"/>
      <path d="M-41-10c8 4 17 6 28 5" fill="none" stroke="#ffd952" stroke-width="4" stroke-linecap="round"/>
      <circle cx="11" cy="-19" r="12" fill="#fff" stroke="#b8771c" stroke-width="3"/>
      <circle cx="15" cy="-19" r="5" fill="#263449"/>
      <path d="M29-7 62 1 29 10c-8-3-8-14 0-17Z" fill="#f0832b" stroke="#b8771c" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-6 28c10 4 24 4 34 0" fill="none" stroke="#d88620" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="M16 244h224" stroke="#7d7138" stroke-width="5" opacity=".5"/>
  </g>
  <rect x="3" y="3" width="250" height="250" rx="51" fill="none" stroke="#16394a" stroke-opacity=".3" stroke-width="6"/>
