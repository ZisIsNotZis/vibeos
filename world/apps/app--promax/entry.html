<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>押韵大师ProMax</title>
<style>
:root{--ink:#24213b;--muted:#7e7898;--purple:#5b42d6;--deep:#302069;--pale:#f3f0ff;--line:#e8e4f4;--gold:#f3b943;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#faf9fd;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.sidebar{background:linear-gradient(175deg,#34256f,#24184e);color:#fff;padding:28px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:16px;margin:0 10px 42px}.brand img{width:38px;height:38px}.section-label{font-size:11px;color:#aaa1d6;letter-spacing:.16em;margin:0 12px 10px}.nav button{display:flex;align-items:center;width:100%;border:0;border-radius:10px;padding:12px;background:transparent;color:#c9c1ec;text-align:left;gap:12px;margin:4px 0}.nav button:hover,.nav button.active{background:#51419b;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.nav .ico{font-size:18px;width:20px;text-align:center}.side-bottom{margin-top:auto;color:#aaa1d6;font-size:12px;line-height:1.6;padding:12px}.main{max-width:1220px;width:100%;margin:auto;padding:38px 54px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.eyebrow{color:var(--purple);font-weight:800;letter-spacing:.14em;font-size:11px;margin-bottom:9px}.top h1{margin:0;font-size:33px;letter-spacing:-.03em}.top p{color:var(--muted);margin:8px 0 0;font-size:14px}.top-actions{display:flex;gap:10px}.outline{border:1px solid var(--line);background:#fff;color:var(--deep);padding:10px 14px;border-radius:9px;font-weight:700}.outline span{background:var(--pale);padding:2px 7px;border-radius:20px;margin-left:4px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 35px #3020690b}.composer{padding:30px 34px;min-height:565px}.composer-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.composer-head h2{font-size:20px;margin:0}.select{border:1px solid var(--line);border-radius:8px;color:var(--deep);background:#fff;padding:8px 10px;font-size:12px}.input-title{border:0;outline:0;width:100%;font-size:25px;font-weight:750;margin:25px 0 12px;color:var(--deep)}.input-title::placeholder{color:#c6c1d7}.editor{width:100%;min-height:290px;border:0;resize:vertical;outline:0;line-height:2;font-size:19px;color:#40395b;background:linear-gradient(transparent 39px,#eeeaf8 40px);background-size:100% 40px;padding:0 3px}.editor::placeholder{color:#b5aec9}.compose-foot{border-top:1px solid var(--line);padding-top:17px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.actions{display:flex;gap:9px}.primary{border:0;border-radius:8px;background:var(--purple);color:#fff;padding:10px 18px;font-weight:800}.primary:hover{background:#4932bc}.ghost{border:0;border-radius:8px;background:var(--pale);color:var(--deep);padding:10px 15px;font-weight:700}.panel{display:flex;flex-direction:column;gap:15px}.panel-card{padding:20px}.panel-card h2{font-size:16px;margin:0 0 15px}.rhyme-box{background:#f5f2ff;border-radius:10px;padding:14px}.rhyme-box label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.search-row{display:flex;gap:7px}.search-row input{width:100%;min-width:0;border:1px solid #ddd7f2;border-radius:7px;padding:9px 10px;outline:0}.search-row input:focus{border-color:var(--purple)}.results{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.tag{border:1px solid #ded7fa;background:#fff;color:var(--purple);border-radius:20px;padding:6px 10px;font-size:12px}.tag:hover{background:var(--purple);color:#fff}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 0 0}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;text-align:left;color:var(--muted);font-size:12px}.mode.active{border-color:#a79af0;background:var(--pale);color:var(--deep);font-weight:700}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#faf8ff;padding:11px;border-radius:8px}.stat b{font-size:21px;color:var(--deep);display:block}.stat small{font-size:11px;color:var(--muted)}.drawer{position:fixed;right:25px;top:82px;width:350px;max-height:75vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px #20144825;padding:20px;display:none;z-index:4}.drawer.open{display:block}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer h2{font-size:18px;margin:0 0 15px}.close{border:0;background:transparent;color:var(--muted);font-size:22px}.saved{border-top:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;gap:10px}.saved b{font-size:14px}.saved small{display:block;color:var(--muted);margin-top:4px}.saved button{border:0;background:transparent;color:var(--purple);font-weight:700;font-size:12px}.empty{color:var(--muted);font-size:13px}
@media(max-width:850px){.app{display:block}.sidebar{padding:16px 20px}.brand{margin:0 0 15px}.section-label,.side-bottom{display:none}.nav{display:flex;gap:5px}.nav button{width:auto;padding:9px}.nav button span:last-child{display:none}.main{padding:28px 20px}.workspace{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.panel-card:last-child{grid-column:1/-1}}@media(max-width:560px){.top h1{font-size:27px}.top-actions .outline{font-size:0}.top-actions .outline span{font-size:12px}.composer{padding:22px 18px}.panel{display:flex}.drawer{left:16px;right:16px;width:auto}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><img src="icon.svg" alt=""><span>押韵大师ProMax</span></div><p class="section-label">工作台</p><nav class="nav"><button class="active" id="desk" type="button"><span class="ico">⌁</span><span>创作台</span></button><button id="savedNav" type="button"><span class="ico">▣</span><span>我的收藏</span></button><button id="guide" type="button"><span class="ico">?</span><span>韵脚指南</span></button></nav><div class="side-bottom">让每一句话，都有回声。<br>押韵、节奏与灵感，一处完成。</div></aside><main class="main"><header class="top"><div><div class="eyebrow">创作工作台</div><h1>让灵感落在韵脚上。</h1><p>输入一句话，寻找恰到好处的声音。</p></div><div class="top-actions"><button class="outline" id="savedBtn" type="button">收藏作品 <span id="count">0</span></button></div></header><div class="workspace"><section class="card composer"><div class="composer-head"><h2>新作品</h2><select class="select" id="style" aria-label="写作风格"><option>自由诗</option><option>歌词</option><option>短句</option></select></div><input class="input-title" id="title" aria-label="作品标题" placeholder="给作品起个名字"><textarea class="editor" id="text" aria-label="作品内容" placeholder="在这里写下你的第一句……"></textarea><div class="compose-foot"><span><b id="wordCount">0</b> 字 · <b id="lineCount">0</b> 行</span><div class="actions"><button class="ghost" id="clear" type="button">清空</button><button class="primary" id="save" type="button">收藏作品</button></div></div></section><aside class="panel"><section class="card panel-card"><h2>找韵脚</h2><div class="rhyme-box"><label for="rhymeInput">输入字词，发现相近的声音</label><div class="search-row"><input id="rhymeInput" value="风" aria-label="韵脚搜索"><button class="primary" id="search" type="button">查找</button></div><div class="results" id="results"></div><p class="hint" id="rhymeHint">点击词语即可加入作品。</p></div></section><section class="card panel-card"><h2>表达方向</h2><div class="modes"><button class="mode active" type="button" data-mode="温柔">温柔</button><button class="mode" type="button" data-mode="明快">明快</button><button class="mode" type="button" data-mode="辽阔">辽阔</button><button class="mode" type="button" data-mode="克制">克制</button></div></section><section class="card panel-card"><h2>本次创作</h2><div class="stats"><div class="stat"><b id="charStat">0</b><small>字数</small></div><div class="stat"><b id="rhymeStat">0</b><small>已用韵脚</small></div></div></section></aside></div></main></div><section class="drawer" id="drawer"><div class="drawer-head"><h2>我的收藏</h2><button class="close" id="close" type="button" aria-label="关闭">×</button></div><div id="savedList"></div></section>
<script>
const $=id=>document.getElementById(id),title=$('title'),text=$('text');let saved=JSON.parse(localStorage.getItem('promax-saved')||'[]'),used=0;const rhymeSets={风:['中','空','梦','钟','红','从','冬','同'],光:['望','想','香','窗','响','浪','方向'],雨:['语','许','去','序','旅','聚','绿'],心:['深','音','寻','林','今','临','琴']};
function metrics(){let s=text.value.trim();$('wordCount').textContent=s.replace(/\s/g,'').length;$('lineCount').textContent=s?s.split(/\n/).filter(x=>x.trim()).length:0;$('charStat').textContent=s.replace(/\s/g,'').length;localStorage.setItem('promax-draft',JSON.stringify({title:title.value,text:text.value,style:$('style').value}))}function drawRhyme(){let q=$('rhymeInput').value.trim()||'风',base=q.slice(-1),items=rhymeSets[base]||['安','然','间','边','年','天','前','远'];$('results').innerHTML=items.map(x=>`<button class="tag" type="button">${x}</button>`).join('');$('rhymeHint').textContent=`“${base}”韵：共找到 ${items.length} 个相近韵脚`}
function render(){ $('count').textContent=saved.length;$('savedList').innerHTML=saved.length?saved.map((p,i)=>`<div class="saved"><div><b>${esc(p.title||'无题')}</b><small>${p.text.replace(/\s/g,'').length} 字 · ${p.style}</small></div><button type="button" data-open="${i}">打开</button></div>`).join(''):'<p class="empty">还没有收藏作品。完成一段创作后，作品会出现在这里。</p>'}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toggle(){ $('drawer').classList.toggle('open');render()}
function save(){if(!text.value.trim()){text.focus();$('rhymeHint').textContent='先写下几句，再收藏你的作品';return}let p={title:title.value.trim()||'无题',text:text.value,style:$('style').value};saved=[p,...saved.filter(x=>x.text!==p.text)].slice(0,30);localStorage.setItem('promax-saved',JSON.stringify(saved));render();$('drawer').classList.add('open')}
let draft=JSON.parse(localStorage.getItem('promax-draft')||'null');if(draft){title.value=draft.title||'';text.value=draft.text||'';$('style').value=draft.style||'自由诗'}metrics();drawRhyme();render();text.addEventListener('input',metrics);title.addEventListener('input',metrics);$('style').addEventListener('change',metrics);$('save').onclick=save;$('savedBtn').onclick=toggle;$('savedNav').onclick=toggle;$('close').onclick=()=>$('drawer').classList.remove('open');$('clear').onclick=()=>{title.value='';text.value='';metrics();text.focus()};$('search').onclick=drawRhyme;$('rhymeInput').addEventListener('keydown',e=>{if(e.key==='Enter')drawRhyme()});$('results').onclick=e=>{let b=e.target.closest('.tag');if(b){text.value+=(text.value?' ':'')+b.textContent;used++;$('rhymeStat').textContent=used;metrics();text.focus()}};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('rhymeHint').textContent=`已切换至「${b.dataset.mode}」表达方向`});$('savedList').onclick=e=>{let b=e.target.closest('[data-open]');if(b){let p=saved[+b.dataset.open];title.value=p.title==='无题'?'':p.title;text.value=p.text;$('style').value=p.style;metrics();$('drawer').classList.remove('open')}};$('guide').onclick=()=>{$('rhymeInput').focus();$('rhymeHint').textContent='韵脚并非越近越好，先听整体节奏。'};$('desk').onclick=()=>text.focus();
</script>
<script>
/* A small interaction layer keeps feedback visible without interrupting writing. */
const status=document.createElement('p');status.id='status';status.className='hint';status.setAttribute('aria-live','polite');status.style.margin='8px 0 0';document.querySelector('.compose-foot').before(status);
const announce=message=>{status.textContent=message;window.clearTimeout(announce.timer);announce.timer=window.setTimeout(()=>status.textContent='',2600)};
const originalSave=save;save=()=>{if(!text.value.trim()){announce('先写下几句，再收藏你的作品');text.focus();return}originalSave();announce('已收藏，可在右上角打开作品')};$('clear').addEventListener('click',()=>announce('已清空当前草稿'));
document.querySelectorAll('.mode').forEach(button=>button.addEventListener('click',()=>announce(`已切换至「${button.dataset.mode}」表达方向`)));
document.querySelector('.panel').addEventListener('click',event=>{if(event.target.matches('.tag'))announce(`已加入“${event.target.textContent}”韵脚`)});
</script></body></html>
