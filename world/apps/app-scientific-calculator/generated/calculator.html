<!doctype html><html><head><meta charset="utf-8"><title>Scientific Calculator</title><style>html,body{height:100%;margin:0;background:#151722;color:#eee;font:14px system-ui}body{display:grid;place-items:center}.calc{width:min(470px,92vw);padding:22px;border-radius:18px;background:#222638;box-shadow:0 16px 45px #0007}.display{height:58px;margin-bottom:14px;padding:0 16px;display:flex;align-items:center;justify-content:flex-end;border-radius:10px;background:#0f121b;color:#eaf2ff;font:27px ui-monospace;overflow:hidden}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.keys button{height:42px;border:0;border-radius:8px;background:#343b53;color:#e8ebf4;font:14px system-ui;cursor:pointer}.keys button:hover{background:#4c5678}.keys .op{background:#765fd2}.keys .eq{background:#2baf92}</style></head><body><main class="calc"><div id="display" class="display">0</div><div id="keys" class="keys"></div></main><script>const d=document.querySelector('#display'),k=document.querySelector('#keys');let expr='',ans=0;const keys=['sin','cos','tan','√','log','(',')','π','e','AC','7','8','9','÷','⌫','4','5','6','×','^','1','2','3','−','%','0','.','+/-','Ans','='];function draw(){d.textContent=expr||'0'}function press(v){if(v==='AC'){expr='';draw();return}if(v==='⌫'){expr=expr.slice(0,-1);draw();return}if(v==='='){try{let e=expr.replaceAll('π',`(${Math.PI})`).replaceAll('e',`(${Math.E})`).replaceAll('÷','/').replaceAll('×','*').replaceAll('−','-').replaceAll('^','**').replaceAll('√','Math.sqrt').replaceAll('sin','Math.sin').replaceAll('cos','Math.cos').replaceAll('tan','Math.tan').replaceAll('log','Math.log10').replaceAll('Ans',String(ans));ans=Function('return '+e)();expr=String(Number.isFinite(ans)?Number(ans.toFixed(10)):ans)}catch{expr='Error'}draw();return}if(v===' +/-'){expr=expr.startsWith('-')?expr.slice(1):'-'+expr;return draw()}if(v==='Ans')expr+=String(ans);else expr+=v;draw()}keys.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>press(v);if('=÷×−+^%'.includes(v))b.className='op';if(v==='=')b.className='eq';k.append(b)});draw()</script></body></html>
