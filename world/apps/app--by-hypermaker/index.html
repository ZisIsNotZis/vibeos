<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperMaker</title>
  <style>
    :root {
      --surface: var(--vibe-surface, #191923);
      --surface-raised: var(--vibe-raised, #242431);
      --surface-variant: color-mix(in srgb, var(--surface-raised) 72%, var(--surface));
      --on-surface: var(--vibe-text, #f1f1f6);
      --on-surface-variant: var(--vibe-muted, #aeb0c2);
      --outline: var(--vibe-border, #ffffff22);
      --control: var(--vibe-control, #303044);
      --primary: var(--vibe-accent, #a89dfc);
      --on-primary: #161522;
      --focus: color-mix(in srgb, var(--primary) 72%, transparent);
      --error: #e47780;
      --brand-mint: #9af3de;
      --brand-violet: #8c7bff;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow: 0 18px 50px color-mix(in srgb, var(--surface) 72%, transparent);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--surface);
      color: var(--on-surface);
      font-family: var(--vibe-font-ui, Inter, ui-sans-serif, system-ui, sans-serif);
      font-size: var(--vibe-text-body, 14px);
      line-height: var(--vibe-line-normal, 1.5);
      overflow: hidden;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .app { display: flex; height: 100%; min-width: 0; }
    .sidebar { width: 218px; flex: 0 0 218px; border-right: 1px solid var(--outline); padding: 22px 14px; display: flex; flex-direction: column; min-height: 0; background: color-mix(in srgb, var(--surface) 84%, var(--surface-raised)); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 9px 25px; }
    .brand-mark { width: 30px; height: 30px; border-radius: 9px; box-shadow: 0 5px 18px color-mix(in srgb, var(--brand-violet) 24%, transparent); }
    .brand-name { font-weight: 760; letter-spacing: -.03em; font-size: 15px; }
    .brand-beta { color: var(--on-surface-variant); font-family: var(--vibe-font-mono); font-size: 9px; letter-spacing: .1em; margin-left: 3px; }
    .nav-label { color: var(--on-surface-variant); font-size: var(--vibe-text-caption); letter-spacing: .11em; text-transform: uppercase; padding: 0 11px 8px; }
    .nav { display: grid; gap: 3px; }
    .nav-btn { border: 0; background: transparent; color: var(--on-surface-variant); text-align: left; display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 9px; font-size: var(--vibe-text-label); transition: background .18s, color .18s; }
    .nav-btn:hover { background: var(--surface-raised); color: var(--on-surface); }
    .nav-btn.active { background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--on-surface); }
    .nav-btn.active .icon { color: var(--primary); }
    .icon { width: 16px; height: 16px; flex: 0 0 16px; color: currentColor; }
    .sidebar-footer { margin-top: auto; border-top: 1px solid var(--outline); padding: 16px 8px 0; }
    .profile { display: flex; align-items: center; gap: 9px; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--brand-mint), var(--brand-violet)); color: var(--on-primary); font-size: 11px; font-weight: 800; }
    .profile-name { font-size: var(--vibe-text-label); font-weight: 650; }
    .profile-meta { display: block; color: var(--on-surface-variant); font-size: var(--vibe-text-caption); }
    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 72px; border-bottom: 1px solid var(--outline); padding: 0 34px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex: 0 0 72px; }
    .crumb { color: var(--on-surface-variant); font-size: var(--vibe-text-label); }
    .crumb strong { color: var(--on-surface); font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .search { position: relative; width: min(220px, 25vw); }
    .search .icon { position: absolute; left: 11px; top: 10px; color: var(--on-surface-variant); width: 15px; }
    .search input { width: 100%; height: 36px; border-radius: 8px; border: 1px solid var(--outline); background: var(--control); color: var(--on-surface); padding: 0 11px 0 34px; font-size: var(--vibe-text-label); }
    .btn { border: 1px solid var(--outline); background: var(--control); color: var(--on-surface); border-radius: 8px; min-height: 36px; padding: 0 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: var(--vibe-text-label); font-weight: 650; transition: transform .16s, background .16s, border-color .16s; }
    .btn:hover { background: var(--surface-raised); border-color: color-mix(in srgb, var(--primary) 45%, var(--outline)); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { border-color: transparent; background: var(--primary); color: var(--on-primary); box-shadow: 0 8px 22px color-mix(in srgb, var(--primary) 22%, transparent); }
    .btn.primary:hover { background: color-mix(in srgb, var(--primary) 84%, var(--on-surface)); }
    .icon-btn { width: 36px; padding: 0; }
    .content { overflow: auto; min-height: 0; padding: 34px; }
    .content::-webkit-scrollbar { width: 10px; height: 10px; }
    .content::-webkit-scrollbar-thumb { background: var(--control); border: 3px solid var(--surface); border-radius: 10px; }
    .eyebrow { color: var(--primary); font-family: var(--vibe-font-mono); text-transform: uppercase; letter-spacing: .14em; font-size: var(--vibe-text-caption); font-weight: 700; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(25px, 3vw, var(--vibe-text-display)); line-height: var(--vibe-line-tight); letter-spacing: -.045em; }
    h2 { font-size: var(--vibe-text-title); line-height: var(--vibe-line-tight); letter-spacing: -.025em; }
    h3 { font-size: var(--vibe-text-body); }
    .hero { margin-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr) 276px; gap: 18px; }
    .hero-card { position: relative; min-height: 224px; border: 1px solid var(--outline); border-radius: var(--radius-lg); padding: 28px; overflow: hidden; background: linear-gradient(120deg, color-mix(in srgb, var(--surface-raised) 94%, var(--brand-violet)), var(--surface-raised)); }
    .hero-card::after { content: ""; position: absolute; right: -72px; top: -88px; width: 250px; height: 250px; border: 1px solid color-mix(in srgb, var(--brand-mint) 38%, transparent); border-radius: 50%; box-shadow: 0 0 0 22px color-mix(in srgb, var(--brand-violet) 6%, transparent), 0 0 0 47px color-mix(in srgb, var(--brand-violet) 5%, transparent); }
    .hero-card h2 { margin-top: 10px; font-size: clamp(21px, 2.3vw, 30px); max-width: 390px; }
    .hero-card p { max-width: 420px; color: var(--on-surface-variant); margin-top: 10px; font-size: var(--vibe-text-label); }
    .hero-actions { display: flex; gap: 9px; margin-top: 22px; flex-wrap: wrap; }
    .hero-art { border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface-raised); overflow: hidden; position: relative; min-height: 224px; }
    .hero-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .art-label { position: absolute; bottom: 14px; left: 16px; font-family: var(--vibe-font-mono); font-size: 10px; color: var(--on-surface-variant); letter-spacing: .08em; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin: 30px 0 13px; }
    .section-head p { color: var(--on-surface-variant); font-size: var(--vibe-text-label); }
    .link-btn { color: var(--primary); background: transparent; border: 0; padding: 4px 0; font-size: var(--vibe-text-label); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .stat { border: 1px solid var(--outline); background: var(--surface-raised); border-radius: var(--radius-md); padding: 15px 16px; min-width: 0; }
    .stat-top { display: flex; justify-content: space-between; color: var(--on-surface-variant); font-size: var(--vibe-text-caption); }
    .stat-value { font-family: var(--vibe-font-mono); font-size: 24px; margin-top: 5px; letter-spacing: -.06em; }
    .stat-change { color: var(--brand-mint); font-size: var(--vibe-text-caption); }
    .project-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .project-card { border: 1px solid var(--outline); background: var(--surface-raised); border-radius: var(--radius-md); overflow: hidden; min-width: 0; transition: border-color .18s, transform .18s; }
    .project-card:hover { border-color: color-mix(in srgb, var(--primary) 50%, var(--outline)); transform: translateY(-2px); }
    .project-thumb { height: 108px; position: relative; overflow: hidden; padding: 14px; display: flex; align-items: flex-end; }
    .project-thumb::before, .project-thumb::after { content: ""; position: absolute; border-radius: 50%; filter: blur(2px); }
    .project-thumb::before { width: 145px; height: 145px; right: -28px; top: -55px; background: color-mix(in srgb, var(--brand-mint) 68%, transparent); }
    .project-thumb::after { width: 110px; height: 110px; left: -28px; bottom: -57px; background: color-mix(in srgb, var(--brand-violet) 72%, transparent); }
    .thumb-grid { position: absolute; inset: 0; opacity: .32; background-image: linear-gradient(var(--on-surface) 1px, transparent 1px), linear-gradient(90deg, var(--on-surface) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(135deg, transparent 10%, #000 80%); }
    .thumb-word { position: relative; z-index: 1; font-size: 19px; line-height: 1; letter-spacing: -.06em; font-weight: 780; color: var(--on-primary); text-shadow: 0 2px 12px color-mix(in srgb, var(--surface) 38%, transparent); }
    .thumb-two { background: linear-gradient(130deg, color-mix(in srgb, var(--brand-violet) 62%, var(--surface)), color-mix(in srgb, var(--primary) 25%, var(--surface))); }
    .thumb-two::before { background: color-mix(in srgb, #f7b45c 70%, transparent); width: 180px; height: 180px; right: -40px; top: -90px; }
    .thumb-three { background: linear-gradient(130deg, color-mix(in srgb, #e47780 60%, var(--surface)), color-mix(in srgb, #f7b45c 34%, var(--surface))); }
    .thumb-three::after { background: color-mix(in srgb, #f7b45c 75%, transparent); }
    .project-info { padding: 13px 14px 14px; }
    .project-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .project-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--vibe-text-label); font-weight: 700; }
    .project-status { font-size: 10px; border: 1px solid color-mix(in srgb, var(--brand-mint) 34%, var(--outline)); color: var(--brand-mint); border-radius: 20px; padding: 2px 7px; white-space: nowrap; }
    .project-meta { color: var(--on-surface-variant); font-size: var(--vibe-text-caption); margin-top: 5px; }
    .project-open { border-top: 1px solid var(--outline); width: 100%; display: flex; justify-content: space-between; color: var(--on-surface-variant); background: transparent; border-left: 0; border-right: 0; border-bottom: 0; padding: 10px 14px; font-size: var(--vibe-text-caption); }
    .project-open:hover { color: var(--primary); }
    .activity { border: 1px solid var(--outline); border-radius: var(--radius-md); background: var(--surface-raised); padding: 3px 16px; }
    .activity-item { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--outline); font-size: var(--vibe-text-label); }
    .activity-item:last-child { border-bottom: 0; }
    .activity-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); flex: 0 0 7px; }
    .activity-text { min-width: 0; flex: 1; }
    .activity-text span { color: var(--on-surface-variant); }
    .activity-time { color: var(--on-surface-variant); font-size: var(--vibe-text-caption); white-space: nowrap; }
    .page-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 15px; }
    .page-title-row p { color: var(--on-surface-variant); margin-top: 8px; }
    .toolbar { display: flex; gap: 9px; align-items: center; margin: 25px 0 15px; }
    .select { border: 1px solid var(--outline); background: var(--control); color: var(--on-surface); border-radius: 8px; padding: 8px 10px; font-size: var(--vibe-text-label); }
    .all-projects { display: grid; gap: 10px; }
    .project-row { border: 1px solid var(--outline); background: var(--surface-raised); border-radius: var(--radius-md); padding: 13px; display: flex; align-items: center; gap: 14px; }
    .row-thumb { width: 74px; height: 50px; border-radius: 8px; flex: 0 0 74px; background: linear-gradient(130deg, var(--brand-violet), var(--brand-mint)); }
    .project-row-main { min-width: 0; flex: 1; }
    .project-row-main strong { font-size: var(--vibe-text-label); }
    .project-row-main span { display: block; color: var(--on-surface-variant); font-size: var(--vibe-text-caption); }
    .empty { text-align: center; padding: 45px 20px; border: 1px dashed var(--outline); border-radius: var(--radius-md); color: var(--on-surface-variant); }
    .empty strong { color: var(--on-surface); display: block; margin-bottom: 4px; }
    .editor { max-width: 1180px; margin: 0 auto; }
    .editor-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .back-btn { border: 0; background: transparent; color: var(--on-surface-variant); padding: 5px; display: grid; place-items: center; }
    .editor-title { min-width: 0; flex: 1; }
    .editor-title input { width: 100%; background: transparent; color: var(--on-surface); border: 0; border-bottom: 1px solid transparent; font-size: var(--vibe-text-title); font-weight: 730; padding: 2px 0; }
    .editor-title input:hover, .editor-title input:focus { border-bottom-color: var(--outline); outline: 0; }
    .editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) 255px; gap: 16px; }
    .stage-panel, .inspector { border: 1px solid var(--outline); border-radius: var(--radius-lg); background: var(--surface-raised); }
    .stage-panel { padding: 14px; min-width: 0; }
    .stage { aspect-ratio: 16 / 9; max-height: 430px; margin: auto; position: relative; overflow: hidden; border-radius: 10px; background: radial-gradient(circle at 75% 18%, color-mix(in srgb, var(--brand-mint) 28%, transparent), transparent 34%), linear-gradient(135deg, color-mix(in srgb, var(--brand-violet) 60%, var(--surface)), var(--surface)); display: flex; flex-direction: column; justify-content: flex-end; padding: 8%; }
    .stage::before { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, color-mix(in srgb, var(--on-surface) 12%, transparent) 30.2%, transparent 30.7%), linear-gradient(155deg, transparent 56%, color-mix(in srgb, var(--on-surface) 10%, transparent) 56.2%, transparent 56.8%); }
    .stage-copy { position: relative; z-index: 1; max-width: 75%; }
    .stage-kicker { color: var(--brand-mint); font-family: var(--vibe-font-mono); font-size: clamp(8px, 1vw, 11px); letter-spacing: .18em; text-transform: uppercase; }
    .stage h2 { font-size: clamp(23px, 4vw, 50px); letter-spacing: -.07em; margin-top: 7px; line-height: .95; }
    .stage p { color: color-mix(in srgb, var(--on-surface) 75%, transparent); font-size: clamp(9px, 1.2vw, 14px); margin-top: 10px; }
    .stage.playing .stage-copy { animation: stage-in 1.5s ease-in-out infinite alternate; }
    @keyframes stage-in { from { transform: translateY(4px); opacity: .78; } to { transform: translateY(-3px); opacity: 1; } }
    .stage-tools { display: flex; justify-content: space-between; align-items: center; padding-top: 13px; color: var(--on-surface-variant); font-size: var(--vibe-text-caption); }
    .tool-group { display: flex; gap: 7px; }
    .timeline { margin-top: 15px; display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; }
    .scene { min-width: 105px; height: 48px; border: 1px solid var(--outline); border-radius: 7px; background: var(--control); color: var(--on-surface-variant); text-align: left; padding: 6px 8px; font-size: 10px; }
    .scene.active { border-color: var(--primary); color: var(--on-surface); background: color-mix(in srgb, var(--primary) 13%, var(--control)); }
    .scene small { display: block; color: var(--on-surface-variant); margin-top: 2px; font-family: var(--vibe-font-mono); }
    .inspector { padding: 18px; }
    .inspector h3 { margin-bottom: 17px; }
    .field { display: grid; gap: 6px; margin-top: 14px; }
    .field label { color: var(--on-surface-variant); font-size: var(--vibe-text-caption); }
    .field input { width: 100%; border: 1px solid var(--outline); background: var(--control); color: var(--on-surface); border-radius: 7px; padding: 8px 9px; font-size: var(--vibe-text-label); }
    .inspector-note { border-top: 1px solid var(--outline); margin-top: 20px; padding-top: 14px; color: var(--on-surface-variant); font-size: var(--vibe-text-caption); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    [hidden] { display: none !important; }
    @media (max-width: 850px) {
      .sidebar { width: 62px; flex-basis: 62px; padding: 18px 8px; }
      .brand { padding: 0 8px 24px; }.brand-name, .brand-beta, .nav-label, .nav-btn span, .profile-name, .profile-meta { display: none; }
      .nav-btn { justify-content: center; padding: 11px; }.sidebar-footer { padding: 15px 0 0; }.profile { justify-content: center; }
      .topbar { padding: 0 20px; }.content { padding: 25px 20px; }
      .hero { grid-template-columns: 1fr; }.hero-art { min-height: 105px; }.hero-art svg { height: 180px; top: -38px; }.project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .editor-layout { grid-template-columns: 1fr; }.inspector { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }.inspector h3, .inspector-note { grid-column: 1 / -1; }.field { margin-top: 0; margin-bottom: 13px; }
    }
    @media (max-width: 560px) {
      .topbar { height: 62px; flex-basis: 62px; padding: 0 14px; }.crumb { display: none; }.top-actions { width: 100%; }.search { width: auto; flex: 1; }.content { padding: 20px 14px; }.stats { gap: 7px; }.stat { padding: 11px; }.stat-value { font-size: 19px; }.project-grid { grid-template-columns: 1fr; }.hero-card { padding: 21px; }.hero-art { display: none; }.page-title-row { align-items: flex-start; flex-direction: column; }.toolbar { align-items: stretch; flex-direction: column; }.select { width: 100%; }.editor-head { flex-wrap: wrap; }.editor-head .btn { margin-left: auto; }.inspector { display: block; }.inspector h3 { margin-bottom: 10px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="icon.svg" alt=""><span class="brand-name">HyperMaker <span class="brand-beta">STUDIO</span></span></div>
      <div class="nav-label">Workspace</div>
      <nav class="nav" aria-label="Workspace">
        <button class="nav-btn active" data-page="overview"><svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg><span>Overview</span></button>
        <button class="nav-btn" data-page="projects"><svg class="icon" aria-hidden="true"><use href="#i-stack"></use></svg><span>Projects</span></button>
        <button class="nav-btn" data-page="assets"><svg class="icon" aria-hidden="true"><use href="#i-image"></use></svg><span>Assets</span></button>
        <button class="nav-btn" data-page="team"><svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg><span>Team</span></button>
      </nav>
      <div class="sidebar-footer"><div class="profile"><div class="avatar">AK</div><div><span class="profile-name">Ari Kim</span><span class="profile-meta">Creator plan</span></div></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">Workspace <span aria-hidden="true">/</span> <strong id="crumb-label">Overview</strong></div><div class="top-actions"><label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg><span class="sr-only">Search projects</span><input id="search" type="search" aria-label="Search projects" autocomplete="off"></label><button class="btn primary" id="new-top"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>New composition</button></div></header>
      <section class="content" id="content"></section>
    </main>
  </div>
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="4" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="14" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-stack" viewBox="0 0 24 24"><path d="m4 8 8-4 8 4-8 4-8-4Z M4 12l8 4 8-4 M4 16l8 4 8-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="9" r="1.5" fill="currentColor"/><path d="m5 17 4.5-4 3 2.5 2-2 4.5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.6-3 2.4-4.5 5.5-4.5s4.9 1.5 5.5 4.5M15.5 5.5a3 3 0 0 1 0 5.8M16 14.7c2.5.2 3.9 1.6 4.5 4.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.4 4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 6 9 6-9 6V6Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 6v12M16 6v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5V4Z M8 4v6h8V4 M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  </svg>
  <script>
    (() => {
      const bridge = window.vibeOS;
      const key = 'hypermaker.workspace.v1';
      const defaults = {
        page: 'overview',
        query: '',
        sort: 'Recently edited',
        projectId: null,
        playing: false,
        projects: [
          { id: 'orbit', title: 'Orbit / Product reveal', kind: 'Launch film', edited: 'Today, 10:42', status: 'In progress', scenes: 6, headline: 'Move at the speed of ideas', body: 'A launch story in motion.' },
          { id: 'signals', title: 'Signals / Brand system', kind: 'Identity study', edited: 'Yesterday', status: 'In progress', scenes: 4, headline: 'Find your signal', body: 'Shape the space between moments.' },
          { id: 'field-notes', title: 'Field notes — Kyoto', kind: 'Editorial cut', edited: 'Aug 18', status: 'Ready to share', scenes: 8, headline: 'A slower point of view', body: 'Notes from the edge of the city.' }
        ]
      };
      let state = structuredClone(defaults);
      const app = document.getElementById('app'), content = document.getElementById('content'), search = document.getElementById('search');
      const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const icon = (name) => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
      const notify = (message, level = 'success') => bridge?.notify?.(message, { level, timeoutMs: 2200 });
      const save = async () => { try { await bridge?.storage?.write(key, state); } catch (_) {} };
      const read = async () => { try { const stored = await bridge?.storage?.read(key); if (stored && typeof stored === 'object') state = {...state, ...stored, projects: Array.isArray(stored.projects) ? stored.projects : state.projects}; } catch (_) {} };
      const current = () => state.projects.find(p => p.id === state.projectId);
      const visibleProjects = () => state.projects.filter(p => `${p.title} ${p.kind}`.toLowerCase().includes(state.query.toLowerCase()));
      function projectCard(p, index) {
        return `<article class="project-card"><div class="project-thumb ${index === 1 ? 'thumb-two' : index === 2 ? 'thumb-three' : ''}"><div class="thumb-grid"></div><div class="thumb-word">${esc(p.title.split(' / ')[0].split(' — ')[0])}</div></div><div class="project-info"><div class="project-title-row"><div class="project-title" title="${esc(p.title)}">${esc(p.title)}</div><span class="project-status">${esc(p.status === 'Ready to share' ? 'Ready' : 'Active')}</span></div><div class="project-meta">${esc(p.kind)} · ${p.scenes} scenes · ${esc(p.edited)}</div></div><button class="project-open" data-open="${esc(p.id)}">Open composition ${icon('arrow')}</button></article>`;
      }
      function overview() {
        const recent = visibleProjects().slice(0, 3);
        return `<div class="eyebrow">Creative workspace</div><div class="hero"><div class="hero-card"><h1>Make the next frame matter.</h1><p>Build sharp, expressive compositions from first idea to final cut — all in one focused canvas.</p><div class="hero-actions"><button class="btn primary" data-action="new">${icon('plus')}Create from scratch</button><button class="btn" data-page="projects">Browse projects ${icon('arrow')}</button></div></div><div class="hero-art" aria-label="Abstract composition preview"><svg viewBox="0 0 276 224" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="artg" x1="0" x2="1"><stop stop-color="var(--brand-violet)"/><stop offset="1" stop-color="var(--brand-mint)"/></linearGradient></defs><circle cx="180" cy="79" r="72" fill="none" stroke="url(#artg)" stroke-width="18" opacity=".75"/><circle cx="180" cy="79" r="39" fill="var(--surface-raised)" stroke="var(--brand-mint)" stroke-width="2"/><path d="M0 182h276M0 196h182" stroke="var(--outline)"/><path d="M22 36h66M22 48h40" stroke="var(--on-surface)" stroke-width="3" stroke-linecap="round" opacity=".45"/><path d="M21 167h116" stroke="var(--on-surface)" stroke-width="2" stroke-linecap="round" opacity=".38"/></svg><div class="art-label">FRAME 01 / 06</div></div></div><div class="stats"><div class="stat"><div class="stat-top"><span>Compositions</span><span class="stat-change">+2 this week</span></div><div class="stat-value">${state.projects.length.toString().padStart(2, '0')}</div></div><div class="stat"><div class="stat-top"><span>Scenes arranged</span><span class="stat-change">+18%</span></div><div class="stat-value">${state.projects.reduce((n,p) => n + p.scenes, 0).toString().padStart(2, '0')}</div></div><div class="stat"><div class="stat-top"><span>Share-ready</span><span class="stat-change">On track</span></div><div class="stat-value">${state.projects.filter(p => p.status === 'Ready to share').length.toString().padStart(2, '0')}</div></div></div><div class="section-head"><div><h2>Recent compositions</h2><p>Your latest work, ready when you are.</p></div><button class="link-btn" data-page="projects">View all ${icon('arrow')}</button></div><div class="project-grid">${recent.length ? recent.map(projectCard).join('') : `<div class="empty" style="grid-column:1/-1"><strong>No matches found</strong>Try a different project name.</div>`}</div><div class="section-head"><div><h2>Activity</h2></div></div><div class="activity"><div class="activity-item"><div class="activity-dot"></div><div class="activity-text"><strong>Orbit / Product reveal</strong> <span>was updated</span></div><div class="activity-time">12 min ago</div></div><div class="activity-item"><div class="activity-dot" style="background:var(--brand-mint)"></div><div class="activity-text"><strong>Field notes — Kyoto</strong> <span>is ready to share</span></div><div class="activity-time">2 days ago</div></div></div>`;
      }
      function projectsPage() {
        const list = visibleProjects();
        const sorted = [...list].sort((a,b) => state.sort === 'Title A–Z' ? a.title.localeCompare(b.title) : state.sort === 'Scene count' ? b.scenes - a.scenes : state.projects.indexOf(a) - state.projects.indexOf(b));
        return `<div class="page-title-row"><div><div class="eyebrow">Library</div><h1 style="margin-top:8px">Projects</h1><p>${state.projects.length} compositions in your workspace.</p></div><button class="btn primary" data-action="new">${icon('plus')}New composition</button></div><div class="toolbar"><label class="search" style="width:min(280px,100%)"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg><span class="sr-only">Filter projects</span><input id="project-filter" type="search" value="${esc(state.query)}" aria-label="Filter projects" autocomplete="off"></label><select class="select" id="sort" aria-label="Sort projects"><option ${state.sort === 'Recently edited' ? 'selected' : ''}>Recently edited</option><option ${state.sort === 'Title A–Z' ? 'selected' : ''}>Title A–Z</option><option ${state.sort === 'Scene count' ? 'selected' : ''}>Scene count</option></select></div><div class="all-projects">${sorted.length ? sorted.map((p,i) => `<div class="project-row"><div class="row-thumb" style="filter:hue-rotate(${i * 42}deg)"></div><div class="project-row-main"><strong>${esc(p.title)}</strong><span>${esc(p.kind)} · ${p.scenes} scenes · edited ${esc(p.edited.toLowerCase())}</span></div><span class="project-status">${esc(p.status)}</span><button class="btn" data-open="${esc(p.id)}">Open ${icon('arrow')}</button></div>`).join('') : `<div class="empty"><strong>No projects match “${esc(state.query)}”</strong>Clear the filter to see everything.</div>`}</div>`;
      }
      function simplePage(kind) {
        const data = kind === 'assets' ? {eyebrow:'Library', title:'Assets', body:'Keep the visual building blocks for every composition close at hand.', action:'Add an asset'} : {eyebrow:'Workspace', title:'Team', body:'Your shared creative space is ready for focused collaboration.', action:'Invite a collaborator'};
        return `<div class="page-title-row"><div><div class="eyebrow">${data.eyebrow}</div><h1 style="margin-top:8px">${data.title}</h1><p>${data.body}</p></div><button class="btn primary" data-action="${kind === 'assets' ? 'asset' : 'invite'}">${icon('plus')}${data.action}</button></div><div class="empty" style="margin-top:28px"><strong>${kind === 'assets' ? 'Your asset shelf is clear.' : 'A calm room for good work.'}</strong><span>${kind === 'assets' ? 'Add a file to make it available across your compositions.' : 'Invite someone to start shaping the next frame together.'}</span></div>`;
      }
      function editor() {
        const p = current(); if (!p) { state.page = 'overview'; return overview(); }
        const scenes = Array.from({length:p.scenes}, (_,i) => `<button class="scene ${i === 0 ? 'active' : ''}" data-scene="${i}">SCENE ${String(i+1).padStart(2,'0')}<small>${i === 0 ? 'Opening frame' : i === p.scenes - 1 ? 'Final card' : 'Transition'}</small></button>`).join('');
        return `<div class="editor"><div class="editor-head"><button class="back-btn" data-action="back" aria-label="Back to projects">${icon('back')}</button><div class="editor-title"><div class="eyebrow">Composition / ${p.scenes} scenes</div><label class="sr-only" for="editor-title-input">Composition title</label><input id="editor-title-input" value="${esc(p.title)}"></div><button class="btn" data-action="save">${icon('save')}Save</button><button class="btn primary" data-action="play">${icon(state.playing ? 'pause' : 'play')}${state.playing ? 'Pause' : 'Preview'}</button></div><div class="editor-layout"><section class="stage-panel"><div class="stage ${state.playing ? 'playing' : ''}"><div class="stage-copy"><div class="stage-kicker">${esc(p.kind)}</div><h2 id="stage-headline">${esc(p.headline)}</h2><p id="stage-body">${esc(p.body)}</p></div></div><div class="stage-tools"><span>16:9 · 00:06</span><div class="tool-group"><button class="btn icon-btn" data-action="add-scene" aria-label="Add scene">${icon('plus')}</button><button class="btn" data-action="duplicate">Duplicate scene</button></div></div><div class="timeline">${scenes}</div></section><aside class="inspector"><h3>Frame properties</h3><div class="field"><label for="headline-input">Headline</label><input id="headline-input" value="${esc(p.headline)}"></div><div class="field"><label for="body-input">Supporting line</label><input id="body-input" value="${esc(p.body)}"></div><div class="inspector-note">Changes are saved to this composition when you press Save.</div></aside></div></div>`;
      }
      function render() {
        app.hidden = false; search.value = state.query; document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === state.page));
        document.getElementById('crumb-label').textContent = state.page === 'editor' ? 'Editor' : state.page[0].toUpperCase() + state.page.slice(1);
        content.innerHTML = state.page === 'overview' ? overview() : state.page === 'projects' ? projectsPage() : state.page === 'editor' ? editor() : simplePage(state.page);
      }
      async function create() { const id = `composition-${Date.now()}`; state.projects.unshift({id,title:'Untitled composition',kind:'New composition',edited:'Just now',status:'In progress',scenes:1,headline:'A clear point of view',body:'Start with one strong frame.'}); state.projectId = id; state.page = 'editor'; state.playing = false; await save(); render(); document.getElementById('editor-title-input')?.select(); notify('New composition created.'); }
      async function updateProject(field, value) { const p = current(); if (!p) return; p[field] = value; p.edited = 'Just now'; await save(); const target = document.getElementById(field === 'headline' ? 'stage-headline' : 'stage-body'); if (target) target.textContent = value || (field === 'headline' ? 'A clear point of view' : 'Start with one strong frame.'); }
      content.addEventListener('click', async (event) => { const page = event.target.closest('[data-page]')?.dataset.page; if (page) { state.page = page; state.playing = false; await save(); render(); return; } const open = event.target.closest('[data-open]')?.dataset.open; if (open) { state.projectId = open; state.page = 'editor'; state.playing = false; await save(); render(); return; } const action = event.target.closest('[data-action]')?.dataset.action; if (!action) return; if (action === 'new') return create(); if (action === 'back') { state.page = 'projects'; state.playing = false; await save(); render(); return; } if (action === 'play') { state.playing = !state.playing; render(); return; } if (action === 'save') { await save(); notify('Composition saved.'); return; } if (action === 'add-scene') { const p = current(); if (p) { p.scenes += 1; await save(); render(); notify('Scene added.'); } return; } if (action === 'duplicate') { const p = current(); if (p) { p.scenes += 1; await save(); render(); notify('Scene duplicated.'); } return; } if (action === 'asset') return notify('Choose a local file to add to your shelf.', 'info'); if (action === 'invite') return notify('Invite link is available from your workspace administrator.', 'info'); });
      content.addEventListener('input', async (event) => { const el = event.target; if (el.id === 'editor-title-input') { const p = current(); if (p) { p.title = el.value; await save(); } } if (el.id === 'headline-input') updateProject('headline', el.value); if (el.id === 'body-input') updateProject('body', el.value); if (el.id === 'project-filter') { state.query = el.value; search.value = state.query; render(); document.getElementById('project-filter')?.focus(); } });
      content.addEventListener('change', async (event) => { if (event.target.id === 'sort') { state.sort = event.target.value; await save(); render(); } });
      search.addEventListener('input', () => { state.query = search.value; if (state.page !== 'editor') render(); });
      document.getElementById('new-top').addEventListener('click', create);
      document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', async () => { state.page = btn.dataset.page; state.playing = false; await save(); render(); }));
      (async () => { await read(); render(); })();
    })();
  </script>
</body>
</html>
