<style>

<script>
const W=10,H=20,types=['I','O','T','S','Z','J','L'],shapes={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]},colors={I:'#45d9ed',O:'#f5ca55',T:'#a58cff',S:'#69d89a',Z:'#f07891',J:'#69a8ef',L:'#f4a064'};
let board,current,next,x,y,rotation,score=0,lines=0,level=1,running=false,paused=false,last=0,raf=0;const $=id=>document.getElementById(id),empty=()=>Array.from({length:H},()=>Array(W).fill(''));
function rotated(shape,t){let q=shape.map(row=>row.slice());for(let k=0;k<t;k++)q=q[0].map((_,i)=>q.map(row=>row[i]).reverse());return q}function matrix(){return rotated(shapes[current],rotation)}
function collides(nx=x,ny=y,nr=rotation){const q=rotated(shapes[current],nr);return q.some((row,j)=>row.some((v,i)=>v&&(nx+i<0||nx+i>=W||ny+j>=H||(ny+j>=0&&board[ny+j][nx+i]))))}
function spawn(){current=next||types[Math.random()*7|0];next=types[Math.random()*7|0];x=3;y=0;rotation=0;if(collides()){running=false;paused=false;$('status').innerHTML='<strong>Game over.</strong> Start a new round when ready.';saveBest()}}
function draw(){const frag=document.createDocumentFragment();for(let j=0;j<H;j++)for(let i=0;i<W;i++){const cell=document.createElement('i');cell.className='cell';if(board[j][i]){cell.classList.add('filled');cell.style.setProperty('--piece',colors[board[j][i]])}frag.append(cell)}$('board').replaceChildren(frag);matrix().forEach((row,j)=>row.forEach((v,i)=>{if(v&&y+j>=0){const cell=$('board').children[(y+j)*W+x+i];if(cell){cell.classList.add('filled');cell.style.setProperty('--piece',colors[current])}}}));$('score').textContent=score.toLocaleString();$('lines').textContent=lines;$('level').textContent=level;$('best').textContent=best().toLocaleString()}
function saveBest(){const old=best();if(score>old)localStorage.setItem('tetris-best-1787138855446',score)}function best(){return Number(localStorage.getItem('tetris-best-1787138855446')||0)}function lock(){matrix().forEach((row,j)=>row.forEach((v,i)=>{if(v&&y+j>=0)board[y+j][x+i]=current}));let cleared=0;board=board.filter(row=>row.some(v=>!v)||(cleared++,false));while(board.length<H)board.unshift(Array(W).fill(''));if(cleared){lines+=cleared;score+=[0,100,300,500,800][cleared]*level;level=1+Math.floor(lines/10);saveBest()}else score+=10;spawn()}
function step(){if(!running||paused)return;if(!collides(x,y+1))y++;else lock();draw()}function action(a){if(a==='pause'){if(running){paused=!paused;$('status').textContent=paused?'Paused':'Playing'}return}if(!running||paused)return;if(a==='left'&&!collides(x-1))x--;if(a==='right'&&!collides(x+1))x++;if(a==='rotate'&&!collides(x,y,(rotation+1)%4))rotation=(rotation+1)%4;if(a==='soft'){if(!collides(x,y+1)){y++;score++}else lock()}if(a==='hard'){while(!collides(x,y+1))y++;score+=Math.max(0,(y));lock()}draw()}
function reset(start=false){board=empty();score=0;lines=0;level=1;paused=false;next='';spawn();running=start;$('status').textContent=start?'Playing':'Ready to play';draw()}function loop(t){if(running&&!paused&&t-last>Math.max(120,760-(level-1)*55)){step();last=t}raf=requestAnimationFrame(loop)}
$('start').onclick=()=>{if(!running){reset(true);$('status').textContent='Playing'}};$('new').onclick=()=>reset(true);$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';localStorage.setItem('tetris-theme',document.documentElement.dataset.theme)};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.onkeydown=e=>{const k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'rotate',ArrowDown:'soft',Space:'hard'}[e.code]||((e.key||'').toLowerCase()==='p'?'pause':null);if(k){e.preventDefault();action(k)}};if(localStorage.getItem('tetris-theme')==='light')document.documentElement.dataset.theme='light';reset();raf=requestAnimationFrame(loop);
</script></body></html>
