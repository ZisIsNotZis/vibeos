    <rect x="3" y="7" width="26" height="26" rx="7" stroke-width="2.2"/>
    <path d="M3.9 14.2h24.2" stroke-width="1.6" opacity=".45"/>
    <path d="M16 28.5v-6.2M16 22.3l-5.2-4.4M16 22.3l5.2-4.4" stroke-width="1.8"/>
